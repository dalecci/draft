<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Vibrant BioScan Portal · Dr. Kassandra Francis, DC</title>
<meta name="robots" content="noindex,nofollow" />
<meta name="theme-color" content="#065C8C" />
<link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%23065C8C'/><circle cx='16' cy='16' r='6' fill='%23E8D833'/></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
  --blue: #065C8C; --blue-dark: #03405F; --blue-soft: #E6F1F7; --blue-tint: #F4FAFD; --blue-deep: #0A2540;
  --gold: #E8D833; --gold-dark: #C9B92A; --gold-soft: #FBF6CC;
  --bg: #FAFBFC; --bg-2: #F4F6F8; --panel: #FFFFFF;
  --ink: #101828; --ink-soft: #475467; --ink-mute: #98A2B3;
  --line: #E5E7EB; --line-2: #EEF0F3;
  --good: #16a34a; --good-soft: #DCFCE7;
  --warn: #ea580c; --warn-soft: #FED7AA;
  --bad: #dc2626; --bad-soft: #FEE2E2;
  --info: #2563eb; --info-soft: #DBEAFE;
  --shadow-sm: 0 1px 2px rgba(16,24,40,.05);
  --shadow: 0 4px 16px rgba(16,24,40,.06);
  --shadow-lg: 0 16px 40px rgba(16,24,40,.1);
  --shadow-blue: 0 4px 14px rgba(6,92,140,.18);
  --r: 14px; --r-sm: 10px; --r-lg: 20px;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  color: var(--ink); background: var(--bg); line-height: 1.55;
  -webkit-font-smoothing: antialiased; min-height: 100vh;
}
h1, h2, h3, h4 { font-family: 'Fraunces', Georgia, serif; font-weight: 500; line-height: 1.2; margin: 0 0 .4em; letter-spacing: -.01em; }
h1 { font-size: 1.8rem; font-weight: 400; }
h2 { font-size: 1.45rem; }
h3 { font-size: 1.15rem; }
h4 { font-size: .95rem; font-family: 'Inter', sans-serif; font-weight: 600; }
p { margin: 0 0 .8em; color: var(--ink-soft); }
a { color: var(--blue); text-decoration: none; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
input, textarea, select { font-family: inherit; font-size: .95rem; }
small { color: var(--ink-mute); }

/* ===== Buttons ===== */
.btn { display:inline-flex; align-items:center; gap:.45rem; padding:.55rem 1rem; border-radius: 999px; font-weight: 600; font-size:.88rem; transition: all .15s ease; border: none; white-space: nowrap; cursor: pointer; }
.btn-primary { background: var(--blue); color: white; box-shadow: var(--shadow-blue); }
.btn-primary:hover { background: var(--blue-dark); transform: translateY(-1px); }
.btn-gold { background: var(--gold); color: var(--ink); box-shadow: 0 4px 14px rgba(232,216,51,.4); }
.btn-gold:hover { background: var(--gold-dark); transform: translateY(-1px); }
.btn-ghost { background: var(--panel); color: var(--ink); border: 1px solid var(--line); }
.btn-ghost:hover { background: var(--bg-2); border-color: var(--ink-mute); }
.btn-sm { padding:.35rem .7rem; font-size:.8rem; }
.btn-lg { padding:.85rem 1.5rem; font-size: 1rem; }
.btn-danger { background: var(--bad-soft); color: var(--bad); }
.btn-danger:hover { background: var(--bad); color: white; }

/* ===== Top bar ===== */
.topbar {
  position: sticky; top: 0; z-index: 40;
  background: rgba(255,255,255,.92); backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
  height: 60px;
  display: flex; align-items: center; padding: 0 24px;
  gap: 1rem;
}
.brand {
  display: flex; align-items: center; gap: .6rem;
  font-family: 'Fraunces', serif; font-size: 1.05rem; color: var(--ink);
}
.brand-mark {
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--blue); position: relative;
  display: grid; place-items: center;
}
.brand-mark::before, .brand-mark::after {
  content:''; position:absolute; inset: 8px;
  border-radius: 50%; border: 1.5px solid rgba(232,216,51,.55);
}
.brand-mark::after { inset: 12px; border-color: var(--gold); }
.brand small { display: block; font-family: 'Inter', sans-serif; font-size: .65rem; color: var(--ink-mute); letter-spacing: .1em; text-transform: uppercase; }
.topbar .spacer { flex: 1; }
.demo-badge {
  background: var(--gold-soft); color: var(--blue-deep);
  padding: .3rem .7rem; border-radius: 999px;
  font-size: .72rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
  border: 1px solid var(--gold);
}
.role-pill {
  display: inline-flex; align-items: center; gap: .5rem;
  padding: .35rem .75rem .35rem .35rem; border-radius: 999px;
  background: var(--bg-2); border: 1px solid var(--line);
  font-size: .82rem; color: var(--ink);
}
.role-pill .ava { width: 26px; height: 26px; border-radius: 50%; background: var(--blue); color: white; display:grid; place-items:center; font-size: .8rem; font-weight: 600; }
.role-pill .role { font-size: .68rem; color: var(--ink-mute); display: block; text-transform: uppercase; letter-spacing: .1em; }
.role-pill button { color: var(--ink-mute); padding-left: .4rem; }

/* ===== Login ===== */
.login-screen {
  min-height: calc(100vh - 60px);
  display: grid; place-items: center;
  padding: 2rem;
  background:
    radial-gradient(800px circle at 20% 30%, rgba(232,216,51,.12), transparent 50%),
    radial-gradient(800px circle at 80% 70%, rgba(6,92,140,.1), transparent 50%);
}
.login-card {
  background: var(--panel); border-radius: var(--r-lg); padding: 2.5rem;
  max-width: 540px; width: 100%;
  box-shadow: var(--shadow-lg);
  border: 1px solid var(--line);
}
.login-card h1 { text-align: center; margin-bottom: .3rem; }
.login-card p { text-align: center; margin-bottom: 2rem; }
.login-card .eyebrow {
  text-align: center; display: block; font-size: .7rem; color: var(--blue);
  letter-spacing: .15em; text-transform: uppercase; font-weight: 700; margin-bottom: .8rem;
}
.role-options {
  display: grid; grid-template-columns: 1fr; gap: .6rem; margin-top: 1.5rem;
}
.role-options h3 { font-family:'Inter'; font-size:.7rem; letter-spacing:.12em; text-transform:uppercase; color: var(--ink-mute); margin: 1rem 0 .3rem; font-weight: 600; }
.role-card {
  display: flex; align-items: center; gap: 1rem;
  padding: 1rem 1.1rem; border-radius: var(--r); border: 1px solid var(--line);
  background: var(--bg); cursor: pointer; transition: all .15s ease;
  text-align: left; width: 100%;
}
.role-card:hover { background: var(--blue-tint); border-color: var(--blue); transform: translateY(-1px); }
.role-card .ava { width: 44px; height: 44px; border-radius: 50%; background: var(--blue); color: white; display: grid; place-items: center; font-size: 1.2rem; font-weight: 600; flex-shrink: 0; }
.role-card.kassie .ava { background: linear-gradient(135deg, var(--blue), var(--gold)); }
.role-card .name { font-weight: 600; font-size: 1rem; }
.role-card .sub { color: var(--ink-soft); font-size: .82rem; }

/* ===== App layout (practitioner) ===== */
.app-shell {
  display: grid;
  grid-template-columns: 280px 1fr;
  min-height: calc(100vh - 60px);
}
.sidebar {
  background: var(--panel); border-right: 1px solid var(--line);
  padding: 1.5rem 1rem;
  overflow-y: auto;
  max-height: calc(100vh - 60px);
  position: sticky; top: 60px;
}
.sidebar .section-label { font-size: .68rem; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-mute); font-weight: 700; padding: 0 .8rem; margin: 1.4rem 0 .5rem; }
.sidebar .search {
  position: relative; margin-bottom: 1rem;
}
.sidebar .search input {
  width: 100%; padding: .6rem .9rem .6rem 2.3rem; border-radius: var(--r-sm);
  border: 1px solid var(--line); background: var(--bg);
  font-size: .9rem; outline: none;
}
.sidebar .search input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft); }
.sidebar .search::before {
  content: '🔍'; position: absolute; top: 50%; left: .8rem; transform: translateY(-50%);
  font-size: .85rem; pointer-events: none;
}
.nav-link {
  display: flex; align-items: center; gap: .6rem;
  padding: .55rem .8rem; border-radius: var(--r-sm);
  color: var(--ink-soft); font-size: .9rem; font-weight: 500;
  cursor: pointer; text-decoration: none;
  margin-bottom: 2px;
}
.nav-link:hover { background: var(--bg-2); color: var(--ink); }
.nav-link.active { background: var(--blue-soft); color: var(--blue); font-weight: 600; }
.nav-link .ic { width: 18px; opacity: .7; }
.patient-list { display: flex; flex-direction: column; gap: 2px; }
.patient-item {
  display: flex; align-items: center; gap: .65rem;
  padding: .55rem .7rem; border-radius: var(--r-sm);
  cursor: pointer; transition: background .12s ease;
}
.patient-item:hover { background: var(--bg-2); }
.patient-item.active { background: var(--blue-soft); }
.patient-item.active .pname { color: var(--blue); }
.patient-ava {
  width: 32px; height: 32px; border-radius: 50%;
  background: var(--blue); color: white; display: grid; place-items: center;
  font-size: .82rem; font-weight: 600; flex-shrink: 0;
}
.patient-item .meta { flex: 1; min-width: 0; }
.patient-item .pname { font-size: .88rem; color: var(--ink); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.patient-item .psub { font-size: .73rem; color: var(--ink-mute); }
.patient-item .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.dot.green { background: var(--good); }
.dot.amber { background: var(--warn); }
.dot.gray { background: var(--ink-mute); }

.main {
  padding: 2rem 2.5rem 3rem;
  max-width: 100%;
  overflow-x: hidden;
}
@media (max-width: 900px) {
  .app-shell { grid-template-columns: 1fr; }
  .sidebar { position: static; max-height: none; padding: 1rem; }
  .main { padding: 1.5rem 1.25rem 3rem; }
}

/* ===== Cards & panels ===== */
.card {
  background: var(--panel); border-radius: var(--r); padding: 1.5rem;
  border: 1px solid var(--line); box-shadow: var(--shadow-sm);
}
.card-h {
  display:flex; justify-content:space-between; align-items: center;
  padding-bottom: 1rem; margin-bottom: 1rem; border-bottom: 1px solid var(--line);
}
.card-h h3 { margin: 0; }
.card-h .small-actions { display:flex; gap:.4rem; }
.eyebrow {
  display: inline-block; font-size: .68rem; letter-spacing: .14em; text-transform: uppercase;
  color: var(--blue); font-weight: 700; margin-bottom: .8rem;
}
.eyebrow.gold { color: var(--gold-dark); }
.eyebrow.warn { color: var(--warn); }

/* Page header for patient detail */
.page-head {
  display: flex; align-items: flex-start; gap: 1.2rem;
  margin-bottom: 1.5rem; padding-bottom: 1.5rem; border-bottom: 1px solid var(--line);
}
.page-head .big-ava {
  width: 64px; height: 64px; border-radius: 50%;
  background: var(--blue); color: white; display: grid; place-items: center;
  font-size: 1.6rem; font-weight: 600; flex-shrink: 0;
}
.page-head h1 { margin: 0 0 .3rem; font-size: 1.6rem; }
.page-head .meta-row { display: flex; flex-wrap: wrap; gap: .9rem; color: var(--ink-soft); font-size: .88rem; }
.page-head .meta-row span { display: inline-flex; align-items: center; gap: .3rem; }
.page-head .actions { margin-left: auto; display: flex; gap: .4rem; }

/* Tabs */
.tabs-row {
  display: flex; gap: 4px; border-bottom: 1px solid var(--line);
  margin-bottom: 1.5rem;
  overflow-x: auto;
}
.tab {
  padding: .7rem 1.1rem; border-bottom: 2px solid transparent;
  font-size: .9rem; font-weight: 600; color: var(--ink-soft);
  cursor: pointer; white-space: nowrap; background: none; border-radius: 0;
  margin-bottom: -1px;
}
.tab:hover { color: var(--ink); }
.tab.active { color: var(--blue); border-bottom-color: var(--blue); }
.tab .count { background: var(--bg-2); padding: 1px 6px; border-radius: 999px; font-size: .72rem; margin-left: .35rem; color: var(--ink-soft); }
.tab.active .count { background: var(--blue-soft); color: var(--blue); }

/* Stat tiles */
.stats {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 1rem; margin-bottom: 1.5rem;
}
.stat {
  background: var(--panel); border-radius: var(--r); padding: 1.1rem 1.2rem;
  border: 1px solid var(--line);
}
.stat .lbl { font-size: .7rem; color: var(--ink-mute); letter-spacing: .1em; text-transform: uppercase; font-weight: 600; margin-bottom: .35rem; }
.stat .val { font-family:'Fraunces', serif; font-size: 1.6rem; line-height: 1.1; }
.stat .delta { font-size: .8rem; margin-top: .3rem; font-weight: 600; }
.stat .delta.up { color: var(--bad); }
.stat .delta.down { color: var(--good); }
.stat.gold { background: linear-gradient(135deg, var(--gold-soft), #fffbe7); border-color: var(--gold); }
.stat.blue { background: var(--blue-tint); border-color: var(--blue-soft); }

/* System reactivity bars */
.findings-list { display: flex; flex-direction: column; gap: .8rem; }
.finding {
  display: grid; grid-template-columns: 130px 1fr 60px 100px;
  align-items: center; gap: 1rem;
  padding: .8rem 0; border-bottom: 1px solid var(--line-2);
}
.finding:last-child { border-bottom: none; }
.finding .sys { font-weight: 600; font-size: .95rem; }
.finding .bar { height: 8px; border-radius: 999px; background: var(--bg-2); position: relative; overflow: hidden; }
.finding .bar .fl { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--good), var(--gold), var(--warn), var(--bad)); }
.finding .pct { font-variant-numeric: tabular-nums; font-weight: 600; text-align: right; }
.finding .delta { font-size: .78rem; font-weight: 600; text-align: right; }
.finding .delta.up { color: var(--bad); }
.finding .delta.down { color: var(--good); }
.finding .delta.flat { color: var(--ink-mute); }
@media (max-width: 700px) {
  .finding { grid-template-columns: 100px 1fr; }
  .finding .pct, .finding .delta { grid-column: span 2; text-align: left; padding-left: 100px; padding-top: .2rem; }
}

/* Trend chart */
.chart-wrap { padding: 1rem 0; }
.chart-legend { display: flex; gap: 1rem; flex-wrap: wrap; font-size: .8rem; color: var(--ink-soft); margin-bottom: .8rem; }
.chart-legend .sw { display: inline-flex; align-items: center; gap: .35rem; }
.chart-legend .sw::before { content:''; width: 12px; height: 4px; border-radius: 2px; background: var(--clr); }

/* Protocol */
.protocol-card { padding: 1.5rem; background: linear-gradient(180deg, var(--blue-tint), white); border-radius: var(--r); border: 1px solid var(--blue-soft); }
.protocol-card .ver { font-size: .72rem; color: var(--blue); font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
.supp-list { display: flex; flex-direction: column; gap: .6rem; margin-top: 1rem; }
.supp {
  display: grid; grid-template-columns: 1fr auto;
  padding: .8rem 1rem; background: white; border-radius: var(--r-sm);
  border: 1px solid var(--line); gap: 1rem; align-items: center;
}
.supp .name { font-weight: 600; font-size: .95rem; }
.supp .brand { font-size: .78rem; color: var(--ink-mute); }
.supp .dose { font-size: .85rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; text-align: right; }
.supp .dur { font-size: .76rem; color: var(--ink-mute); }
.lifestyle-list { list-style: none; padding: 0; margin: 1rem 0 0; }
.lifestyle-list li { padding: .55rem 0; border-bottom: 1px dashed var(--line); display: flex; gap: .6rem; }
.lifestyle-list li:last-child { border-bottom: none; }
.lifestyle-list li::before { content: '◆'; color: var(--gold-dark); flex-shrink: 0; }

/* Chat */
.chat-list { display: flex; flex-direction: column; gap: 1rem; padding: 1rem; max-height: 560px; overflow-y: auto; background: var(--bg-2); border-radius: var(--r); }
.msg { max-width: 80%; padding: .8rem 1rem; border-radius: var(--r); position: relative; }
.msg .who { font-size: .72rem; font-weight: 600; color: var(--ink-mute); margin-bottom: .25rem; letter-spacing: .04em; text-transform: uppercase; }
.msg .body { font-size: .92rem; line-height: 1.5; }
.msg .time { font-size: .68rem; color: var(--ink-mute); margin-top: .35rem; }
.msg.patient { background: white; border: 1px solid var(--line); align-self: flex-start; }
.msg.kassie { background: var(--blue); color: white; align-self: flex-end; }
.msg.kassie .who { color: rgba(255,255,255,.7); }
.msg.kassie .time { color: rgba(255,255,255,.6); }
.msg.ai { background: var(--gold-soft); border: 1px solid var(--gold); align-self: flex-start; max-width: 90%; }
.msg.ai .who { color: var(--gold-dark); }
.msg.ai .ai-tag {
  display: inline-block; background: var(--gold); color: var(--ink);
  font-size: .65rem; font-weight: 700; letter-spacing: .1em;
  padding: 1px 6px; border-radius: 4px; margin-left: .4rem; text-transform: uppercase;
}
.msg.draft { background: white; border: 2px dashed var(--gold); align-self: flex-end; }
.msg.draft .who { color: var(--gold-dark); }
.chat-input {
  margin-top: 1rem; padding: 1rem; background: white; border-radius: var(--r); border: 1px solid var(--line);
}
.chat-input textarea {
  width: 100%; min-height: 70px; padding: .6rem; border: 1px solid var(--line);
  border-radius: var(--r-sm); resize: vertical; outline: none;
}
.chat-input textarea:focus { border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft); }
.chat-input-actions { display: flex; justify-content: space-between; align-items: center; margin-top: .6rem; flex-wrap: wrap; gap: .5rem; }
.chat-input-actions .ai-help {
  display: inline-flex; align-items: center; gap: .35rem;
  font-size: .82rem; color: var(--gold-dark); font-weight: 600;
}

/* Knowledge editor */
.kb-editor textarea {
  width: 100%; min-height: 500px;
  padding: 1.2rem; border: 1px solid var(--line); border-radius: var(--r);
  font-family: 'Inter', sans-serif; font-size: .92rem; line-height: 1.6;
  outline: none; resize: vertical;
}
.kb-editor textarea:focus { border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft); }
.kb-info {
  background: var(--gold-soft); border: 1px solid var(--gold);
  padding: 1rem 1.2rem; border-radius: var(--r); margin-bottom: 1.5rem;
  font-size: .9rem; color: var(--blue-deep);
}
.kb-info strong { color: var(--blue-deep); }

/* Modal */
.modal-bg {
  position: fixed; inset: 0; background: rgba(10,37,64,.6);
  backdrop-filter: blur(4px); z-index: 100;
  display: none; justify-content: center; align-items: flex-start;
  padding: 5vh 2rem 2rem; overflow-y: auto;
}
.modal-bg.open { display: flex; }
.modal {
  background: var(--panel); border-radius: var(--r-lg); width: 100%; max-width: 880px;
  padding: 2rem; box-shadow: var(--shadow-lg);
  margin: auto;
}
.modal-h { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 1.4rem; }
.modal-h h2 { margin: 0; }
.modal-h .close { font-size: 1.4rem; color: var(--ink-mute); padding: .2rem .6rem; border-radius: 999px; }
.modal-h .close:hover { background: var(--bg-2); color: var(--ink); }
.modal-body label { display: block; font-size: .82rem; font-weight: 600; color: var(--ink); margin-bottom: .4rem; margin-top: 1rem; }
.modal-body label small { color: var(--ink-mute); font-weight: 400; margin-left: .4rem; }
.modal-body input[type="text"], .modal-body textarea, .modal-body select {
  width: 100%; padding: .65rem .8rem; border: 1px solid var(--line);
  border-radius: var(--r-sm); outline: none; background: white;
}
.modal-body input:focus, .modal-body textarea:focus, .modal-body select:focus { border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-soft); }
.modal-body textarea { min-height: 140px; font-family: inherit; resize: vertical; }
.modal-foot { display: flex; justify-content: flex-end; gap: .6rem; margin-top: 1.5rem; padding-top: 1.2rem; border-top: 1px solid var(--line); }

/* AI thinking indicator */
.ai-thinking {
  display: flex; align-items: center; gap: .6rem;
  padding: 1rem 1.2rem; background: var(--gold-soft); border: 1px solid var(--gold);
  border-radius: var(--r); color: var(--blue-deep);
  margin: 1rem 0;
}
.ai-thinking .dot-pulse {
  display: inline-flex; gap: 3px;
}
.ai-thinking .dot-pulse span {
  width: 6px; height: 6px; border-radius: 50%; background: var(--gold-dark);
  animation: dotPulse 1.2s ease-in-out infinite;
}
.ai-thinking .dot-pulse span:nth-child(2) { animation-delay: .15s; }
.ai-thinking .dot-pulse span:nth-child(3) { animation-delay: .3s; }
@keyframes dotPulse { 0%, 100% { transform: scale(.7); opacity: .5; } 50% { transform: scale(1); opacity: 1; } }

.ai-output {
  background: var(--gold-soft); border: 2px solid var(--gold);
  padding: 1.4rem; border-radius: var(--r); position: relative;
}
.ai-output::before {
  content: 'AI DRAFT'; position: absolute; top: -10px; left: 16px;
  background: var(--gold); color: var(--ink); padding: 2px 8px;
  border-radius: 4px; font-size: .65rem; font-weight: 700; letter-spacing: .1em;
}

  return d.toISOString().slice(0,10);
};
const niceDate = s => {
  if (!s) return '';
  const d = new Date(s + 'T00:00:00');
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
};
const daysAgo = s => {
  if (!s) return '';
  const d = new Date(s + 'T00:00:00');
  const diff = Math.floor((NOW - d) / 86400000);
  if (diff === 0) return 'today';
  // Future dates
  if (diff < 0) {
    const fd = -diff;
    if (fd === 1) return 'in 1 day';
    if (fd < 14) return 'in ' + fd + ' days';
    if (fd < 60) return 'in ' + Math.round(fd/7) + ' weeks';
    return 'in ' + Math.round(fd/30) + ' months';
  }
  if (diff === 1) return 'yesterday';
  if (diff < 7) return diff + ' days ago';
  if (diff < 30) return Math.floor(diff/7) + 'w ago';
  if (diff < 365) return Math.floor(diff/30) + 'mo ago';
  return Math.floor(diff/365) + 'y ago';

function renderOverviewTab(p) {
  const latest = p.scans[p.scans.length-1];
  const prev = p.scans[p.scans.length-2];
  const protocol = p.protocols[p.protocols.length-1];

  if (!latest) {
    return `
      <div class="card">
        <div class="empty">
          <div class="ic">🔬</div>
          <h3>No scan yet</h3>
          <p>Run the first BioScan to start building a baseline.</p>
          <button class="btn btn-primary" onclick="openModal('new-scan','${p.id}')">+ New Scan</button>
        </div>
      </div>
    `;
  }

  const top = [...latest.findings].sort((a,b)=>b.stress-a.stress).slice(0,5);
  const avgScore = Math.round(latest.findings.reduce((a,f) => a+f.stress, 0) / latest.findings.length);
  const prevAvg = prev ? Math.round(prev.findings.reduce((a,f) => a+f.stress, 0) / prev.findings.length) : null;
  const avgDelta = prevAvg !== null ? avgScore - prevAvg : null;

  return `
    <div class="stats">
      <div class="stat blue"><div class="lbl">Latest Scan</div><div class="val">${niceDate(latest.date)}</div><div class="delta down">${daysAgo(latest.date)}</div></div>
      <div class="stat"><div class="lbl">Avg System Stress</div><div class="val">${avgScore}%</div>${avgDelta!==null?`<div class="delta ${avgDelta<0?'down':'up'}">${avgDelta>0?'+':''}${avgDelta} vs prior</div>`:''}</div>
      <div class="stat gold"><div class="lbl">Scans Total</div><div class="val">${p.scans.length}</div></div>
      <div class="stat"><div class="lbl">Next Re-scan</div><div class="val" style="font-size:1.2rem;">${protocol?.rescan ? niceDate(protocol.rescan) : '—'}</div></div>
    </div>

    <div class="grid-2">
      <div class="card">
        <div class="card-h"><h3>Top stressors (latest scan)</h3></div>
        <div class="findings-list">
          ${top.map(f => {
            const old = prev?.findings.find(x => x.system === f.system);
            const delta = old ? f.stress - old.stress : null;
            return findingRow(f, delta);
          }).join('')}
        </div>
      </div>

      <div class="card">
        <div class="card-h"><h3>Trend across scans</h3></div>
        ${renderTrendChart(p)}
      </div>
    </div>

    ${protocol ? `
      <div style="margin-top:1.5rem;">
        <div class="card">
          <div class="card-h">
            <div><span class="ver">Active Protocol · v${protocol.version}</span><h3 style="margin-top:.3rem;">${protocol.goal}</h3></div>
            <div class="small-actions">
              <button class="btn btn-ghost btn-sm" onclick="navigate('/patient/${p.id}/protocol')">View full</button>
            </div>
          </div>
          <div class="supp-list">
            ${protocol.supplements.slice(0,4).map(s => `
              <div class="supp">
                <div><div class="name">${s.name}</div><div class="brand">${s.brand}</div></div>
                <div><div class="dose">${s.dose}</div><div class="dur">${s.duration}</div></div>
              </div>
            `).join('')}
          </div>
        </div>
      </div>
    ` : ''}

    <div style="margin-top:1.5rem;">
      <div class="card">
        <div class="card-h"><h3>Latest scan summary</h3><span class="badge info">${latest.type === 'initial' ? 'Initial' : 'Follow-up'}</span></div>
        <p>${latest.summary}</p>
        ${latest.kassieNotes ? `<div style="background:var(--blue-tint);padding:1rem;border-radius:var(--r);border-left:3px solid var(--blue);"><strong style="font-size:.8rem;color:var(--blue);letter-spacing:.08em;text-transform:uppercase;">Your private note</strong><div style="margin-top:.3rem;">${latest.kassieNotes}</div></div>` : ''}
      </div>
    </div>
  `;
}

function findingRow(f, delta) {
  const cls = f.stress > 80 ? 'bad' : f.stress > 60 ? 'warn' : f.stress > 40 ? 'gold' : 'good';
  return `
    <div class="finding">
      <div class="sys">${f.system}</div>
      <div class="bar"><div class="fl" style="width:${f.stress}%"></div></div>
      <div class="pct">${f.stress}%</div>
      <div class="delta ${delta===null||delta===undefined?'flat':delta>=5?'up':delta<=-5?'down':'flat'}">${delta===null||delta===undefined?'—':(delta>0?'+':'')+delta+' pts'}</div>
    </div>
  `;
}

function renderTrendChart(p) {
  if (p.scans.length < 2) return '<div class="empty"><p>Need at least 2 scans to show a trend.</p></div>';
  const systems = ['Gut','Hormones','Detox','Immune','Adrenals','Mitochondria','Nervous System'];
  const presentSystems = systems.filter(s => p.scans.some(sc => sc.findings.find(f => f.system === s)));
  const tracked = presentSystems.slice(0, 5);
  const colors = ['#065C8C', '#E8D833', '#7c3aed', '#16a34a', '#dc2626'];
  const W = 480, H = 220, P = 30;
  const xStep = (W - 2*P) / Math.max(1, p.scans.length - 1);
  const points = tracked.map((sys, i) => {
    const pts = p.scans.map((sc, idx) => {
      const f = sc.findings.find(x => x.system === sys);
      const y = P + (H - 2*P) * ((f?.stress ?? 0) / 100);
      return [P + idx * xStep, H - y + P]; // invert y for "lower stress = better visually"
    });
    return { sys, color: colors[i], pts };
  });
  return `
    <div class="chart-wrap">
      <div class="chart-legend">
        ${points.map(s => `<span class="sw" style="--clr:${s.color}">${s.sys}</span>`).join('')}
      </div>
      <svg viewBox="0 0 ${W} ${H}" style="width:100%; height: auto;">
        <line x1="${P}" y1="${H-P}" x2="${W-P}" y2="${H-P}" stroke="#E5E7EB" />
        ${[0,25,50,75,100].map(v => {
          const y = P + (H - 2*P) * (1 - v/100);
          return `<line x1="${P}" y1="${y}" x2="${W-P}" y2="${y}" stroke="#F4F6F8" /><text x="6" y="${y+4}" font-size="9" fill="#98A2B3">${v}</text>`;
        }).join('')}
        ${p.scans.map((sc, idx) => `<text x="${P + idx*xStep}" y="${H-8}" font-size="9" fill="#98A2B3" text-anchor="middle">${sc.date.slice(5).replace('-','/')}</text>`).join('')}
        ${points.map(s => `
          <polyline fill="none" stroke="${s.color}" stroke-width="2" points="${s.pts.map(pt=>pt.join(',')).join(' ')}" />
          ${s.pts.map(pt => `<circle cx="${pt[0]}" cy="${pt[1]}" r="3" fill="${s.color}" />`).join('')}
        `).join('')}
      </svg>
      <p style="font-size:.78rem;color:var(--ink-mute);text-align:center;margin-top:.5rem;">Lower line = lower stress = better. Y-axis = % reactivity.</p>
    </div>
  `;
}

  return `

      </div>
      <div class="chat-input">
        <textarea id="chat-text" placeholder="Type your reply..."></textarea>
        <div class="chat-input-actions">
          <button class="ai-help" onclick="aiDraftChatReply('${p.id}')">✨ Draft with AI</button>

function renderChatMsg(m) {
  return `
    <div class="msg ${m.role}">
      <div class="who">${m.author}${m.role==='ai'?' <span class="ai-tag">AI Draft</span>':''}</div>
      <div class="body">${escapeHtml(m.text).replace(/\n/g,'<br>')}</div>
      <div class="time">${m.date}</div>
    </div>
  `;
}

function escapeHtml(s) {
  return (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m]);
}

async function aiDraftChatReply(pid) {
  const p = state.patients.find(x => x.id === pid);
  const lastPatient = [...p.chat].reverse().find(m => m.role === 'patient');
  if (!lastPatient) return alert('No patient message to reply to yet.');
  const txt = document.getElementById('chat-text');
  txt.value = '✨ Drafting...';
  const draft = await AI.draftReply({ patient: p, lastMessage: lastPatient });
  txt.value = draft;
  txt.focus();
}

function sendChat(pid) {
  const p = state.patients.find(x => x.id === pid);
  const txt = document.getElementById('chat-text');
  const val = (txt.value || '').trim();
  if (!val) return;
  p.chat.push({
    role: 'kassie',
    author: 'Dr. Kassie',
    date: new Date().toISOString().replace('T',' ').slice(0,16),
    text: val
  });
  saveState();
  txt.value = '';
  render();
  setTimeout(() => document.getElementById('chat-anchor')?.scrollIntoView({behavior:'smooth'}), 50);
}

function renderNotesTab(p) {
  return `
    <div class="card">
      <div class="card-h"><h3>Clinical Notes (private)</h3><button class="btn btn-primary btn-sm" onclick="addNote('${p.id}')">+ Add note</button></div>
      ${p.notes.length === 0 ? '<div class="empty"><p>No clinical notes yet.</p></div>' : p.notes.slice().reverse().map(n => `
        <div style="padding:.9rem 0;border-bottom:1px solid var(--line-2);">
          <div style="font-size:.78rem;color:var(--ink-mute);font-weight:600;letter-spacing:.08em;text-transform:uppercase;margin-bottom:.3rem;">${niceDate(n.date)}</div>
          <div>${n.text}</div>
        </div>
      `).join('')}
    </div>
  `;
}

function addNote(pid) {
  const p = state.patients.find(x => x.id === pid);
  const txt = prompt('Add clinical note:');
  if (!txt) return;
  p.notes.push({ date: today(), text: txt });
  saveState(); render();
}

        <div style="padding:1rem 0;border-bottom:1px solid var(--line);">
          <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:.5rem;">
            <div><strong>${niceDate(s.date)}</strong> · ${s.type === 'initial' ? 'Initial scan' : 'Follow-up scan'}</div>
            <span class="badge info">${daysAgo(s.date)}</span>
          </div>
          <p style="margin-top:.5rem;font-size:.92rem;">${s.summary.replace(/[A-Za-z]+ rule.*?\./g,'').trim()}</p>
        </div>
      `).join('')}
    </div>
  `;
}

function patientProtocolView(p) {
  const protocol = p.protocols[p.protocols.length-1];
  if (!protocol) return '<div class="card"><div class="empty"><p>Your protocol is being prepared. Dr. Kassie will send it to you soon.</p></div></div>';
  return `
    <div class="protocol-card">
      <span class="ver">Your active protocol · v${protocol.version}</span>
      <h3 style="margin:.4rem 0 1rem;">${protocol.goal}</h3>
      <h4 style="font-family:'Inter';font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);">Supplements</h4>
      <div class="supp-list">
        ${protocol.supplements.map(s => `<div class="supp"><div><div class="name">${s.name}</div><div class="brand">${s.brand}</div></div><div><div class="dose">${s.dose}</div><div class="dur">${s.duration}</div></div></div>`).join('')}
      </div>
      <h4 style="font-family:'Inter';font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);margin-top:1.2rem;">Lifestyle</h4>
      <ul class="lifestyle-list">${protocol.lifestyle.map(l => `<li>${l}</li>`).join('')}</ul>
      <p style="margin-top:1.2rem;font-size:.9rem;"><strong>Custom remedy:</strong> ${protocol.remedy}</p>
      <p style="margin-top:.5rem;"><strong>Next re-scan:</strong> ${niceDate(protocol.rescan)}</p>
    </div>
  `;
}

function patientChatView(p) {
  return `
    <div class="card">
      <div class="card-h"><h3>Messages with Dr. Kassie</h3></div>
      <div class="chat-list">
        ${p.chat.map(m => renderChatMsg(m.role==='kassie' ? {...m, role:'kassie'} : {...m, role:'patient'})).join('')}
      </div>
      <div class="chat-input">
        <textarea id="patient-chat-text" placeholder="Send Dr. Kassie a message..."></textarea>
        <div class="chat-input-actions">
          <small>Replies usually within 24h on weekdays.</small>
          <button class="btn btn-primary" onclick="patientSendChat('${p.id}')">Send</button>
        </div>
      </div>
    </div>
  `;
}

function patientSendChat(pid) {
  const p = state.patients.find(x => x.id === pid);
  const txt = document.getElementById('patient-chat-text');
  const val = (txt.value||'').trim();
  if (!val) return;
  p.chat.push({
    role: 'patient', author: p.name.split(' ')[0],
    date: new Date().toISOString().replace('T',' ').slice(0,16),
    text: val
  });
  saveState(); render();
}

/* ===================================================
   MODALS
   =================================================== */
function openModal(kind, pid) {
  const modalBg = document.getElementById('modal-bg');
  const modal = document.getElementById('modal');
  if (kind === 'new-scan') modal.innerHTML = newScanModal(pid);
  else if (kind === 'new-protocol') modal.innerHTML = newProtocolModal(pid);
  else if (kind === 'new-patient') modal.innerHTML = newPatientModal();
  modalBg.classList.add('open');
  modalBg.onclick = e => { if (e.target === modalBg) closeModal(); };
}
function closeModal() {
  document.getElementById('modal-bg').classList.remove('open');
}

function newScanModal(pid) {
  const p = state.patients.find(x => x.id === pid);
  return `
    <div class="modal-h">
      <div><h2>New BioScan · ${p.name}</h2><small>Paste findings from Qest4 software. AI analyzes against history.</small></div>
      <button class="close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <label>Scan date<small>defaults to today</small></label>
      <input type="text" id="ns-date" value="${today()}" />

      <label>Scan type</label>
      <select id="ns-type">
        <option value="initial">Initial</option>
        <option value="followup" ${p.scans.length>0?'selected':''}>Follow-up</option>
      </select>

      <label>Findings (paste from Qest4 or use sample)<small>Format: System: stress% — item; item; item (one per line)</small></label>
      <textarea id="ns-findings" placeholder="Gut: 78% — Candida signal; Permeability; SIBO suspect&#10;Hormones: 65% — Cortisol flat; Estrogen dominance&#10;Detox: 60% — Phase II soft">${p.scans.length ? sampleFindingsForFollowup(p) : ''}</textarea>

      <div style="display:flex;justify-content:space-between;margin-top:.5rem;">
        <button class="btn btn-ghost btn-sm" onclick="document.getElementById('ns-findings').value = sampleFindingsForFollowup(state.patients.find(x=>x.id==='${pid}'))">📋 Load sample (next-step scan)</button>
      </div>

      <div id="ns-ai-output"></div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-gold" onclick="analyzeNewScan('${pid}')">✨ Analyze with AI</button>
      <button class="btn btn-primary" onclick="saveNewScan('${pid}')">Save scan</button>
    </div>
  `;
}

function sampleFindingsForFollowup(p) {
  // Generate a "next-step" scan based on current latest, with realistic deltas
  const latest = p.scans[p.scans.length-1];
  if (!latest) return 'Gut: 75% — Dysbiosis pattern; Permeability\nHormones: 60% — Cortisol pattern\nDetox: 58% — Phase II soft';
  return latest.findings.map(f => {
    const newStress = Math.max(20, f.stress - Math.floor(Math.random()*15 + 5));
    return `${f.system}: ${newStress}% — ${f.items.slice(0,2).join('; ')}`;
  }).join('\n');
}

function parseFindings(text) {
  return text.split('\n').map(line => {
    const m = line.match(/^([^:]+):\s*(\d+)%\s*[—-]\s*(.*)$/);
    if (!m) return null;
    return { system: m[1].trim(), stress: parseInt(m[2]), items: m[3].split(';').map(s => s.trim()).filter(Boolean) };
  }).filter(Boolean);
}

async function analyzeNewScan(pid) {
  const p = state.patients.find(x => x.id === pid);
  const text = document.getElementById('ns-findings').value;
  const findings = parseFindings(text);
  if (!findings.length) return alert('Could not parse findings — check format.');
  const out = document.getElementById('ns-ai-output');
  out.innerHTML = `<div class="ai-thinking"><span class="dot-pulse"><span></span><span></span><span></span></span><strong>Analyzing with Claude...</strong> &nbsp;<small>Using Dr. Kassie's knowledge base + ${p.scans.length} prior scan${p.scans.length===1?'':'s'}</small></div>`;
  const analysis = await AI.analyzeNewScan({ patient: p, newFindings: findings });
  out.innerHTML = `
    <div class="ai-output">
      <h4>Executive summary</h4>
      <p>${analysis.executiveSummary}</p>
      <h4>Top concerns this scan</h4>
      <ul>
        ${analysis.topConcerns.map(c => `<li><strong>${c.system}</strong> (${c.stress}%) — <em>${c.rationale}</em></li>`).join('')}
      </ul>
      ${analysis.improvements.length ? `<h4 style="color:var(--good)">✓ Improved since last scan</h4><p>${analysis.improvements.join(', ')}</p>` : ''}
      ${analysis.regressions.length ? `<h4 style="color:var(--bad)">⚠ Stress increased</h4><p>${analysis.regressions.join(', ')}</p>` : ''}
      ${analysis.kassieFlags.length ? `<h4 style="color:var(--warn)">🚩 Kassie review flags</h4><ul>${analysis.kassieFlags.map(f => `<li>${f}</li>`).join('')}</ul>` : ''}
      <div style="margin-top:1rem;padding-top:1rem;border-top:1px solid var(--gold-dark);">
        <small>Next step: click "Save scan" then draft a protocol from this analysis.</small>
      </div>
    </div>
  `;
}

function saveNewScan(pid) {
  const p = state.patients.find(x => x.id === pid);
  const findings = parseFindings(document.getElementById('ns-findings').value);
  if (!findings.length) return alert('Add findings first.');
  const newScan = {
    id: 's-' + Date.now(),
    date: document.getElementById('ns-date').value,
    type: document.getElementById('ns-type').value,
    findings,
    summary: 'New scan added by Dr. Kassie. AI analysis available.',
    kassieNotes: ''
  };
  p.scans.push(newScan);
  saveState();
  closeModal();
  render();
}

function newProtocolModal(pid) {
  const p = state.patients.find(x => x.id === pid);
  return `
    <div class="modal-h">
      <div><h2>Draft new protocol · ${p.name}</h2><small>AI uses latest scan + your knowledge base.</small></div>
      <button class="close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <p>This will analyze the latest scan and draft a protocol using your <a href="#/knowledge" onclick="closeModal()">Clinical Knowledge</a> as guidance. Review and edit before publishing to the patient.</p>
      <div id="np-output"><button class="btn btn-gold btn-lg" style="margin: 1rem auto; display:block;" onclick="draftNewProtocol('${pid}')">✨ Draft with AI</button></div>
    </div>
  `;
}

async function draftNewProtocol(pid) {
  const p = state.patients.find(x => x.id === pid);
  const latest = p.scans[p.scans.length-1];
  if (!latest) return alert('Run a scan first.');
  const out = document.getElementById('np-output');
  out.innerHTML = `<div class="ai-thinking"><span class="dot-pulse"><span></span><span></span><span></span></span><strong>Drafting protocol...</strong> <small>Applying Kassie's playbook to top stressors</small></div>`;
  const analysis = await AI.analyzeNewScan({ patient: p, newFindings: latest.findings });
  const draft = await AI.draftProtocol({ patient: p, analysis, knowledge: state.clinicalKnowledge });

  out.innerHTML = `
    <div class="ai-output">
      <h4>Goal</h4>
      <p>${draft.goal}</p>
      <h4>Supplements</h4>
      <div class="supp-list">
        ${draft.supplements.map(s => `
          <div class="supp">
            <div><div class="name">${s.name}</div><div class="brand">${s.brand}</div><div style="font-size:.74rem;color:var(--ink-mute);margin-top:.2rem;">Why: ${s.why}</div></div>
            <div><div class="dose">${s.dose}</div><div class="dur">${s.duration}</div></div>
          </div>
        `).join('')}
      </div>
      ${draft.overflow ? `<p style="margin-top:.6rem;font-size:.85rem;color:var(--ink-mute);">${draft.overflow}</p>` : ''}
      <h4>Lifestyle</h4>
      <ul class="lifestyle-list">${draft.lifestyle.map(l => `<li>${l}</li>`).join('')}</ul>
      <h4>Custom remedy</h4>
      <p>${draft.remedy}</p>
      <h4>Re-scan</h4>
      <p>${niceDate(draft.rescan)}</p>
      <p style="font-size:.8rem;color:var(--ink-mute);"><strong>Compliance check:</strong> ${draft.complianceCheck}</p>
    </div>
    <div style="display:flex; gap:.5rem; margin-top:1rem;">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick='publishProtocol("${pid}", ${JSON.stringify(draft).replace(/"/g,'&quot;')})'>Publish to ${p.name.split(' ')[0]}</button>
    </div>
  `;
}

function publishProtocol(pid, draft) {
  if (typeof draft === 'string') draft = JSON.parse(draft.replace(/&quot;/g,'"'));
  const p = state.patients.find(x => x.id === pid);
  // Archive previous
  p.protocols.forEach(pr => pr.status = 'archived');
  const newVersion = (p.protocols[p.protocols.length-1]?.version || 0) + 1;
  p.protocols.push({
    id: 'pr-' + Date.now(),
    version: newVersion,
    date: today(),
    status: 'active',
    goal: draft.goal,
    supplements: draft.supplements.map(s => ({ name: s.name, brand: s.brand, dose: s.dose, duration: s.duration })),
    lifestyle: draft.lifestyle,
    remedy: draft.remedy,
    rescan: draft.rescan
  });
  saveState();
  closeModal();
  navigate('/patient/' + pid + '/protocol');
}

function newPatientModal() {
  return `
    <div class="modal-h">
      <div><h2>Add new patient</h2></div>
      <button class="close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <label>Name</label><input type="text" id="np-name" />
      <label>Age</label><input type="text" id="np-age" />
      <label>Email</label><input type="text" id="np-email" />
      <label>Program</label>
      <select id="np-program">
        <option>Single Scan</option>
        <option>90-Day Root Cause Reset</option>
        <option>Inner Circle</option>
        <option>90-Day Root Cause Reset (Pediatric)</option>
      </select>
      <label>Chief complaint</label>
      <textarea id="np-complaint" placeholder="What brings them in?"></textarea>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveNewPatient()">Add patient</button>
    </div>
  `;
}

function saveNewPatient() {
  const name = document.getElementById('np-name').value.trim();
  if (!name) return alert('Name required');
  const initials = name.split(' ').map(s => s[0]).slice(0,2).join('').toUpperCase();
  const colors = ['#7c3aed','#0891b2','#16a34a','#ea580c','#dc2626','#0284c7','#9333ea'];
  const newP = {
    id: 'p-' + Date.now(),
    name, initials,
    color: colors[Math.floor(state.patients.length % colors.length)],
    age: parseInt(document.getElementById('np-age').value) || null,
    email: document.getElementById('np-email').value,
    enrolled: today(), program: document.getElementById('np-program').value,
    programStart: today(),
    chiefComplaint: document.getElementById('np-complaint').value || 'New intake — to be filled in.',
    tags: [],
    scans: [], protocols: [], chat: [], notes: []
  };
  state.patients.push(newP);
  saveState(); closeModal();
  navigate('/patient/' + newP.id);
}

/* ===================================================
   INIT
   =================================================== */
function setupLogin() {
  document.querySelectorAll('[data-login]').forEach(btn => {
    btn.addEventListener('click', () => login(btn.dataset.login));
  });
}
setupLogin();
render();
</script>
