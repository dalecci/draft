<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#07090d" />
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>J3Hoops</title>
<meta name="description" content="J3Hoops — Coach Dale's basketball portal. Admin tools and Warriors team training." />
<link rel="icon" type="image/svg+xml" href="/warriors/icon.svg" />
<script>
  // One-shot cleanup: kill any orphan service worker / cache from the
  // original Playmaker-at-root install so devices that still have it
  // installed pick up this new welcome page instead.
  (function () {
    try {
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (regs) {
          regs.forEach(function (r) {
            try {
              var s = r.scope || '';
              if (s === location.origin + '/' || s === location.origin + '/index.html') {
                r.unregister();
              }
            } catch (e) {}
          });
        }).catch(function () {});
      }
      if (window.caches && caches.keys) {
        caches.keys().then(function (keys) {
          keys.forEach(function (k) { try { caches.delete(k); } catch (e) {} });
        }).catch(function () {});
      }
    } catch (e) {}
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #07090d;
    --bg-2: #0c1018;
    --surface: #101316;
    --surface-2: #161a22;
    --border: rgba(255,255,255,0.07);
    --border-2: rgba(255,255,255,0.14);
    --text: #f4f1ea;
    --muted: #8a8f99;
    --faint: #5d6573;
    --gold: #d4af37;
    --gold-2: #f0c75e;
    --gold-glow: rgba(212,175,55,0.32);
    --warriors: #FF6A1F;
    --warriors-2: #FF8A4D;
    --warriors-glow: rgba(255,106,31,0.32);
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(120% 80% at 50% 0%, rgba(212,175,55,0.06), transparent 60%),
      radial-gradient(80% 60% at 50% 100%, rgba(255,106,31,0.05), transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100%;
    display: flex; flex-direction: column;
  }

  header {
    padding: calc(28px + var(--safe-t)) 24px 0;
    text-align: center;
  }
  .brand {
    display: inline-flex; align-items: center; gap: 12px;
    margin: 0 auto;
  }
  .brand-mark {
    width: 44px; height: 44px; border-radius: 12px;
    background: linear-gradient(135deg, var(--gold), #b8902e);
    display: grid; place-items: center;
    color: #1a1208; font-weight: 900; font-size: 18px;
    box-shadow: 0 0 22px var(--gold-glow), inset 0 1px 0 rgba(255,255,255,0.3);
    letter-spacing: 0.5px;
  }
  .brand-name {
    font-weight: 800; font-size: 18px; color: var(--gold-2);
    letter-spacing: 0.22em;
  }

  main {
    flex: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 32px 20px calc(40px + var(--safe-b));
    text-align: center;
  }
  .hero {
    margin: 16px 0 36px;
  }
  .hero .pre {
    display: inline-block; font-size: 11px; letter-spacing: 0.32em;
    color: var(--gold-2); font-weight: 800; text-transform: uppercase;
    padding: 6px 14px; border-radius: 999px;
    background: rgba(212,175,55,0.08);
    border: 1px solid rgba(212,175,55,0.28);
    margin-bottom: 18px;
  }
  .hero h1 {
    font-size: clamp(34px, 7vw, 56px);
    font-weight: 800; letter-spacing: -0.02em;
    line-height: 1.05;
    background: linear-gradient(180deg, #fff 30%, #c2b58c 100%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  .hero p {
    margin-top: 14px;
    color: var(--muted); font-size: 15px;
    max-width: 480px; line-height: 1.55;
  }

  .squares {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 18px;
    width: 100%;
    max-width: 720px;
  }
  @media (max-width: 560px) {
    .squares { grid-template-columns: 1fr; gap: 14px; max-width: 380px; }
  }

  .square {
    position: relative;
    aspect-ratio: 1 / 1;
    border-radius: 22px;
    padding: 26px 22px;
    display: flex; flex-direction: column; justify-content: space-between;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    text-decoration: none;
    overflow: hidden;
    transition: transform .2s ease, border-color .2s, box-shadow .2s;
    cursor: pointer;
  }
  .square::before {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(120% 100% at 0% 0%, var(--accent-tint), transparent 55%);
    opacity: 0.55; pointer-events: none;
    transition: opacity .25s;
  }
  .square:hover, .square:focus-visible {
    transform: translateY(-3px);
    border-color: var(--accent);
    box-shadow: 0 18px 50px -22px var(--accent-glow);
    outline: none;
  }
  .square:hover::before, .square:focus-visible::before { opacity: 1; }
  .square:active { transform: translateY(-1px); }

  .square .icon-box {
    width: 64px; height: 64px; border-radius: 16px;
    display: grid; place-items: center;
    background: var(--accent-soft);
    border: 1px solid var(--accent-border);
    font-size: 28px;
    box-shadow: 0 8px 20px -10px var(--accent-glow);
  }
  .square .meta {
    position: relative; display: flex; flex-direction: column; gap: 6px;
  }
  .square .label {
    font-size: 10px; letter-spacing: 0.24em; text-transform: uppercase;
    color: var(--accent); font-weight: 800;
  }
  .square .title {
    font-size: clamp(20px, 3.5vw, 26px); font-weight: 800; letter-spacing: -0.01em;
    line-height: 1.15;
  }
  .square .sub {
    font-size: 13.5px; color: var(--muted); line-height: 1.45;
  }
  .square .go {
    align-self: flex-start;
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; font-weight: 800;
    color: var(--accent); margin-top: 6px;
  }

  /* Admin (gold) */
  .square.admin {
    --accent: var(--gold-2);
    --accent-soft: rgba(212,175,55,0.14);
    --accent-border: rgba(212,175,55,0.35);
    --accent-glow: var(--gold-glow);
    --accent-tint: rgba(212,175,55,0.10);
  }

  /* Warriors (orange) */
  .square.warriors {
    --accent: var(--warriors-2);
    --accent-soft: rgba(255,106,31,0.15);
    --accent-border: rgba(255,106,31,0.4);
    --accent-glow: var(--warriors-glow);
    --accent-tint: rgba(255,106,31,0.12);
  }

  footer {
    text-align: center;
    padding: 24px 20px calc(20px + var(--safe-b));
    font-size: 11px; color: var(--faint);
    letter-spacing: 0.16em; text-transform: uppercase;
  }
  footer a { color: var(--muted); text-decoration: none; }
  footer a:hover { color: var(--gold-2); }
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="brand-mark">J3</div>
    <div class="brand-name">J3HOOPS</div>
  </div>
</header>

<main>
  <div class="hero">
    <span class="pre">Welcome to</span>
    <h1>J3Hoops</h1>
    <p>Coach Dale's basketball portal. Pick where you're headed.</p>
  </div>

  <div class="squares">
    <a class="square admin" href="/playmaker/" aria-label="Admin — Playmaker court designer">
      <div class="icon-box">🔒</div>
      <div class="meta">
        <div class="label">Coach</div>
        <div class="title">Admin</div>
        <div class="sub">Playmaker, hoops stats, ratings, lineups, and everything else.</div>
        <div class="go">Enter →</div>
      </div>
    </a>

    <a class="square warriors" href="/warriors/" aria-label="Warriors 12U Summer training portal">
      <div class="icon-box">🏀</div>
      <div class="meta">
        <div class="label">Players</div>
        <div class="title">Warriors 12U<br>Summer</div>
        <div class="sub">Video lessons, playbook, drills, and notes from Coach Dale.</div>
        <div class="go">Sign in →</div>
      </div>
    </a>
  </div>
</main>

<footer>
  <a href="/apps/">All apps →</a>
</footer>
</body>
</html>
