<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d1117">
<title>12U Draft Board — Coach Dale</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0d1117;
    color: #e6edf3;
    user-select: none;
    -webkit-user-select: none;
  }
  header {
    background: #161b22;
    padding: 10px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #30363d;
    height: 56px;
  }
  header h1 { font-size: 17px; font-weight: 600; }
  header .actions { display: flex; gap: 8px; }
  .btn {
    padding: 9px 14px;
    border: 1px solid #30363d;
    background: #21262d;
    color: #e6edf3;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    font-family: inherit;
  }
  .btn:active { background: #30363d; }
  .btn-undo { background: #1f3a5f; border-color: #1f6feb; }
  .btn-reset { position: relative; overflow: hidden; background: #5a1d1d; border-color: #8b1f1f; }
  .btn-reset .fill {
    position: absolute; left: 0; top: 0; height: 100%;
    background: rgba(255,255,255,0.25);
    width: 0; transition: width 0.05s linear;
  }
  .btn-reset span { position: relative; z-index: 1; }

  main {
    display: grid;
    grid-template-columns: 1.3fr 1fr 1.1fr;
    gap: 8px;
    padding: 8px;
    height: calc(100vh - 56px);
  }
  .clock-and-roster {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .clock-section {
    border-bottom: 1px solid #30363d;
    flex-shrink: 0;
  }
  .roster-section {
    flex: 1;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding: 4px;
  }
  .section-label {
    padding: 8px 12px 4px;
    font-size: 11px;
    color: #8b949e;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .col {
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    min-height: 0;
  }
  .col-header {
    padding: 11px 14px;
    background: #21262d;
    border-bottom: 1px solid #30363d;
    font-weight: 600;
    font-size: 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
  }
  .count-badge {
    background: #0d1117;
    color: #8b949e;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: 600;
  }
  .col-body {
    overflow-y: auto;
    flex: 1;
    padding: 4px;
    -webkit-overflow-scrolling: touch;
  }

  /* Player row */
  .player {
    padding: 11px 12px;
    margin: 4px;
    border-radius: 8px;
    background: #0d1117;
    border: 1px solid #30363d;
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    transition: transform 0.05s, background 0.15s;
  }
  .player:active { background: #21262d; transform: scale(0.99); }
  .jersey {
    font-weight: 700;
    font-size: 17px;
    min-width: 44px;
    text-align: center;
    background: #21262d;
    padding: 7px 6px;
    border-radius: 6px;
    color: #58a6ff;
    flex-shrink: 0;
  }
  .player-name { flex: 1; font-size: 15px; line-height: 1.25; }
  .player.locked { border-color: #b45309; background: #2a1a08; }
  .player.locked .jersey { color: #fbbf24; background: #3a2410; }
  .locked-tag {
    font-size: 10px;
    background: #b45309;
    color: #fff;
    padding: 3px 7px;
    border-radius: 4px;
    font-weight: 700;
    letter-spacing: 0.3px;
    flex-shrink: 0;
  }

  /* Clock */
  .clock-wrap { padding: 4px; }
  .your-turn {
    background: linear-gradient(135deg, #16a34a, #15803d);
    color: #fff;
    border-radius: 10px;
    padding: 14px;
    margin: 6px;
    text-align: center;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 1px;
    animation: pulse 1.6s infinite;
    box-shadow: 0 0 20px rgba(22,163,74,0.4);
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); box-shadow: 0 0 20px rgba(22,163,74,0.4); }
    50% { transform: scale(1.025); box-shadow: 0 0 30px rgba(22,163,74,0.6); }
  }
  .locked-incoming {
    background: linear-gradient(135deg, #b45309, #92400e);
    color: #fff;
    border-radius: 10px;
    padding: 12px;
    margin: 6px;
    text-align: center;
    font-size: 13px;
    font-weight: 600;
  }
  .locked-incoming .player-line {
    font-size: 18px; font-weight: 800; margin: 6px 0;
  }
  .locked-incoming .btn {
    background: #fff; color: #92400e; margin-top: 4px;
    border: none; font-weight: 700;
  }
  .clock-display { padding: 16px 12px; text-align: center; }
  .clock-label { font-size: 12px; color: #8b949e; letter-spacing: 1.5px; }
  .clock-pick-num { font-size: 64px; font-weight: 800; line-height: 1; margin: 6px 0; color: #e6edf3; }
  .clock-coach { font-size: 22px; font-weight: 700; margin-top: 8px; }
  .clock-coach.dale { color: #4ade80; }
  .clock-round { font-size: 13px; color: #8b949e; margin-top: 4px; }
  .next-up {
    margin: 6px;
    padding: 10px 12px;
    background: #0d1117;
    border-radius: 8px;
    border: 1px solid #30363d;
    font-size: 12px;
    color: #8b949e;
    text-align: center;
  }
  .next-up strong { color: #e6edf3; font-weight: 600; }
  .draft-complete {
    text-align: center;
    font-size: 22px;
    padding: 30px 20px;
    color: #4ade80;
    font-weight: 800;
    letter-spacing: 1px;
  }

  /* Roster */
  .roster-pick {
    padding: 8px 10px;
    margin: 4px;
    background: #0d1117;
    border-radius: 7px;
    display: flex;
    gap: 8px;
    align-items: center;
    border-left: 3px solid #16a34a;
  }
  .roster-pick .pick-num {
    font-size: 11px;
    color: #8b949e;
    min-width: 32px;
    font-weight: 600;
  }
  .roster-pick .jersey {
    font-size: 13px;
    min-width: 36px;
    padding: 4px 5px;
  }
  .roster-pick .player-name { font-size: 13px; }
  .empty-slot {
    padding: 8px 10px;
    margin: 4px;
    background: #0d1117;
    border-radius: 7px;
    border-left: 3px solid #30363d;
    color: #6e7681;
    font-size: 12px;
    display: flex;
    gap: 8px;
  }
  .empty-slot .pick-num { min-width: 32px; font-weight: 600; }

  /* Taken list */
  .taken-row {
    padding: 7px 10px;
    margin: 3px 4px;
    background: #0d1117;
    border-radius: 6px;
    border: 1px solid #30363d;
    display: flex;
    gap: 8px;
    align-items: center;
    font-size: 12px;
  }
  .taken-row.dale {
    border-color: #16a34a;
    background: #0d1f14;
  }
  .taken-row .pick-num {
    font-weight: 700;
    color: #8b949e;
    min-width: 32px;
    font-size: 11px;
  }
  .taken-row.dale .pick-num { color: #4ade80; }
  .taken-row .jersey {
    font-size: 12px;
    min-width: 34px;
    padding: 4px 4px;
  }
  .taken-row .name { flex: 1; font-size: 13px; }
  .taken-row .coach-tag {
    font-size: 10px;
    color: #8b949e;
    font-weight: 600;
  }
  .taken-empty {
    text-align: center;
    color: #6e7681;
    padding: 20px;
    font-size: 13px;
    font-style: italic;
  }

  /* Scrollbar */
  .col-body::-webkit-scrollbar { width: 6px; }
  .col-body::-webkit-scrollbar-thumb { background: #30363d; border-radius: 3px; }

  /* Phone fallback */
  @media (max-width: 720px) {
    main { grid-template-columns: 1fr; grid-template-rows: auto auto auto; }
  }
</style>
</head>
<body>
<header>
  <h1>12U Draft &middot; Coach Dale</h1>
  <div class="actions">
    <button class="btn btn-undo" onclick="undo()">Undo</button>
    <button class="btn btn-reset" id="resetBtn"><span>Hold to Reset</span></button>
  </div>
</header>
<main>
  <section class="col">
    <div class="col-header">
      <span>Best Available</span>
      <span class="count-badge" id="availCount">60</span>
    </div>
    <div class="col-body" id="availList"></div>
  </section>
  <section class="col clock-and-roster">
    <div class="col-header">On the Clock</div>
    <div class="clock-section">
      <div class="clock-wrap" id="clockDisplay"></div>
    </div>
    <div class="section-label">
      <span>Coach Dale's Roster</span>
      <span style="float:right" id="rosterCount">0/10</span>
    </div>
    <div class="roster-section" id="rosterList"></div>
  </section>
  <section class="col">
    <div class="col-header">
      <span>Players Taken</span>
      <span class="count-badge" id="takenCount">0</span>
    </div>
    <div class="col-body" id="takenList"></div>
  </section>
</main>

<script>
// ---- Draft order (snake, 6 teams, 10 rounds) ----
const COACHES_R1 = ['Shawn Morton', 'Dale', 'Crissy', 'Shaun Powell', 'David', 'John'];
const ROUNDS = 10;
const draftOrder = [];
for (let r = 1; r <= ROUNDS; r++) {
  const order = (r % 2 === 1) ? COACHES_R1 : [...COACHES_R1].reverse();
  for (let p = 0; p < 6; p++) {
    draftOrder.push({
      pick: (r - 1) * 6 + p + 1,
      round: r,
      pickInRound: p + 1,
      coach: order[p]
    });
  }
}

// ---- Players (in ranked order; index = rank) ----
// lockedPick = overall pick number where this player MUST be taken
const players = [
  { jersey: 50, name: 'Scarsellato, Nathan' },
  { jersey: 47, name: 'Rosenak, Lane' },
  { jersey: 25, name: 'Leitner, Herbert' },
  { jersey: 13, name: 'Foley, Drew' },
  { jersey: 2,  name: 'Blevins, Kameron' },
  { jersey: 42, name: 'Protsman, Brady' },
  { jersey: 38, name: 'Palmer, Axton', lockedPick: 7 },
  { jersey: 24, name: 'Kautzmann, Bernardo' },
  { jersey: 11, name: 'Erickson, Max' },
  { jersey: 46, name: 'Rios Cairo' },
  { jersey: 15, name: 'Franzke, Kruz' },
  { jersey: 12, name: 'Facenda, Jason' },
  { jersey: 10, name: 'Duran, Michael' },
  { jersey: 44, name: 'Rau, Stephanie' },
  { jersey: 39, name: 'Pemberton, Derrick' },
  { jersey: 9,  name: 'Difalco, Luka' },
  { jersey: 4,  name: 'Carver, Alexander' },
  { jersey: 57, name: 'Wilkerson, Jaks' },
  { jersey: 29, name: 'Martinez, Ronan' },
  { jersey: 59, name: 'Willoughby, Carter' },
  { jersey: 52, name: 'Serio, Jamison' },
  { jersey: 28, name: 'Maldonado, Dominic' },
  { jersey: 36, name: 'Newman, Noah' },
  { jersey: 60, name: 'Wozney, Brantley' },
  { jersey: 22, name: 'Huffman, Joshua' },
  { jersey: 8,  name: 'Cooper, Madison' },
  { jersey: 30, name: 'McCain, Cayden',  lockedPick: 27 },
  { jersey: 41, name: 'Powell, Brogan',  lockedPick: 28 },
  { jersey: 5,  name: 'Clark, Easton' },
  { jersey: 19, name: 'Herring II, John', lockedPick: 30 },
  { jersey: 54, name: 'Sobul, Jacob' },
  { jersey: 53, name: 'Skocik, Jacob' },
  { jersey: 26, name: 'Lewis, Dominick' },
  { jersey: 16, name: 'Garcia, Axel' },
  { jersey: 58, name: 'Williams, Gavin' },
  { jersey: 56, name: 'Weaver, Elliot' },
  { jersey: 43, name: 'Ramirez, Enrique' },
  { jersey: 14, name: 'Francis, Jayden' },
  { jersey: 33, name: 'Morton, Michael',  lockedPick: 39 },
  { jersey: 6,  name: 'Clark, Jamarich',  lockedPick: 40 },
  { jersey: 1,  name: 'Abbate, Daniel',   lockedPick: 41 },
  { jersey: 7,  name: 'Cooper, Ethan' },
  { jersey: 18, name: 'Goossens, Joseph' },
  { jersey: 31, name: 'Merced, Izaiah' },
  { jersey: 40, name: 'Piscopo, Aj' },
  { jersey: 21, name: 'Howe, Gavin' },
  { jersey: 35, name: 'Neff, Phoenix' },
  { jersey: 45, name: 'Rice, Malakhi',    lockedPick: 48 },
  { jersey: 48, name: 'Rosloniec, Owen' },
  { jersey: 55, name: 'Warnecke, Derek' },
  { jersey: 3,  name: 'Brooks, Dean' },
  { jersey: 37, name: 'Page, Harrison' },
  { jersey: 23, name: 'Jasilewicz, Cole' },
  { jersey: 27, name: 'Long, Lucas' },
  { jersey: 17, name: 'Geier, Luke' },
  { jersey: 20, name: 'Heuglin, Reed' },
  { jersey: 32, name: 'Moore, Hudson' },
  { jersey: 34, name: 'Murphy, Rowan' },
  { jersey: 49, name: 'Santo, Dominick' },
  { jersey: 51, name: 'Sebastian, Eli' }
];
players.forEach((p, i) => p.rank = i + 1);

const lockedCoachByPick = {};
players.forEach(p => {
  if (p.lockedPick) lockedCoachByPick[p.lockedPick] = draftOrder[p.lockedPick - 1].coach;
});

// ---- State ----
const STORAGE_KEY = 'draft12u_v1';
let state = loadState() || { drafted: [], history: [] };

function loadState() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)); }
  catch (e) { return null; }
}
function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
}

function currentPickNum() { return state.drafted.length + 1; }
function isDrafted(jersey) { return state.drafted.some(d => d.jersey === jersey); }
function getPlayer(jersey) { return players.find(p => p.jersey === jersey); }

function draftPlayer(jersey) {
  if (isDrafted(jersey)) return;
  const pickNum = currentPickNum();
  if (pickNum > 60) return;
  const player = getPlayer(jersey);
  if (player.lockedPick && player.lockedPick !== pickNum) {
    if (!confirm(`${player.name} (#${player.jersey}) is locked for pick ${player.lockedPick}.\n\nTake them now anyway?`)) return;
  }
  const order = draftOrder[pickNum - 1];
  state.history.push(JSON.parse(JSON.stringify(state.drafted)));
  if (state.history.length > 80) state.history.shift();
  state.drafted.push({ jersey, pickNum, coach: order.coach });
  saveState();
  render();
}

function undo() {
  if (state.history.length === 0) return;
  state.drafted = state.history.pop();
  saveState();
  render();
}

function reset() {
  state = { drafted: [], history: [] };
  saveState();
  render();
}

// ---- Render ----
function render() {
  renderAvailable();
  renderClock();
  renderRoster();
  renderTaken();
}

function renderTaken() {
  const list = document.getElementById('takenList');
  const taken = [...state.drafted].reverse(); // newest first
  document.getElementById('takenCount').textContent = state.drafted.length;
  if (taken.length === 0) {
    list.innerHTML = '<div class="taken-empty">No picks yet</div>';
    return;
  }
  list.innerHTML = taken.map(d => {
    const p = getPlayer(d.jersey);
    const isDale = d.coach === 'Dale';
    return `<div class="taken-row ${isDale ? 'dale' : ''}">
      <div class="pick-num">P${d.pickNum}</div>
      <div class="jersey">#${p.jersey}</div>
      <div class="name">${p.name}</div>
      <div class="coach-tag">${d.coach}</div>
    </div>`;
  }).join('');
}

function renderAvailable() {
  const list = document.getElementById('availList');
  const avail = players.filter(p => !isDrafted(p.jersey));
  document.getElementById('availCount').textContent = avail.length;
  list.innerHTML = avail.map(p => {
    const lockTag = p.lockedPick
      ? `<span class="locked-tag">LOCK P${p.lockedPick} &middot; ${lockedCoachByPick[p.lockedPick]}</span>`
      : '';
    return `<div class="player ${p.lockedPick ? 'locked' : ''}" onclick="draftPlayer(${p.jersey})">
      <div class="jersey">#${p.jersey}</div>
      <div class="player-name">${p.name}</div>
      ${lockTag}
    </div>`;
  }).join('');
}

function renderClock() {
  const display = document.getElementById('clockDisplay');
  const pickNum = currentPickNum();
  if (pickNum > 60) {
    display.innerHTML = '<div class="draft-complete">DRAFT COMPLETE</div>';
    return;
  }
  const order = draftOrder[pickNum - 1];
  const lockedPlayer = players.find(p => p.lockedPick === pickNum && !isDrafted(p.jersey));
  const isYou = order.coach === 'Dale';
  const next = pickNum < 60 ? draftOrder[pickNum] : null;

  let html = '';
  if (isYou) html += '<div class="your-turn">YOU\'RE UP</div>';
  if (lockedPlayer) {
    html += `<div class="locked-incoming">
      LOCKED PICK
      <div class="player-line">#${lockedPlayer.jersey} &middot; ${lockedPlayer.name}</div>
      <button class="btn" onclick="draftPlayer(${lockedPlayer.jersey})">Take Locked Pick</button>
    </div>`;
  }
  html += `<div class="clock-display">
    <div class="clock-label">PICK</div>
