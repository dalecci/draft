<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Le Parfumier: Schedule</title>
<meta name="description" content="Staff schedule, shift swaps, time off and approvals for the three Le Parfumier stores.">
<meta name="theme-color" content="#131019">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2216%22 fill=%22%231a1622%22/><text x=%2250%22 y=%2270%22 text-anchor=%22middle%22 font-family=%22Georgia,serif%22 font-size=%2252%22 fill=%22%23c68ec3%22>LP</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,600&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=9">
<script>try{if(localStorage.getItem("lps_theme")==="light")document.documentElement.setAttribute("data-theme","light");}catch(e){}</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>

<!-- ============================================================ lock gate -->
<div id="lock" class="lock">
  <div class="lock-card">
    <div class="crest reveal r1">LP</div>
    <div class="lock-mark reveal r2">SCHEDULE</div>
    <div class="lock-title reveal r3">Le Parfumier</div>
    <h1 class="lock-welcome reveal r4">Team <em>schedule</em></h1>
    <p class="lock-hook reveal r5">Enter the store code, then tap your name.</p>
    <div class="reveal r6">
      <input id="lock-input" class="lock-input" type="password" inputmode="numeric" maxlength="8" autocomplete="off" placeholder="0000" aria-label="Store code">
      <button id="lock-btn" class="lock-btn">Continue</button>
      <p id="lock-error" class="lock-error" role="status"></p>
    </div>
  </div>
</div>

<!-- ========================================================== name picker -->
<div id="picker" class="picker hidden">
  <div class="picker-inner">
    <div class="crest">LP</div>
    <h1 class="picker-title">Who's this?</h1>
    <p class="picker-sub">Tap your name, then enter your PIN.</p>
    <div id="picker-grid" class="picker-grid"></div>
    <p id="picker-status" class="picker-status"></p>
  </div>
</div>

<!-- ================================================================== app -->
<div id="app" class="app hidden">
  <aside class="rail">
    <div class="rail-crest">LP</div>
    <div class="rail-mark">SCHEDULE</div>
    <nav class="rail-nav" id="rail-nav">
      <button class="rail-btn" data-route="#mine" title="Your schedule">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
        <span>Your schedule</span>
      </button>
      <button class="rail-btn" data-route="#week" title="Your week">
        <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 4v17M16 4v17"/></svg>
        <span>Your week</span>
      </button>
      <button class="rail-btn" data-route="#master" title="Master schedule">
        <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="8" cy="6" r="1.6"/><circle cx="14" cy="12" r="1.6"/><circle cx="10" cy="18" r="1.6"/></svg>
        <span>Master</span>
      </button>
      <button class="rail-btn" data-route="#requests" title="Swap requests">
        <svg viewBox="0 0 24 24"><path d="M7 7h11l-3-3M17 17H6l3 3"/></svg>
        <span>Requests</span><span class="rail-count" id="req-count" hidden>0</span>
      </button>
      <button class="rail-btn" data-route="#timeoff" title="Block-outs and PTO">
        <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M9 15l2 2 4-4"/></svg>
        <span>Time off</span>
      </button>
      <button class="rail-btn admin-only" data-route="#admin" title="Manage" hidden>
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        <span>Manage</span><span class="rail-count" id="admin-count" hidden>0</span>
      </button>
    </nav>
    <div class="rail-foot">
      <button class="whoami" id="whoami" title="Switch person"><span class="av" id="whoami-av"></span><span id="whoami-name">—</span><small>switch</small></button>
      <button class="rail-icon" id="theme-btn" title="Day / night" aria-label="Switch between day and night"><svg class="ic-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><svg class="ic-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
      <div class="rail-ver" id="rail-ver"></div>
    </div>
  </aside>

  <main class="main" id="main"></main>
</div>

<div id="sheet" class="sheet hidden" role="dialog" aria-modal="true">
  <div class="sheet-backdrop" id="sheet-backdrop"></div>
  <div class="sheet-card" id="sheet-card"></div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="app.js?v=9"></script>
<script src="solver.js?v=9"></script>
<script src="views.js?v=9"></script>
<script src="ai.js?v=9"></script>
<script src="admin.js?v=9"></script>
</body>
</html>
