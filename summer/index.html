function ymd(d){
  const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),da=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${da}`;
}
function minutesNow(){
  const n=new Date();
  return n.getHours()*60 + n.getMinutes();
}
function parseTime(t){ // 'HH:MM:SS' -> minutes
  const [h,m] = t.split(':');
  return parseInt(h)*60 + parseInt(m);
}
function formatTime(min, withAmPm = true){
  const h = Math.floor(min/60), m = min%60;
  if(!withAmPm) return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;
  const ap = h>=12?'pm':'am';
  const h12 = h%12===0?12:h%12;
  return `${h12}:${String(m).padStart(2,'0')}${ap}`;
}
function toHMS(min){
  const h=Math.floor(min/60),m=min%60;
  return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:00`;
}
function escapeHtml(s){
  return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function toast(msg, kind='ok'){
  const host = document.getElementById('toast');
  const colors = {ok:'bg-emerald-500',err:'bg-rose-500',info:'bg-sky-500'};
  const t = document.createElement('div');
  t.className = `${colors[kind]||colors.ok} text-white px-5 py-3 rounded-xl shadow-2xl pointer-events-auto slide-up font-semibold mt-2`;
  t.textContent = msg;
  host.appendChild(t);
  setTimeout(()=>{t.style.opacity='0';t.style.transition='opacity .3s';setTimeout(()=>t.remove(),300);}, kind==='err'?5000:2200);
}
function err(prefix,e){
  console.error(prefix, e);
  toast(`${prefix}: ${e?.message||e}`, 'err');
}
function confetti(){
  const host = document.getElementById('confetti-host');

  for(let i=0;i<60;i++){

    setTimeout(()=>c.remove(), 2800);
  }
}
function getActivity(id){ return state.activities.find(a=>a.id===id); }

function todaySlotsResolved(){
  // Returns slots for today, with activity resolved (applying any swaps).
  const dow = new Date().getDay();
  return state.slots
    .filter(s=>s.day_of_week===dow)
    .slice()
    .sort((a,b)=>parseTime(a.start_time)-parseTime(b.start_time))
    .map(s=>{
      const swap = state.swaps.find(sw=>sw.slot_id===s.id);
      const aid = swap ? swap.new_activity_id : s.activity_id;
      return { ...s, resolved_activity_id: aid, activity: getActivity(aid) };
    });
}
function slotForDayResolved(dow, date){
  return state.slots
    .filter(s=>s.day_of_week===dow)
    .slice()
    .sort((a,b)=>parseTime(a.start_time)-parseTime(b.start_time))
    .map(s=>{

      const aid = swap ? swap.new_activity_id : s.activity_id;
      return { ...s, resolved_activity_id: aid, activity: getActivity(aid) };
    });
}
function currentSlotIndex(slots){
  const now = minutesNow();
  for(let i=0;i<slots.length;i++){
    const s = slots[i];
    const start = parseTime(s.start_time);
    const end = start + s.duration_min;
    if(now>=start && now<end) return i;
  }
  return -1;
}
function nextSlotIndex(slots){
  const now = minutesNow();
  for(let i=0;i<slots.length;i++){
    if(parseTime(slots[i].start_time) > now) return i;
  }
  return -1;
}

function enableAudio(){

  try{

    if(audioCtx.state==='suspended') audioCtx.resume();
    state.audioEnabled = true;
  }catch(e){}
}
function playChime(kind='ding'){
  if(!audioCtx) return;
  const now = audioCtx.currentTime;
  const tones = kind==='alert' ? [880, 1320, 880, 1320] : (kind==='warn' ? [660, 880] : [880, 1320]);
  tones.forEach((freq, i)=>{
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.frequency.value = freq;
    o.type = 'sine';
    o.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(0, now + i*0.18);
    g.gain.linearRampToValueAtTime(.3, now + i*0.18 + 0.02);
    g.gain.exponentialRampToValueAtTime(.001, now + i*0.18 + 0.5);
    o.start(now + i*0.18);
    o.stop(now + i*0.18 + 0.5);
  });
}
function playCheckSound(){
  if(!audioCtx) return;
  const now = audioCtx.currentTime;
  [523.25, 659.25, 783.99, 1046.5].forEach((freq, i)=>{
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.frequency.value = freq;
    o.type = 'triangle';
    o.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(0, now + i*0.06);
    g.gain.linearRampToValueAtTime(.25, now + i*0.06 + 0.01);
    g.gain.exponentialRampToValueAtTime(.001, now + i*0.06 + 0.3);
    o.start(now + i*0.06);
    o.stop(now + i*0.06 + 0.3);
  });
}
function speak(text){
  if(!('speechSynthesis' in window)) return;
  try{
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.rate = 1.0; u.pitch = 1.1; u.volume = 1.0;
    window.speechSynthesis.speak(u);
  }catch(e){}
}

async function setSwap(slot_id, new_activity_id){
  const existing = state.swaps.find(s=>s.slot_id===slot_id);
  if(existing){
    if(new_activity_id === null){
      const {error} = await supa.from('summer_swaps').delete().eq('id', existing.id);
      if(error) err('Remove swap failed', error);
    } else {
      const {error} = await supa.from('summer_swaps').update({new_activity_id}).eq('id', existing.id);
      if(error) err('Update swap failed', error);
    }
  } else {
    const {error} = await supa.from('summer_swaps').insert({date: state.today, slot_id, new_activity_id});
    if(error) err('Add swap failed', error);
  }
}

async function toggleCompletion(kid_id, slot_id){
  const existing = state.completions.find(c=>c.kid_id===kid_id && c.slot_id===slot_id);
  if(existing){
    const {error} = await supa.from('summer_completions').delete().eq('id', existing.id);
    if(error){ err('Uncheck failed', error); return false; }
    return false;
  }
  const {error} = await supa.from('summer_completions').insert({kid_id, slot_id, date: state.today});
  if(error){ err('Check failed', error); return false; }
  return true;
}

async function copyDay(fromDow, toDows){
  const fromSlots = state.slots.filter(s=>s.day_of_week===fromDow);
  if(fromSlots.length===0){ toast('Nothing to copy from that day','info'); return; }
  // Remove existing from target days
  for(const d of toDows){
    const existing = state.slots.filter(s=>s.day_of_week===d).map(s=>s.id);
    if(existing.length){
      const {error} = await supa.from('summer_schedule_slots').delete().in('id', existing);
      if(error){ err('Clear day failed', error); return; }
    }
  }
  const inserts = [];
  for(const d of toDows){
    for(const s of fromSlots){
      inserts.push({day_of_week:d, start_time:s.start_time, duration_min:s.duration_min, activity_id:s.activity_id});
    }
  }
  if(inserts.length){
    const {error} = await supa.from('summer_schedule_slots').insert(inserts);
    if(error){ err('Copy failed', error); return; }
  }
  toast(`Copied to ${toDows.length} day(s)`,'ok');
}

async function checkAndAwardBadges(kid_id){
  const earned = state.badges.filter(b=>b.kid_id===kid_id).map(b=>b.badge_code);
  const award = async (code)=>{
    if(earned.includes(code)) return;
    const {error} = await supa.from('summer_badges').insert({kid_id, badge_code:code});
    if(!error){
      const b = BADGES.find(x=>x.code===code);
      toast(`🎉 Badge: ${b.label}!`, 'ok');
      confetti();
    }
  };
  const kidCompletions = state.completions.filter(c=>c.kid_id===kid_id);
  // First check
  if(kidCompletions.length>=1) await award('first_check');
  // Early bird: 3 checks before 10am today
  const before10 = kidCompletions.filter(c=>{
    const slot = state.slots.find(s=>s.id===c.slot_id);
    return slot && parseTime(slot.start_time) < 600;
  }).length;
  if(before10>=3) await award('early_bird');
  // Perfect day
  const todaySlots = todaySlotsResolved();
  if(todaySlots.length>0 && todaySlots.every(s=>isCompleted(kid_id, s.id))){
    await award('perfect_day');
  }
  // Iron Man: 5 workout activities
  const isCategory = (slot_id, cat) => {
    const slot = state.slots.find(s=>s.id===slot_id);
    if(!slot) return false;
    const swap = state.swaps.find(sw=>sw.slot_id===slot_id);
    const aid = swap ? swap.new_activity_id : slot.activity_id;
    const act = getActivity(aid);
    return act && act.category===cat;
  };
  // Across all dates we'd need to query; for now count today's
  const workouts = kidCompletions.filter(c=>isCategory(c.slot_id,'fitness')).length;
  if(workouts>=5) await award('iron_man');
  const reads = kidCompletions.filter(c=>isCategory(c.slot_id,'learning')).length;
  if(reads>=5) await award('bookworm');
  const chores = kidCompletions.filter(c=>isCategory(c.slot_id,'chore')).length;
  if(chores>=5) await award('helper');
}

function subscribeRealtime(){
  if(realtimeChannel){ supa.removeChannel(realtimeChannel); }
  realtimeChannel = supa.channel('summer-app-' + Math.random().toString(36).slice(2))
    .on('postgres_changes', {event:'*', schema:'public', table:'summer_kids'}, ()=>refresh('kids'))
    .on('postgres_changes', {event:'*', schema:'public', table:'summer_activities'}, ()=>refresh('activities'))
    .on('postgres_changes', {event:'*', schema:'public', table:'summer_schedule_slots'}, ()=>refresh('slots'))
    .on('postgres_changes', {event:'*', schema:'public', table:'summer_swaps'}, ()=>refresh('swaps'))
    .on('postgres_changes', {event:'*', schema:'public', table:'summer_completions'}, ()=>refresh('completions'))
    .on('postgres_changes', {event:'*', schema:'public', table:'summer_badges'}, ()=>refresh('badges'))
    .subscribe(status=>{
      if(status==='CHANNEL_ERROR' || status==='TIMED_OUT'){
        console.warn('Realtime status:', status);
      }
    });
}
async function refresh(which){
  try{
    if(which==='kids'){
      const {data} = await supa.from('summer_kids').select('*').order('sort_order');
      state.kids = data || [];
    } else if(which==='activities'){
      const {data} = await supa.from('summer_activities').select('*').order('sort_order');
      state.activities = data || [];
    } else if(which==='slots'){
      const {data} = await supa.from('summer_schedule_slots').select('*');
      state.slots = data || [];
    } else if(which==='swaps'){
      const {data} = await supa.from('summer_swaps').select('*').eq('date', state.today);
      state.swaps = data || [];
    } else if(which==='completions'){
      const {data} = await supa.from('summer_completions').select('*').eq('date', state.today);
      state.completions = data || [];
    } else if(which==='badges'){
      const {data} = await supa.from('summer_badges').select('*');
      state.badges = data || [];
    }
    render();
  }catch(e){ err('Refresh failed', e); }
}

//=========================================================================
// ALERT TICKER (Phase 1 notifications)
//=========================================================================
function tick(){
  const newToday = ymd(new Date());
  if(newToday !== state.today){
    state.today = newToday;
    state.lastAlertedSlotKey = null;
    state.lastWarnedSlotKey = null;
    refresh('swaps');
    refresh('completions');
  }
  if(!state.audioEnabled) return;
  const slots = todaySlotsResolved();
  const now = minutesNow();
  // 1-min warning
  for(const s of slots){
    const start = parseTime(s.start_time);
    if(start - now === 1){
      const key = `${state.today}-${s.id}-warn`;
      if(state.lastWarnedSlotKey !== key){
        state.lastWarnedSlotKey = key;
        playChime('warn');
        speak(`One minute until ${s.activity?.name || 'the next activity'}`);
      }
    }
  }
  // Slot just started
  for(const s of slots){
    const start = parseTime(s.start_time);
    if(start === now){
      const key = `${state.today}-${s.id}-start`;
      if(state.lastAlertedSlotKey !== key){
        state.lastAlertedSlotKey = key;
        playChime('alert');
        speak(`Time for ${s.activity?.name || 'the next activity'}`);
      }
    }
  }
  // Re-render the current view every minute so the "current slot" updates
  if(state.view==='kid' || state.view==='parent') render();
}

//=========================================================================
// RENDER — TOP LEVEL
//=========================================================================
function render(){
  const app = document.getElementById('app');
  if(state.view==='loading'){
    app.innerHTML = `<div class="min-h-screen flex items-center justify-center"><div class="text-6xl animate-spin">☀️</div></div>`;
    return;
  }
  if(state.setupNeeded && !state.isParent && state.view!=='setup'){
    state.view = 'setup';
  }
  switch(state.view){
    case 'login': app.innerHTML = renderLogin(); break;
    case 'kid': app.innerHTML = renderKid(); break;
    case 'parent': app.innerHTML = renderParent(); break;
    case 'editor': app.innerHTML = renderEditor(); break;
    case 'library': app.innerHTML = renderLibrary(); break;
    case 'kidsetup': app.innerHTML = renderKidsSetup(); break;
    case 'setup': app.innerHTML = renderInitialSetup(); break;
    case 'kidstats': app.innerHTML = renderKidStats(); break;
    default: app.innerHTML = renderLogin();
  }
  attachHandlers();
  if(state.modal) document.body.insertAdjacentHTML('beforeend', renderModal());
}

function renderKid(){
  const kid = getKid(state.currentKidId);

  const curIdx = currentSlotIndex(slots);
  const completed = slots.filter(s=>isCompleted(kid.id, s.id)).length;
  const total = slots.length;
  const pct = total? Math.round(completed/total*100) : 0;
  const earnedBadges = state.badges.filter(b=>b.kid_id===kid.id).map(b=>BADGES.find(x=>x.code===b.badge_code)).filter(Boolean);

  let avatarPicker = '';
  if(!kid.avatar || kid.avatar==='⭐'){

        </div>
      </div>`;
  }

  const slotCards = slots.map((s,i)=>{
    const done = isCompleted(kid.id, s.id);
    const start = parseTime(s.start_time);
    const end = start + s.duration_min;
    const now = minutesNow();
    const isCurrent = i===curIdx;
    const isPast = now>=end;
    const isFuture = now<start;
    const act = s.activity;
    const bg = act?.color || '#475569';
    const cls = [
      'rounded-2xl p-4 flex items-center gap-4 transition-all',
      isCurrent ? 'ring-current pulse-glow scale-[1.02]' : '',
      isPast && !done ? 'opacity-50' : '',
      done ? 'opacity-75' : '',
    ].join(' ');
    return `
      <div class="${cls}" style="background:${bg};">
        <div class="text-5xl">${act?.emoji || '❓'}</div>
        <div class="flex-1 min-w-0">
          <div class="text-xs font-bold text-white/80">${formatTime(start)} – ${formatTime(end)} · ${s.duration_min}min</div>

//=========================================================================
// EVENT HANDLERS
//=========================================================================
function attachHandlers(){
  document.querySelectorAll('[data-act]').forEach(el=>{
    el.addEventListener('click', handleClick);
    if(el.tagName==='INPUT') el.addEventListener('change', handleChange);
  });
}
async function handleClick(e){
  const act = e.currentTarget.dataset.act;
  const id = e.currentTarget.dataset.id;
  const slot = e.currentTarget.dataset.slot;
  enableAudio();
  switch(act){
    case 'select-kid':
      state.currentKidId = id;
      state.isParent = false;
      state.view = 'kid';
      render();
      break;
    case 'parent-login':
      promptPin();
      break;
    case 'back-to-login':
      state.currentKidId = null;
      state.isParent = false;
      state.view = 'login';
      render();
      break;
    case 'kid-stats':
      state.view = 'kidstats'; render(); break;
    case 'back-kid':
      state.view = 'kid'; render(); break;
    case 'pick-avatar': {
      const emoji = e.currentTarget.dataset.emoji;
      await updateKid(state.currentKidId, {avatar: emoji});
      break;
    }
    case 'toggle-check': {
      const wasDone = isCompleted(state.currentKidId, slot);
      const ok = await toggleCompletion(state.currentKidId, slot);
      if(!wasDone && ok){
        playCheckSound();
        confetti();
        setTimeout(()=>checkAndAwardBadges(state.currentKidId), 400);
      }
      break;
    }
    case 'goto-parent': state.view='parent'; render(); break;
    case 'goto-editor': state.view='editor'; render(); break;
    case 'goto-library': state.view='library'; render(); break;
    case 'goto-kidsetup': state.view='kidsetup'; render(); break;
    case 'pick-day': state.editorDay = parseInt(e.currentTarget.dataset.day); render(); break;
    case 'add-kid': showAddKidModal(); break;
    case 'edit-kid-avatar': showAvatarModal(id); break;
    case 'recolor-kid': await updateKid(id, {color: e.currentTarget.dataset.color}); break;
    case 'delete-kid':
      if(confirm('Delete this kid? (Also removes their completions and badges.)')){
        await deleteKid(id);
      }
      break;
    case 'add-slot': showAddSlotModal(); break;
    case 'edit-slot': showEditSlotModal(id); break;
    case 'delete-slot':
      if(confirm('Delete this slot?')) await deleteSlot(id);
      break;
    case 'copy-day': showCopyDayModal(); break;
    case 'add-activity': showActivityModal(null); break;
    case 'edit-activity': showActivityModal(id); break;
    case 'swap-slot': showSwapModal(slot); break;
    case 'unswap-slot': await setSwap(slot, null); break;
    case 'close-modal':
    case 'close-modal-bg':
      if(act==='close-modal-bg' && e.target!==e.currentTarget) return;
      closeModal();
      break;
  }
}
function handleChange(e){
  const act = e.currentTarget.dataset.act;
  const id = e.currentTarget.dataset.id;
  if(act==='rename-kid'){ updateKid(id, {name: e.currentTarget.value}); }
}

function promptPin(){
  const html = `
    <div class="text-center mb-3">
      <div class="text-4xl mb-2">🔑</div>
      <h2 class="text-xl font-black">Parent PIN</h2>
    </div>
    <input id="pin-input" type="password" inputmode="numeric" maxlength="6" class="w-full bg-slate-700 rounded-xl px-4 py-3 text-center text-2xl font-black tracking-widest mb-3" placeholder="••••">
    <div class="flex gap-2">
      <button data-act="close-modal" class="flex-1 bg-slate-700 rounded-xl py-3 font-bold">Cancel</button>
      <button id="pin-submit" class="flex-1 bg-amber-400 text-slate-900 rounded-xl py-3 font-black">Unlock</button>
    </div>`;
  showModal(html);
  setTimeout(()=>{
    const input = document.getElementById('pin-input');
    const submit = document.getElementById('pin-submit');
    const tryUnlock = ()=>{
      if(input.value === PARENT_PIN){
        closeModal();
        state.isParent = true;
        state.view = 'parent';
        if(state.activities.length===0) seedActivitiesIfEmpty().then(render);
        render();
      } else {
        input.value=''; input.placeholder='wrong';
        input.style.animation='shake .4s'; setTimeout(()=>input.style.animation='',500);
      }
    };
    input.focus();
    input.addEventListener('keydown',e=>{ if(e.key==='Enter') tryUnlock(); });
    submit.addEventListener('click', tryUnlock);
  },50);
}

function slotFormHtml(s){

  const durOpts = DURATIONS.map(d=>`<option value="${d}"${s&&s.duration_min===d?' selected':''}>${d} min</option>`).join('');
  const actOpts = state.activities.map(a=>`<option value="${a.id}"${s&&s.activity_id===a.id?' selected':''}>${a.emoji} ${a.name}</option>`).join('');
  return `
    <div class="grid gap-2">
      <label class="text-sm text-slate-300">Start time</label>
      <select id="slot-time" class="bg-slate-700 rounded-xl px-3 py-2 font-bold">${timeOpts}</select>
      <label class="text-sm text-slate-300">Duration</label>
      <select id="slot-dur" class="bg-slate-700 rounded-xl px-3 py-2 font-bold">${durOpts}</select>
      <label class="text-sm text-slate-300">Activity</label>
      <select id="slot-act" class="bg-slate-700 rounded-xl px-3 py-2 font-bold">${actOpts}</select>
    </div>`;
}

function showActivityModal(activity_id){
  const isEdit = !!activity_id;
  const a = isEdit ? state.activities.find(x=>x.id===activity_id) : null;
  const palette = ['#fb923c','#22d3ee','#a78bfa','#34d399','#facc15','#f87171','#60a5fa','#f472b6','#94a3b8'];
  const cats = ['meal','hygiene','learning','fitness','play','chore','rest','other'];
  const html = `
    <h2 class="text-xl font-black mb-3">${isEdit?'Edit Activity':'Add Activity'}</h2>
    <input id="act-name" placeholder="Name" value="${a?escapeHtml(a.name):''}" class="w-full bg-slate-700 rounded-xl px-4 py-3 mb-3 font-bold">
    <input id="act-emoji" placeholder="Emoji (e.g. 🏀)" value="${a?escapeHtml(a.emoji):''}" maxlength="4" class="w-full bg-slate-700 rounded-xl px-4 py-3 mb-3 font-bold text-2xl text-center">
    <div class="text-sm text-slate-300 mb-1">Color</div>
    <div class="flex gap-2 mb-3 flex-wrap">
      ${palette.map((c,i)=>`<button data-color="${c}" class="act-color w-9 h-9 rounded-full" style="background:${c};border:${(a?a.color===c:i===0)?'3px solid white':'none'};"></button>`).join('')}
    </div>
    <div class="text-sm text-slate-300 mb-1">Category</div>
    <select id="act-cat" class="w-full bg-slate-700 rounded-xl px-3 py-2 mb-4 font-bold">
      ${cats.map(c=>`<option value="${c}"${a&&a.category===c?' selected':''}>${c}</option>`).join('')}
    </select>
    <div class="flex gap-2">
      <button data-act="close-modal" class="flex-1 bg-slate-700 rounded-xl py-3 font-bold">Cancel</button>
      ${isEdit?'<button id="act-del" class="bg-rose-600 text-white px-4 rounded-xl font-bold">Delete</button>':''}
      <button id="act-save" class="flex-1 bg-emerald-500 text-slate-900 rounded-xl py-3 font-black">${isEdit?'Save':'Add'}</button>
    </div>`;
  showModal(html);
  setTimeout(()=>{
    let chosen = a?a.color:palette[0];
    document.querySelectorAll('.act-color').forEach(b=>{
      b.addEventListener('click', ()=>{
        chosen = b.dataset.color;
        document.querySelectorAll('.act-color').forEach(x=>x.style.border='none');
        b.style.border = '3px solid white';
      });
    });
    document.getElementById('act-save').addEventListener('click', async ()=>{
      const name = document.getElementById('act-name').value.trim();
      const emoji = document.getElementById('act-emoji').value.trim() || '⭐';
      const category = document.getElementById('act-cat').value;
      if(!name){ toast('Name required','err'); return; }
      if(isEdit) await updateActivity(activity_id, {name, emoji, color:chosen, category});
      else await addActivity({name, emoji, color:chosen, category});
      closeModal();
    });
    if(isEdit){
      document.getElementById('act-del').addEventListener('click', async ()=>{
        if(confirm('Delete this activity?')){
          await deleteActivity(activity_id);
          closeModal();
        }
      });
    }
  },50);
}

function showSwapModal(slot_id){
  const tiles = state.activities.map(a=>`<button class="swap-pick rounded-xl p-2 flex flex-col items-center gap-1" style="background:${a.color};" data-aid="${a.id}">

      b.addEventListener('click', async ()=>{
        await setSwap(slot_id, b.dataset.aid);

}

async function init(){
  state.view = 'loading';
  render();
  await loadAll();
  subscribeRealtime();
  if(state.kids.length>0 && !state.setupNeeded){
    state.view = 'login';
  } else if(state.setupNeeded){
    state.view = 'setup';
  } else {
    state.view = 'login';
  }
  render();
  // Tick every 30 seconds for alerts; every minute is enough for slot triggers but 30s ensures we catch the boundary
  tickInterval = setInterval(tick, 30000);
  // Also update view periodically so "current slot" stays accurate
  setInterval(()=>{ if(state.view==='kid'||state.view==='parent') render(); }, 60000);
  // Wake events for audio
  document.addEventListener('click', enableAudio, {once:true});
  document.addEventListener('touchstart', enableAudio, {once:true});
}

init();
</script>
