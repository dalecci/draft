<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<title>Fuel — Food & Nutrition for Kids</title>
<meta name="theme-color" content="#10b981" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Fuel" />
<link rel="preconnect" href="https://world.openfoodfacts.org" />
<style>
  :root {
    --bg: #0a0d12;
    --bg-2: #0f1419;
    --panel: rgba(22, 28, 36, 0.85);
    --panel-solid: #161c24;
    --panel-2: #1d2530;
    --panel-3: #28313e;
    --border: rgba(255, 255, 255, 0.08);
    --border-strong: rgba(255, 255, 255, 0.16);
    --ink: #f4f6f8;
    --ink-2: #cfd4dc;
    --muted: #8a93a0;
    --muted-2: #5a6270;

    --green: #22c55e;
    --green-2: #4ade80;
    --green-glow: rgba(34, 197, 94, 0.32);
    --yellow: #facc15;
    --yellow-2: #fde047;
    --yellow-glow: rgba(250, 204, 21, 0.32);
    --red: #ef4444;
    --red-2: #f87171;
    --red-glow: rgba(239, 68, 68, 0.32);
    --orange: #f97316;
    --blue: #3b82f6;
    --purple: #a855f7;
    --pink: #ec4899;
    --cyan: #06b6d4;

    --accent: #10b981;
    --accent-2: #34d399;
    --accent-glow: rgba(16, 185, 129, 0.32);

    --shadow-md: 0 8px 24px rgba(0,0,0,0.5);
    --shadow-lg: 0 24px 60px rgba(0,0,0,0.6);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; touch-action: manipulation; }
  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background:
      radial-gradient(ellipse at top left, rgba(16, 185, 129, 0.06), transparent 50%),
      radial-gradient(ellipse at bottom right, rgba(168, 85, 247, 0.05), transparent 50%),
      var(--bg);
    color: var(--ink);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
    letter-spacing: 0.01em;
  }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  input, select, textarea { font-family: inherit; color: inherit; }

  /* ============ LOADER ============ */
  .loader {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 14px; letter-spacing: 0.18em; color: var(--muted); text-transform: uppercase;
  }
  .loader::after {
    content: '...'; display: inline-block; width: 24px; text-align: left;
    animation: dots 1.4s infinite;
  }
  @keyframes dots { 0%,20%{content:'.'} 40%{content:'..'} 60%,100%{content:'...'} }

  /* ============ HEADER ============ */
  header.app-header {
    padding: 14px 18px;
    background: linear-gradient(180deg, rgba(15,20,25,0.95), rgba(15,20,25,0.78));
    backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px;
    position: sticky; top: 0; z-index: 50;
  }
  .brand { display: flex; align-items: center; gap: 10px; cursor: pointer; }
  .brand-mark {
    width: 36px; height: 36px; border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), #047857);
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
    box-shadow: 0 0 20px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,0.3);
  }
  .brand-text { display: flex; flex-direction: column; line-height: 1.1; }
  .brand-name {
    font-weight: 800; font-size: 16px; letter-spacing: 0.04em; color: var(--accent-2);
  }
  .brand-sub { font-size: 10px; letter-spacing: 0.22em; color: var(--muted); text-transform: uppercase; }
  .header-spacer { flex: 1; }
  .kid-chip {
    display: flex; align-items: center; gap: 8px;
    background: var(--panel-2); border: 1px solid var(--border-strong);
    padding: 6px 12px 6px 6px; border-radius: 99px; cursor: pointer;
    transition: all 0.2s;
  }
  .kid-chip:hover { border-color: var(--accent); }
  .kid-chip .avatar { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; }
  .kid-chip .name { font-size: 13px; font-weight: 600; }
  .nav-btn {
    background: transparent; border: 1px solid var(--border-strong);
    color: var(--ink); padding: 8px 14px; border-radius: 9px;
    font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 600;
    transition: all 0.2s;
  }
  .nav-btn:hover, .nav-btn.active { background: var(--accent); color: #08231b; border-color: var(--accent); }

  /* ============ MAIN LAYOUT ============ */
  main { padding: 18px; max-width: 1100px; margin: 0 auto; padding-bottom: 110px; }
  h1 { font-size: 28px; margin: 0 0 8px; font-weight: 800; letter-spacing: -0.02em; }
  h2 { font-size: 22px; margin: 0 0 14px; font-weight: 700; letter-spacing: -0.01em; }
  h3 { font-size: 13px; margin: 0 0 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); font-weight: 700; }

  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 16px; padding: 18px; backdrop-filter: blur(12px); }
  .panel + .panel { margin-top: 14px; }

  /* ============ BOTTOM NAV ============ */
  nav.bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: rgba(15,20,25,0.95); backdrop-filter: blur(16px);
    border-top: 1px solid var(--border);
    display: flex; justify-content: space-around;
    padding: 8px 6px calc(8px + env(safe-area-inset-bottom));
    z-index: 40;
  }
  nav.bottom-nav button {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;
    padding: 8px 4px; border-radius: 12px; color: var(--muted);
    font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase;
    transition: all 0.15s;
  }
  nav.bottom-nav button .icon { font-size: 22px; }
  nav.bottom-nav button.active { color: var(--accent-2); }
  nav.bottom-nav button.active .icon { transform: scale(1.1); }

  /* ============ LOGIN / KID PICKER ============ */
  .login-wrap { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; gap: 24px; }
  .login-title { text-align: center; }
  .login-title .big-mark { font-size: 72px; line-height: 1; margin-bottom: 8px; }
  .login-title h1 { font-size: 36px; margin: 0; background: linear-gradient(135deg, var(--accent-2), var(--cyan)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .login-title p { color: var(--muted); margin: 6px 0 0; font-size: 14px; letter-spacing: 0.06em; }

  .kid-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 14px; max-width: 600px; width: 100%; }
  .kid-tile {
    aspect-ratio: 1; border-radius: 20px; border: 2px solid var(--border-strong);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    cursor: pointer; transition: all 0.2s; background: var(--panel-2);
  }
  .kid-tile:hover { transform: translateY(-2px); border-color: var(--accent); box-shadow: 0 0 24px var(--accent-glow); }
  .kid-tile .avatar { width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: 800; }
  .kid-tile .name { font-size: 14px; font-weight: 700; }
  .kid-tile.add { border-style: dashed; color: var(--muted); }
  .kid-tile.add:hover { color: var(--accent); }

  .login-tools { display: flex; gap: 10px; margin-top: 8px; }
  .login-tools button { color: var(--muted); font-size: 12px; letter-spacing: 0.16em; text-transform: uppercase; padding: 8px 14px; }
  .login-tools button:hover { color: var(--accent-2); }

  /* ============ SCAN VIEW ============ */
  .scan-shell { display: flex; flex-direction: column; gap: 14px; }
  #qr-reader {
    width: 100%; border-radius: 16px; overflow: hidden;
    background: #000; border: 1px solid var(--border);
    aspect-ratio: 4/3;
  }
  #qr-reader video { width: 100% !important; height: 100% !important; object-fit: cover; }
  #qr-reader__dashboard_section_csr button, #qr-reader__dashboard_section_csr select, #qr-reader__dashboard button { background: var(--panel-2) !important; color: var(--ink) !important; border: 1px solid var(--border-strong) !important; padding: 8px 14px !important; border-radius: 8px !important; font-family: inherit !important; }
  #qr-reader__scan_region img { display: none; }
  .scan-hint { color: var(--muted); text-align: center; font-size: 13px; }
  .scan-actions { display: flex; gap: 10px; }
  .scan-actions button { flex: 1; padding: 12px; border-radius: 12px; background: var(--panel-2); border: 1px solid var(--border-strong); font-weight: 600; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; }
  .scan-actions button.primary { background: var(--accent); color: #08231b; border-color: var(--accent); }

  /* ============ SEARCH VIEW ============ */
  .search-input-wrap { display: flex; gap: 8px; margin-bottom: 14px; }
  .search-input {
    flex: 1; background: var(--panel-2); border: 1px solid var(--border-strong);
    padding: 14px 16px; border-radius: 12px; font-size: 16px; outline: none;
    transition: all 0.2s;
  }
  .search-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
  .search-input::placeholder { color: var(--muted-2); }
  .search-btn { padding: 14px 18px; border-radius: 12px; background: var(--accent); color: #08231b; font-weight: 700; font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; border: none; }

  .filter-chips { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .filter-chip { padding: 6px 12px; border-radius: 99px; background: var(--panel-2); border: 1px solid var(--border-strong); font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); cursor: pointer; }
  .filter-chip.active { background: var(--accent); color: #08231b; border-color: var(--accent); }

  .results-list { display: flex; flex-direction: column; gap: 8px; }
  .result-item {
    display: flex; align-items: center; gap: 12px;
    padding: 12px; border-radius: 12px;
    background: var(--panel-2); border: 1px solid var(--border);
    cursor: pointer; transition: all 0.15s;
  }
  .result-item:hover { border-color: var(--accent); transform: translateX(2px); }
  .result-item .thumb { width: 48px; height: 48px; border-radius: 10px; background: var(--panel-3); display: flex; align-items: center; justify-content: center; font-size: 24px; overflow: hidden; flex-shrink: 0; }
  .result-item .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .result-item .body { flex: 1; min-width: 0; }
  .result-item .name { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .result-item .brand { font-size: 11px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
  .result-item .light-pill { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
  .light-pill.green { background: var(--green); box-shadow: 0 0 12px var(--green-glow); }
  .light-pill.yellow { background: var(--yellow); box-shadow: 0 0 12px var(--yellow-glow); }
  .light-pill.red { background: var(--red); box-shadow: 0 0 12px var(--red-glow); }
  .light-pill.gray { background: var(--muted-2); }

  /* ============ FOOD DETAIL ============ */
  .food-hero { display: flex; gap: 16px; align-items: flex-start; }
  .food-hero .img { width: 96px; height: 96px; border-radius: 16px; background: var(--panel-3); display: flex; align-items: center; justify-content: center; font-size: 48px; overflow: hidden; flex-shrink: 0; }
  .food-hero .img img { width: 100%; height: 100%; object-fit: cover; }
  .food-hero .body { flex: 1; min-width: 0; }
  .food-hero .name { font-size: 22px; font-weight: 800; line-height: 1.2; }
  .food-hero .brand { font-size: 12px; color: var(--muted); letter-spacing: 0.12em; text-transform: uppercase; margin-top: 4px; }
  .food-hero .serving { margin-top: 8px; color: var(--ink-2); font-size: 13px; }

  .scores-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
  .score-card { padding: 16px; border-radius: 14px; background: var(--panel-2); border: 1px solid var(--border); text-align: center; }
  .score-card .label { font-size: 10px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .score-card .light-big { width: 64px; height: 64px; border-radius: 50%; margin: 10px auto; }
  .light-big.green { background: var(--green); box-shadow: 0 0 32px var(--green-glow), inset 0 0 0 4px rgba(255,255,255,0.15); }
  .light-big.yellow { background: var(--yellow); box-shadow: 0 0 32px var(--yellow-glow), inset 0 0 0 4px rgba(255,255,255,0.15); }
  .light-big.red { background: var(--red); box-shadow: 0 0 32px var(--red-glow), inset 0 0 0 4px rgba(255,255,255,0.15); }
  .light-big.gray { background: var(--muted-2); }
  .score-card .verdict { font-size: 14px; font-weight: 700; margin-top: 4px; }
  .nutri-badge { width: 64px; height: 64px; border-radius: 14px; margin: 10px auto; display: flex; align-items: center; justify-content: center; font-size: 36px; font-weight: 900; color: white; }
  .nutri-badge.A { background: #1f7a3d; }
  .nutri-badge.B { background: #84bd00; color: #1a3000; }
  .nutri-badge.C { background: #ffc524; color: #4a3500; }
  .nutri-badge.D { background: #ed8b00; }
  .nutri-badge.E { background: #d62a1f; }
  .nutri-badge.unknown { background: var(--muted-2); font-size: 14px; }

  .macros-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 14px; }
  .macro-card { padding: 12px; border-radius: 12px; background: var(--panel-2); border-left: 4px solid var(--accent); }
  .macro-card .lbl { font-size: 10px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .macro-card .val { font-size: 18px; font-weight: 800; margin-top: 4px; }
  .macro-card .val small { font-size: 12px; color: var(--muted); font-weight: 500; }
  .macro-card.cal { border-color: var(--orange); }
  .macro-card.protein { border-color: var(--blue); }
  .macro-card.carbs { border-color: var(--yellow); }
  .macro-card.fat { border-color: var(--purple); }
  .macro-card.sugar { border-color: var(--pink); }
  .macro-card.fiber { border-color: var(--green); }
  .macro-card.sodium { border-color: var(--red); }
  .macro-card.satfat { border-color: var(--red-2); }

  .lights-detail { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
  .light-row { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; background: var(--panel-2); }
  .light-row .light-pill { width: 14px; height: 14px; }
  .light-row .lbl { flex: 1; font-size: 13px; font-weight: 600; }
  .light-row .val { font-size: 13px; color: var(--ink-2); }
  .light-row .why { font-size: 11px; color: var(--muted); margin-top: 2px; }

  .kid-explainer { background: linear-gradient(135deg, rgba(16, 185, 129, 0.1), rgba(168, 85, 247, 0.1)); border: 1px solid var(--accent); border-radius: 14px; padding: 14px; margin-top: 14px; }
  .kid-explainer .lbl { font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent-2); font-weight: 700; }
  .kid-explainer .text { font-size: 14px; margin-top: 8px; line-height: 1.5; color: var(--ink); }

  .detail-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
  .detail-actions .btn-a, .detail-actions .btn-b { padding: 14px; border-radius: 12px; font-weight: 700; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; border: 2px solid; }
  .btn-a { background: rgba(59, 130, 246, 0.15); border-color: var(--blue); color: var(--blue); }
  .btn-a:hover { background: var(--blue); color: white; }
  .btn-b { background: rgba(168, 85, 247, 0.15); border-color: var(--purple); color: var(--purple); }
  .btn-b:hover { background: var(--purple); color: white; }
  .fav-btn { width: 100%; margin-top: 10px; padding: 12px; border-radius: 12px; background: var(--panel-2); border: 1px solid var(--border-strong); font-weight: 600; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2); }
  .fav-btn.is-fav { background: rgba(236, 72, 153, 0.18); color: var(--pink); border-color: var(--pink); }

  .portion-row { display: flex; align-items: center; gap: 10px; margin-top: 14px; padding: 12px; background: var(--panel-2); border-radius: 12px; }
  .portion-row label { font-size: 12px; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; }
  .portion-row input { flex: 1; background: var(--panel-3); border: 1px solid var(--border); padding: 8px 12px; border-radius: 8px; font-size: 14px; }
  .portion-row select { background: var(--panel-3); border: 1px solid var(--border); padding: 8px 10px; border-radius: 8px; font-size: 14px; }

  /* ============ COMPARE VIEW ============ */
  .compare-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .plate { padding: 14px; border-radius: 16px; background: var(--panel); border: 2px solid; min-height: 200px; }
  .plate.a { border-color: var(--blue); }
  .plate.b { border-color: var(--purple); }
  .plate-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .plate-head .badge { width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px; color: white; }
  .plate.a .plate-head .badge { background: var(--blue); }
  .plate.b .plate-head .badge { background: var(--purple); }
  .plate-head h3 { margin: 0; color: var(--ink); font-size: 14px; letter-spacing: 0.06em; text-transform: none; }
  .plate-items { display: flex; flex-direction: column; gap: 6px; }
  .plate-item { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: var(--panel-2); border-radius: 8px; }
  .plate-item .name { flex: 1; font-size: 12px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .plate-item .qty { font-size: 11px; color: var(--muted); }
  .plate-item .remove { color: var(--red); font-size: 16px; opacity: 0.6; padding: 0 4px; }
  .plate-item .remove:hover { opacity: 1; }
  .plate-empty { color: var(--muted); font-size: 12px; text-align: center; padding: 14px 0; font-style: italic; }
  .plate-totals { display: flex; flex-direction: column; gap: 6px; padding-top: 10px; margin-top: 10px; border-top: 1px dashed var(--border-strong); font-size: 12px; }
  .plate-totals .row { display: flex; align-items: baseline; gap: 4px; }
  .plate-totals .row .lbl { color: var(--ink-2); flex-shrink: 0; }
  .plate-totals .row .leader { flex: 1; border-bottom: 1px dotted var(--muted-2); min-width: 10px; align-self: flex-end; margin: 0 4px 4px; opacity: 0.5; }
  .plate-totals .row .v { font-weight: 700; flex-shrink: 0; color: var(--ink); }
  .plate-totals .row.cal .v { color: var(--orange); font-size: 16px; }
  .plate-totals .row.cal .lbl { font-weight: 700; color: var(--ink); }

  /* Side-by-side scores: kid light + nutri badge */
  .plate-scores { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  .plate-score-card { padding: 10px 8px; border-radius: 10px; background: var(--panel-2); display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .plate-score-card .label { font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
  .plate-score-card .light-mid { width: 36px; height: 36px; border-radius: 50%; }
  .light-mid.green { background: var(--green); box-shadow: 0 0 16px var(--green-glow), inset 0 0 0 3px rgba(255,255,255,0.15); }
  .light-mid.yellow { background: var(--yellow); box-shadow: 0 0 16px var(--yellow-glow), inset 0 0 0 3px rgba(255,255,255,0.15); }
  .light-mid.red { background: var(--red); box-shadow: 0 0 16px var(--red-glow), inset 0 0 0 3px rgba(255,255,255,0.15); }
  .light-mid.gray { background: var(--muted-2); }
  .plate-score-card .verdict-mid { font-size: 11px; font-weight: 700; color: var(--ink-2); text-align: center; }

  /* Diet badges — used wherever Nutri-Score badge used to sit */
  .diet-badges { display: flex; flex-direction: column; gap: 4px; margin: 6px 0; align-items: center; }
  .diet-badges.row { flex-direction: row; gap: 6px; }
  .diet-badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 10px; border-radius: 99px; font-size: 11px; font-weight: 800;
    letter-spacing: 0.08em; text-transform: uppercase; border: 1.5px solid transparent;
    min-width: 70px; justify-content: center;
  }
  .diet-badge.yes { background: rgba(34,197,94,0.15); color: var(--green-2); border-color: var(--green); }
  .diet-badge.no  { background: rgba(239,68,68,0.12); color: var(--red-2);   border-color: rgba(239,68,68,0.5); }
  .diet-badge.unk { background: var(--panel-3); color: var(--muted); border-color: var(--border-strong); }
  .diet-badge .icon { font-size: 13px; }

  /* Compact variant for meal cards / small spaces */
  .diet-badge.mini { padding: 2px 6px; font-size: 9px; min-width: 0; letter-spacing: 0.06em; }
  .diet-badge.mini .icon { font-size: 11px; }

/* ============ KETO / PALEO HELPERS ============ */
function netCarbsOf(perVal) {
  return Math.max(0, (perVal.carbs || 0) - (perVal.fiber || 0));
}

// Returns true/false/null for keto and paleo compatibility for a food.
// Whole foods are hand-flagged; OFF products fall back to inference.
function dietFlags(food) {
  if (!food) return { keto: null, paleo: null };
  let keto = food.keto, paleo = food.paleo;
  if (keto != null && paleo != null) return { keto, paleo };
  // Inference for unflagged (mostly OFF packaged foods)
  const p = food.per100 || {};
  const netCarbs100 = netCarbsOf(p);
  const sugar100 = p.sugar || 0;
  const nova = food.nova;
  if (keto == null) {
    if (netCarbs100 > 12 || sugar100 > 10) keto = false;
    else if (netCarbs100 < 5 && (nova == null || nova < 4)) keto = true;
    else keto = null;
  }
  if (paleo == null) {
    if (nova === 4 || sugar100 > 15) paleo = false;
    else if (nova != null && nova <= 2 && netCarbs100 < 30) paleo = true;
    else paleo = null;
  }
  return { keto, paleo };
}

// Combined "Diet Fit" verdict from keto + paleo flags
function dietFit(food) {
  const { keto, paleo } = dietFlags(food);
  if (keto && paleo) return 'green';
  if (keto || paleo) return 'yellow';
  if (keto === false && paleo === false) return 'red';
  return 'gray';
}

// For a plate (array of {food, grams}), reduce keto/paleo across items.
// A plate is keto only if every item is keto (or unknown); same for paleo.
function plateKetoPaleo(plate) {
  if (!plate || !plate.length) return { keto: null, paleo: null };
  let keto = true, paleo = true, anyKetoKnown = false, anyPaleoKnown = false;
  for (const it of plate) {
    const f = dietFlags(it.food);
    if (f.keto != null)  anyKetoKnown = true;
    if (f.paleo != null) anyPaleoKnown = true;
    if (f.keto === false)  keto = false;
    if (f.paleo === false) paleo = false;
  }
  return {
    keto:  anyKetoKnown  ? keto  : null,
    paleo: anyPaleoKnown ? paleo : null,
  };
}

/* ============ KETO/PALEO TRAFFIC LIGHT ============
   Per-serving evaluation. Returns
   { lights: {netCarbs,sugar,protein,nova,diet}, overall: 'green'|'yellow'|'red' }
   The "diet" sub-light is the keto+paleo composite and is the strongest signal. */
function trafficLight(perServing, novaScore, rules, food) {
  rules = rules || state.scoringRules;
  const r = rules;
  const lights = {};

  const downMetric = (val, cfg) => {
    if (val == null) return 'gray';
    if (val <= cfg.greenMax) return 'green';
    if (val <= cfg.yellowMax) return 'yellow';
    return 'red';
  };
  const upMetric = (val, cfg) => {
    if (val == null) return 'gray';
    if (val >= cfg.greenMin) return 'green';
    if (val >= cfg.yellowMin) return 'yellow';
    return 'red';
  };

  const netCarbs = netCarbsOf(perServing);
  lights.netCarbs = downMetric(netCarbs, r.netCarbs);
  lights.sugar    = downMetric(perServing.sugar, r.sugar);
  lights.protein  = upMetric(perServing.protein, r.protein);
  lights.nova     = (novaScore == null)
    ? 'gray'
    : (novaScore <= r.nova.greenMax ? 'green' : (novaScore <= r.nova.yellowMax ? 'yellow' : 'red'));
  lights.diet     = food ? dietFit(food) : 'gray';

  // Overall: diet-fit IS the score. Keto+paleo philosophy drives the kid-light.
  //   diet=red    → red  (off-plan; never "great choice")
  //   diet=green  → green (unless major nutrient red, then yellow)
  //   diet=yellow → yellow (fits one diet, not both)
  //   diet=gray   → fall back to nutritional tally for unknown packaged foods
  const counts = { green:0, yellow:0, red:0, gray:0 };
  Object.values(lights).forEach(l => counts[l]++);
  // Exclude diet from the count of "other" lights for tie-breaking
  const otherReds = counts.red - (lights.diet === 'red' ? 1 : 0);

  let overall;
  if (lights.diet === 'red') {
    overall = 'red';
  } else if (lights.diet === 'green') {
    overall = otherReds >= 2 ? 'yellow' : 'green';
  } else if (lights.diet === 'yellow') {
    overall = 'yellow';
  } else {
    // Unknown diet flags — tally the other metrics
    if (counts.red >= 2) overall = 'red';
    else if (counts.green >= 3 && counts.red === 0) overall = 'green';
    else overall = 'yellow';
  }

  return { lights, overall, counts };
}

/* ============ NUTRIENT MATH ============ */
function perServing(per100, grams) {
  const factor = grams / 100;
  return {
    kcal: round((per100.kcal||0) * factor, 0),
    protein: round((per100.protein||0) * factor, 1),
    carbs: round((per100.carbs||0) * factor, 1),
    sugar: round((per100.sugar||0) * factor, 1),
    fiber: round((per100.fiber||0) * factor, 1),
    fat: round((per100.fat||0) * factor, 1),
    satfat: round((per100.satfat||0) * factor, 1),
    sodium: round((per100.sodium||0) * factor, 0),
  };
}
function round(n, d=0) { const f = Math.pow(10, d); return Math.round(n*f)/f; }

/* ============ OPEN FOOD FACTS CLIENT ============ */
const OFF_BASE = 'https://world.openfoodfacts.org';

async function offByBarcode(barcode) {
  // Check cache
  const cached = cacheGet('off-barcode-' + barcode);
  if (cached) return cached;
  try {
    const res = await fetch(`${OFF_BASE}/api/v2/product/${encodeURIComponent(barcode)}?fields=product_name,brands,nutriments,image_small_url,serving_size,serving_quantity,nova_group,nutriscore_grade,nutrient_levels,categories_tags`);
    const j = await res.json();
    if (j.status !== 1 || !j.product) return null;
    const food = normalizeOff(j.product, barcode);
    cacheSet('off-barcode-' + barcode, food);
    return food;
  } catch (e) { console.error('OFF barcode', e); return null; }
}

async function offSearch(query, page=1) {
  try {
    const res = await fetch(`${OFF_BASE}/cgi/search.pl?search_terms=${encodeURIComponent(query)}&search_simple=1&action=process&json=1&page_size=20&page=${page}&fields=code,product_name,brands,nutriments,image_small_url,serving_size,serving_quantity,nova_group,nutriscore_grade`);
    const j = await res.json();
    return (j.products || []).map(p => normalizeOff(p, p.code)).filter(p => p.name);
  } catch (e) { console.error('OFF search', e); return []; }
}

function normalizeOff(p, code) {
  const n = p.nutriments || {};
  const per100 = {
    kcal:    n['energy-kcal_100g'] ?? (n['energy_100g'] ? n['energy_100g']/4.184 : 0),
    protein: n['proteins_100g'] || 0,
    carbs:   n['carbohydrates_100g'] || 0,
    sugar:   n['sugars_100g'] || 0,
    fiber:   n['fiber_100g'] || 0,
    fat:     n['fat_100g'] || 0,
    satfat:  n['saturated-fat_100g'] || 0,
    sodium:  (n['sodium_100g'] != null ? n['sodium_100g']*1000 : (n['salt_100g'] ? n['salt_100g']*400 : 0)),
  };
  const serving = p.serving_quantity || parseServing(p.serving_size) || 100;
  return {
    key: 'off-' + code,
    source: 'OFF',
    barcode: code,
    name: p.product_name || 'Unknown product',
    brand: p.brands || '',
    emoji: '📦',
    image: p.image_small_url || null,
    servingG: serving,
    per100,
    nova: p.nova_group || null,
    nutriGrade: p.nutriscore_grade ? p.nutriscore_grade.toUpperCase() : null,
  };
}

function parseServing(s) {
  if (!s) return null;
  const m = String(s).match(/(\d+\.?\d*)/);
  return m ? parseFloat(m[1]) : null;
}

/* ============ LOCAL CACHE ============ */
function cacheGet(key) {
  try {
    const v = localStorage.getItem('fuel_cache_' + key);
    if (!v) return null;
    const o = JSON.parse(v);
    if (o.expires && Date.now() > o.expires) { localStorage.removeItem('fuel_cache_' + key); return null; }
    return o.data;
  } catch (e) { return null; }
}
function cacheSet(key, data, ttlMs=30*24*3600*1000) {
  try { localStorage.setItem('fuel_cache_' + key, JSON.stringify({ data, expires: Date.now() + ttlMs })); } catch (e) {}
}

}

async function loadFavorites() {
  if (!state.activeKidId) { state.favorites = []; return; }
  const cacheKey = 'fuel_favs_' + state.activeKidId;
  state.favorites = JSON.parse(localStorage.getItem(cacheKey) || '[]');
  if (!sb) return;
  const { data, error } = await sb.from('food_favorites').select('*').eq('kid_id', state.activeKidId);
  if (!error && data) { state.favorites = data; localStorage.setItem(cacheKey, JSON.stringify(data)); }
}

async function toggleFavorite(food) {
  if (!state.activeKidId) { toast('Pick a kid first', 'error'); return; }
  const existing = state.favorites.find(f => f.food_key === food.key);
  if (existing) {
    state.favorites = state.favorites.filter(f => f.id !== existing.id);
    if (sb) await sb.from('food_favorites').delete().eq('id', existing.id);
  } else {
    const row = { id: uuid(), kid_id: state.activeKidId, food_key: food.key, food_data: food, created_at: new Date().toISOString() };
    state.favorites.push(row);
    if (sb) await sb.from('food_favorites').insert(row);
  }
  localStorage.setItem('fuel_favs_' + state.activeKidId, JSON.stringify(state.favorites));
}

async function loadScoringRules() {
  const local = localStorage.getItem('fuel_rules');
  if (local) try { state.scoringRules = JSON.parse(local); } catch(e) {}
  if (!sb) { migrateRulesSchema(); return; }
  const { data } = await sb.from('food_scoring_rules').select('rules').eq('id', 'global').maybeSingle();
  if (data && data.rules) { state.scoringRules = data.rules; localStorage.setItem('fuel_rules', JSON.stringify(data.rules)); }
  migrateRulesSchema();
}

// Old schema had {sugar,satFat,sodium,fiber,protein,nova}. New schema needs netCarbs and drops satFat/sodium/fiber.
// If the new keys aren't present, replace with defaults (also persists the new rules).
function migrateRulesSchema() {
  if (!state.scoringRules || !state.scoringRules.netCarbs || !state.scoringRules.sugar || !state.scoringRules.protein || !state.scoringRules.nova) {
    state.scoringRules = defaultRules();
    saveScoringRules();
  }
}

async function saveScoringRules() {
  localStorage.setItem('fuel_rules', JSON.stringify(state.scoringRules));
  if (!sb) return;
  await sb.from('food_scoring_rules').upsert({ id: 'global', rules: state.scoringRules, updated_at: new Date().toISOString() });
}

async function loadComparisons() {
  if (!state.activeKidId) { state.comparisons = []; return; }
  state.comparisons = JSON.parse(localStorage.getItem('fuel_cmps_' + state.activeKidId) || '[]');
  if (!sb) return;
  const { data } = await sb.from('food_comparisons').select('*').eq('kid_id', state.activeKidId).order('created_at', { ascending: false }).limit(20);
  if (data) { state.comparisons = data; localStorage.setItem('fuel_cmps_' + state.activeKidId, JSON.stringify(data)); }
}

async function saveComparison(label) {
  if (!state.activeKidId) { toast('Pick a kid first', 'error'); return; }
  if (!state.plateA.length || !state.plateB.length) { toast('Both plates must have food', 'error'); return; }
  const row = {
    id: uuid(),
    kid_id: state.activeKidId,
    label: label || 'Comparison ' + new Date().toLocaleString(),
    plate_a: state.plateA,
    plate_b: state.plateB,
    created_at: new Date().toISOString(),
  };
  state.comparisons.unshift(row);
  localStorage.setItem('fuel_cmps_' + state.activeKidId, JSON.stringify(state.comparisons));
  if (sb) await sb.from('food_comparisons').insert(row);
  toast('Comparison saved', 'success');
}

function verdictText(light) {
  if (light === 'green') return '✓ Great choice';
  if (light === 'yellow') return '◐ Sometimes';
  if (light === 'red') return '✗ Treat only';
  return 'Unknown';
}

function dietBadgeHtml(name, val, mini=false) {
  const labels = { keto: 'KETO', paleo: 'PALEO' };
  const icons  = { keto: '🥑',   paleo: '🦴'   };
  const cls = val === true ? 'yes' : val === false ? 'no' : 'unk';
  const mark = val === true ? '✓' : val === false ? '✗' : '?';
  return `<span class="diet-badge ${cls}${mini?' mini':''}"><span class="icon">${icons[name]}</span>${labels[name]} ${mark}</span>`;
}

function dietFitVerdict(flags) {
  const { keto, paleo } = flags;
  if (keto && paleo) return '✓ Both diets';
  if (keto && paleo === false) return 'Keto only';
  if (paleo && keto === false) return 'Paleo only';
  if (keto === false && paleo === false) return '✗ Off-plan';
  if (keto || paleo) return 'Partial fit';
  return 'Unknown';
}

function dietFitLabel(flags) {
  return dietFitVerdict(flags);
}

function buildKidExplainer(food, ps, tl, flags) {
  const pieces = [];

  // Lead with verdict — always matches the score
  if (tl.overall === 'green') pieces.push(`<b>Great choice!</b> This food fits the plan.`);
  else if (tl.overall === 'yellow') pieces.push(`<b>Okay sometimes</b> — not every day.`);
  else pieces.push(`<b>Treat only</b> — fun once in a while, not regular fuel.`);

  // Keto/Paleo line
  if (flags) {
    if (flags.keto && flags.paleo) pieces.push(`✓ Works for both Keto and Paleo.`);
    else if (flags.keto)  pieces.push(`✓ Keto-friendly. ✗ Not paleo.`);
    else if (flags.paleo) pieces.push(`✓ Paleo-friendly. ✗ Not keto.`);
    else if (flags.keto === false && flags.paleo === false) pieces.push(`✗ Not keto. ✗ Not paleo.`);
  }

  // Facts gated to never contradict the verdict
  const netCarbs = round(netCarbsOf(ps), 1);
  if (tl.overall !== 'green' && netCarbs >= 15) pieces.push(`High net carbs: <b>${netCarbs}g</b> can spike blood sugar.`);
  if (tl.overall !== 'green' && ps.sugar >= 10) pieces.push(`Lots of sugar: <b>${ps.sugar}g</b> ≈ ${Math.round(ps.sugar/4)} tsp. 🍬`);
  if (tl.overall === 'green' && ps.protein >= 10) pieces.push(`Strong protein (<b>${ps.protein}g</b>) for muscles. 💪`);
  if (food.nova === 4) pieces.push(`Ultra-processed — made in a factory. 🏭`);
  if (tl.overall === 'green' && food.nova === 1) pieces.push(`Whole food — straight from nature! 🌱`);

  return pieces.join(' ');
}

function plateTotals(plate) {
  const t = { kcal:0, protein:0, carbs:0, sugar:0, fiber:0, fat:0, satfat:0, sodium:0 };
  for (const it of plate) {
    const ps = perServing(it.food.per100, it.grams);
    for (const k of Object.keys(t)) t[k] += ps[k] || 0;
  }
  for (const k of Object.keys(t)) t[k] = round(t[k], k==='kcal'||k==='sodium'?0:1);
  return t;
}

function renderWinner() {
  const a = plateTotals(state.plateA);
  const b = plateTotals(state.plateB);
  const novaA = Math.max(...state.plateA.map(it => it.food.nova || 1));
  const novaB = Math.max(...state.plateB.map(it => it.food.nova || 1));
  const flagsA = plateKetoPaleo(state.plateA);
  const flagsB = plateKetoPaleo(state.plateB);
  const tlA = trafficLight(a, novaA, null, flagsA);
  const tlB = trafficLight(b, novaB, null, flagsB);
  const netA = round(netCarbsOf(a), 1);
  const netB = round(netCarbsOf(b), 1);

  // Comparison rows — focused on keto/paleo-relevant metrics
  const rows = [
    { key:'kcal',     lbl:'Calories',  better:'lower',  unit:' kcal', av:a.kcal,    bv:b.kcal    },
    { key:'protein',  lbl:'Protein',   better:'higher', unit:'g',     av:a.protein, bv:b.protein },
    { key:'netCarbs', lbl:'Net Carbs', better:'lower',  unit:'g',     av:netA,      bv:netB      },
    { key:'sugar',    lbl:'Sugar',     better:'lower',  unit:'g',     av:a.sugar,   bv:b.sugar   },
    { key:'fiber',    lbl:'Fiber',     better:'higher', unit:'g',     av:a.fiber,   bv:b.fiber   },
    { key:'satfat',   lbl:'Sat Fat',   better:'lower',  unit:'g',     av:a.satfat,  bv:b.satfat  },
  ];
  const winnerRows = rows.map(r => {
    let aClass = '', bClass = '';
    if (r.av !== r.bv) {
      const aWins = r.better === 'lower' ? r.av < r.bv : r.av > r.bv;
      aClass = aWins ? 'win' : 'lose';
      bClass = aWins ? 'lose' : 'win';
    }
    return `<div class="winner-row">
      <span class="a-side v ${aClass}">${r.av}${r.unit}</span>
      <span class="metric">${r.lbl}</span>
      <span class="b-side v ${bClass}">${r.bv}${r.unit}</span>
    </div>`;
  }).join('');

  // Diet-fit row at the top
  const fitA = dietFitVerdict(flagsA);
  const fitB = dietFitVerdict(flagsB);
  const fitOrder = { 'green':3,'yellow':2,'red':1,'gray':0 };
  const fitAScore = fitOrder[dietFit({keto: flagsA.keto, paleo: flagsA.paleo})];
  const fitBScore = fitOrder[dietFit({keto: flagsB.keto, paleo: flagsB.paleo})];
  const fitARow = fitAScore > fitBScore ? 'win' : (fitAScore < fitBScore ? 'lose' : '');
  const fitBRow = fitBScore > fitAScore ? 'win' : (fitBScore < fitAScore ? 'lose' : '');
  const dietRow = `<div class="winner-row">
    <span class="a-side v ${fitARow}">${fitA}</span>
    <span class="metric">Diet Fit</span>
    <span class="b-side v ${fitBRow}">${fitB}</span>
  </div>`;

  // Overall winner
  let summary;
  const order = { green: 3, yellow: 2, red: 1, gray: 0 };
  if (order[tlA.overall] > order[tlB.overall]) summary = `<b style="color: var(--blue);">Plate A</b> is the better fuel overall.`;
  else if (order[tlB.overall] > order[tlA.overall]) summary = `<b style="color: var(--purple);">Plate B</b> is the better fuel overall.`;
  else summary = `Both plates score about the same — look at the details to decide.`;

  return `
    <div class="comparison-winner">
      <h3>🏆 Side by side</h3>
      <div class="winner-rows">${dietRow}${winnerRows}</div>
      <div style="margin-top: 12px; font-size: 14px; text-align: center;">${summary}</div>
    </div>
  `;
}

function thresholdRow(key, label, hint, cfg, dir, unit) {
  if (dir === 'down') {
    return `
      <div class="threshold-row">
        <div class="lbl">${label}<small>${hint}</small></div>

          <span>green ≤</span>
          <input type="number" step="0.1" value="${cfg.greenMax}" oninput="window.updateRule('${key}','greenMax',this.value)" />
          <span>${unit}, yellow ≤</span>
          <input type="number" step="0.1" value="${cfg.yellowMax}" oninput="window.updateRule('${key}','yellowMax',this.value)" />
        </div>
      </div>
    `;
  }
  return `
    <div class="threshold-row">
      <div class="lbl">${label}<small>${hint}</small></div>
      <div class="inputs">
        <span>green ≥</span>
        <input type="number" step="0.1" value="${cfg.greenMin}" oninput="window.updateRule('${key}','greenMin',this.value)" />
        <span>${unit}, yellow ≥</span>
        <input type="number" step="0.1" value="${cfg.yellowMin}" oninput="window.updateRule('${key}','yellowMin',this.value)" />
      </div>
    </div>
  `;
}

/* ============ MAIN RENDER ============ */
function render() {
  const app = document.getElementById('app');
  let html;
  switch (state.view) {
    case 'login':     html = viewLogin(); break;
    case 'scan':      html = viewScan(); break;
    case 'search':    html = viewSearch(); break;
    case 'food':      html = viewFoodDetail(); break;
    case 'compare':   html = viewCompare(); break;
    case 'favorites': html = viewFavorites(); break;
    case 'admin':     html = viewAdmin(); break;
    default: html = viewLogin();
  }
  app.innerHTML = html;

  // View-specific mount logic
  if (state.view === 'scan') mountScanner();
  if (state.view === 'search') {
    const inp = document.getElementById('search-input');
    if (inp) {
      inp.focus();
      inp.addEventListener('keydown', e => { if (e.key === 'Enter') { state.searchQuery = inp.value; doSearch(); }});
      inp.addEventListener('input', e => { state.searchQuery = e.target.value; });
    }
  }
}

/* ============ NAV ============ */
function go(view) {
  // Cleanup scanner if leaving
  if (state.view === 'scan' && view !== 'scan') stopScanner();
  if (view === 'login') { state.adminUnlocked = false; }
  if ((view === 'search' || view === 'favorites' || view === 'compare' || view === 'scan') && !state.activeKidId) {
    // Allow but show login if no kid
    state.view = 'login';
  } else {
    state.view = view;
  }
  if (view === 'favorites') loadFavorites().then(() => render());
  if (view === 'compare') loadComparisons().then(() => render());
  render();
}
window.go = go;

async function pickKid(id) {
  state.activeKidId = id;
  localStorage.setItem('fuel_active_kid', id);
  await Promise.all([loadFavorites(), loadComparisons()]);
  go('scan');
}
window.pickKid = pickKid;

/* ============ ADD KID MODAL ============ */

  const emojis = ['😀','🦁','🐯','🐻','🐼','🦊','🐸','🐵','🦄','🐲','⚽','🏀','🎨','🎮','🚀'];

async function confirmAddKid() {

async function doDeleteKid(id) {

/* ============ SCANNER ============ */
let scannerInstance = null;
async function mountScanner() {
  if (!window.Html5Qrcode) {
    // Load library dynamically
    await new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = 'https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js';
      s.onload = resolve; s.onerror = reject;
      document.head.appendChild(s);
    }).catch(() => { toast('Scanner library failed to load', 'error'); return; });
  }
  if (!window.Html5Qrcode) return;
  try {
    stopScanner();
    scannerInstance = new Html5Qrcode('qr-reader');
    const config = {
      fps: 10,
      qrbox: { width: 280, height: 140 },
      formatsToSupport: [
        Html5QrcodeSupportedFormats.EAN_13,
        Html5QrcodeSupportedFormats.EAN_8,
        Html5QrcodeSupportedFormats.UPC_A,
        Html5QrcodeSupportedFormats.UPC_E,
        Html5QrcodeSupportedFormats.CODE_128,
        Html5QrcodeSupportedFormats.CODE_39,
      ],
    };
    await scannerInstance.start(
      { facingMode: 'environment' },
      config,
      async (decodedText) => {
        stopScanner();
        toast('Scanned: ' + decodedText, 'success');
        await lookupBarcode(decodedText);
      },
      () => {}
    );
  } catch (e) {
    console.error('scanner', e);
    toast('Camera access denied or unavailable', 'error');
  }
}

function stopScanner() {
  if (scannerInstance) {
    try { scannerInstance.stop().then(()=>scannerInstance.clear()); } catch(e) {}
    scannerInstance = null;
  }
}

async function lookupBarcode(code) {
  const result = await offByBarcode(code);
  if (!result) { toast('No product found for ' + code, 'error'); render(); return; }
  state.currentFood = result;
  state.lastList = 'scan';
  state.view = 'food';
  state.detailGrams = result.servingG;
  render();
}

async function manualBarcode() {
  const code = document.getElementById('manual-barcode').value.trim();
  if (!code) return;
  toast('Looking up ' + code + '…');
  await lookupBarcode(code);
}
window.manualBarcode = manualBarcode;

/* ============ SEARCH ============ */
async function doSearch() {
  const q = (document.getElementById('search-input')?.value || state.searchQuery).trim();
  state.searchQuery = q;
  if (!q) { state.searchResults = []; render(); return; }
  state.searching = true; render();

  let results = [];
  if (state.searchSource === 'all' || state.searchSource === 'whole') {
    const whole = findWhole(q).map(w => ({ ...w, source: 'WHOLE' }));
    results = results.concat(whole);
  }
  if (state.searchSource === 'all' || state.searchSource === 'packaged') {
    const off = await offSearch(q);
    results = results.concat(off);
  }
  state.searchResults = results;
  state.searching = false;
  render();
}
window.doSearch = doSearch;

function setSource(s) { state.searchSource = s; if (state.searchQuery) doSearch(); else render(); }
window.setSource = setSource;

function openFood(key) {
  let food;
  if (key.startsWith('off-')) {
    food = state.searchResults.find(f => f.key === key);
    if (!food) food = state.favorites.find(f => f.food_key === key)?.food_data;
  } else {
    food = WHOLE_FOODS.find(f => f.key === key);
    if (food) food = { ...food, source: 'WHOLE' };
    if (!food) food = state.searchResults.find(f => f.key === key);
    if (!food) food = state.favorites.find(f => f.food_key === key)?.food_data;
  }
  if (!food) { toast('Could not load food', 'error'); return; }
  state.currentFood = food;
  state.lastList = state.view;
  state.detailGrams = food.servingG || 100;
  state.view = 'food';
  render();
}
window.openFood = openFood;

function setPortion(g) {
  state.detailGrams = Math.max(1, parseFloat(g) || 1);
  render();
}
window.setPortion = setPortion;

function setPortionPreset(g) {
  if (!g) return;
  state.detailGrams = parseFloat(g);
  render();
}
window.setPortionPreset = setPortionPreset;

function addToPlate(which) {
  if (!state.currentFood) return;
  const plate = which === 'A' ? state.plateA : state.plateB;
  plate.push({ food: state.currentFood, grams: state.detailGrams });
  toast('Added to Plate ' + which, 'success');
}
window.addToPlate = addToPlate;

function removeFromPlate(which, idx) {
  const plate = which === 'A' ? state.plateA : state.plateB;
  plate.splice(idx, 1);
  render();
}
window.removeFromPlate = removeFromPlate;

function clearPlates() {
  state.plateA = [];
  state.plateB = [];
  render();
}
window.clearPlates = clearPlates;

async function toggleFav() {
  if (!state.currentFood) return;
  await toggleFavorite(state.currentFood);
  toast(isFavorite(state.currentFood) ? 'Added to favorites' : 'Removed', 'success');
  render();
}
window.toggleFav = toggleFav;

function saveCmp() {
  openModal(`
    <div class="modal-head"><h2>Save Comparison</h2><button class="modal-close" onclick="closeModal()">Cancel</button></div>
    <div class="form-row">
      <label>Label</label>
      <input id="cmp-label" placeholder="e.g. PB&amp;J vs Eggs+Toast+Fruit" autofocus />
    </div>
    <button class="btn-primary" style="width:100%;" onclick="window.doSaveCmp()">Save</button>
  `);
}
window.saveCmp = saveCmp;

async function doSaveCmp() {
  const label = document.getElementById('cmp-label').value.trim();
  await saveComparison(label);
  closeModal();
  render();
}
window.doSaveCmp = doSaveCmp;

function loadCmp(id) {
  const c = state.comparisons.find(x => x.id === id);
  if (!c) return;
  state.plateA = c.plate_a;
  state.plateB = c.plate_b;
  toast('Loaded: ' + c.label);
  render();
}
window.loadCmp = loadCmp;

function openSaveMeal(which) {
  const plate = which === 'A' ? state.plateA : state.plateB;
  if (!plate.length) { toast('Plate ' + which + ' is empty', 'error'); return; }
  if (!state.activeKidId) { toast('Pick a kid first', 'error'); return; }
  const itemNames = plate.map(it => it.food.name).join(', ');
  const suggestion = plate.length === 1 ? plate[0].food.name : `${plate.length}-item meal`;
  openModal(`
    <div class="modal-head"><h2>Save Plate ${which}</h2><button class="modal-close" onclick="closeModal()">Cancel</button></div>
    <p style="color: var(--muted); font-size: 13px; margin: -4px 0 12px;">${escape(itemNames)}</p>
    <div class="form-row">
      <label>Meal Name</label>
      <input id="meal-name" placeholder="e.g. PB&amp;J Lunch, Breakfast Combo" value="${escape(suggestion)}" autofocus />
    </div>
    <button class="btn-primary" style="width:100%;" onclick="window.doSaveMeal('${which}')">Save Meal</button>
  `);
}
window.openSaveMeal = openSaveMeal;

async function doSaveMeal(which) {
  const name = document.getElementById('meal-name').value.trim();
  if (!name) { toast('Enter a name', 'error'); return; }
  const plate = which === 'A' ? state.plateA : state.plateB;
  const row = {
    id: uuid(),
    kid_id: state.activeKidId,
    food_key: 'meal-' + uuid(),
    food_data: { type: 'meal', name, items: JSON.parse(JSON.stringify(plate)) },
    created_at: new Date().toISOString(),
  };
  state.favorites.push(row);
  localStorage.setItem('fuel_favs_' + state.activeKidId, JSON.stringify(state.favorites));
  if (sb) {
    const { error } = await sb.from('food_favorites').insert(row);
    if (error) toast('Saved offline: ' + error.message, 'error');
  }
  closeModal();
  toast('Saved meal: ' + name, 'success');
  render();
}
window.doSaveMeal = doSaveMeal;

function openMealDetail(favId) {
  const fav = state.favorites.find(f => f.id === favId);
  if (!fav) return;
  const m = fav.food_data;
  const totals = plateTotals(m.items);
  const novaWorst = Math.max(...m.items.map(it => it.food.nova || 1));
  const flags = plateKetoPaleo(m.items);
  const tl = trafficLight(totals, novaWorst, null, flags);
  const netCarbs = round(netCarbsOf(totals), 1);
  const itemsHtml = m.items.map(it => `
    <div class="plate-item">
      <span style="font-size: 18px;">${it.food.emoji||'🍽️'}</span>
      <span class="name">${escape(it.food.name)}</span>
      <span class="qty">${it.grams}g</span>
    </div>
  `).join('');
  openModal(`
    <div class="modal-head">
      <h2>🍽️ ${escape(m.name)}</h2>
      <button class="modal-close" onclick="closeModal()">Close</button>
    </div>
    <div class="plate-items" style="margin-bottom: 12px;">${itemsHtml}</div>
    <div class="plate-totals">
      <div class="row cal"><span class="lbl">Calories</span><span class="leader"></span><span class="v">${totals.kcal} kcal</span></div>
      <div class="row"><span class="lbl">Protein</span><span class="leader"></span><span class="v">${totals.protein}g</span></div>
      <div class="row"><span class="lbl">Net Carbs</span><span class="leader"></span><span class="v">${netCarbs}g</span></div>
      <div class="row"><span class="lbl">Sugar</span><span class="leader"></span><span class="v">${totals.sugar}g</span></div>
      <div class="row"><span class="lbl">Fiber</span><span class="leader"></span><span class="v">${totals.fiber}g</span></div>
      <div class="row"><span class="lbl">Sat Fat</span><span class="leader"></span><span class="v">${totals.satfat}g</span></div>
    </div>
    <div class="plate-scores">
      <div class="plate-score-card">
        <div class="label">Kid Score</div>
        <div class="light-mid ${tl.overall}"></div>
        <div class="verdict-mid">${verdictText(tl.overall)}</div>
      </div>
      <div class="plate-score-card">
        <div class="label">Diet Fit</div>
        <div class="diet-badges">
          ${dietBadgeHtml('keto', flags.keto, true)}
          ${dietBadgeHtml('paleo', flags.paleo, true)}
        </div>
        <div class="verdict-mid">${dietFitVerdict(flags)}</div>
      </div>
    </div>
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px;">
      <button class="btn-a" onclick="window.loadMealInto('${favId}','A')">Load to Plate A</button>
      <button class="btn-b" onclick="window.loadMealInto('${favId}','B')">Load to Plate B</button>
    </div>
    <button class="btn-danger" style="width:100%; margin-top: 8px;" onclick="window.deleteMeal('${favId}')">🗑 Delete Meal</button>
  `);
}
window.openMealDetail = openMealDetail;

function loadMealInto(favId, which) {
  const fav = state.favorites.find(f => f.id === favId);
  if (!fav) return;
  const items = JSON.parse(JSON.stringify(fav.food_data.items));
  if (which === 'A') state.plateA = items; else state.plateB = items;
  closeModal();
  toast(`Loaded "${fav.food_data.name}" to Plate ${which}`, 'success');
  go('compare');
}
window.loadMealInto = loadMealInto;

async function deleteMeal(favId) {
  state.favorites = state.favorites.filter(f => f.id !== favId);
  localStorage.setItem('fuel_favs_' + state.activeKidId, JSON.stringify(state.favorites));
  if (sb) await sb.from('food_favorites').delete().eq('id', favId);
  closeModal();
  toast('Meal deleted', 'success');
  render();
}
window.deleteMeal = deleteMeal;

async function deleteCmp(id) {
  state.comparisons = state.comparisons.filter(c => c.id !== id);
  localStorage.setItem('fuel_cmps_' + state.activeKidId, JSON.stringify(state.comparisons));
  if (sb) await sb.from('food_comparisons').delete().eq('id', id);
  render();
}
window.deleteCmp = deleteCmp;

/* ============ ADMIN ============ */
function tryPin(val) {
  if (val.length >= 4 && val === getParentPin()) {
    state.adminUnlocked = true;
    toast('Unlocked', 'success');
    render();
  }
}
window.tryPin = tryPin;

function lockAdmin() { state.adminUnlocked = false; render(); }
window.lockAdmin = lockAdmin;

function updateRule(key, sub, val) {
  state.scoringRules[key][sub] = parseFloat(val) || 0;
  saveScoringRules();
}
window.updateRule = updateRule;

function resetRules() {
  state.scoringRules = defaultRules();
  saveScoringRules();
  render();
}
window.resetRules = resetRules;

function changePin() {
  const v = document.getElementById('new-pin').value.trim();
  if (v.length < 4) { toast('PIN must be at least 4 digits', 'error'); return; }
  setParentPin(v);
  toast('PIN updated', 'success');
}
window.changePin = changePin;

/* ============ ESCAPE ============ */
function escape(s) { return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s) { return String(s||'').replace(/['"\\]/g, '\\$&'); }

/* ============ BOOT ============ */
async function boot() {
  await loadKidsFromDb();
  await loadScoringRules();
  const lastKid = localStorage.getItem('fuel_active_kid');
  if (lastKid && state.kids.find(k => k.id === lastKid)) {
    state.activeKidId = lastKid;
    await Promise.all([loadFavorites(), loadComparisons()]);
    state.view = 'scan';
  } else {
    state.view = 'login';
  }
  render();
}

boot().catch(e => {
  console.error('boot error', e);
  document.getElementById('app').innerHTML = `<div class="loader">Error loading app: ${escape(e.message)}</div>`;
});

</script>
