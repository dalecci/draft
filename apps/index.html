<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #07090d;
    --panel: #0f1218;
    --panel-2: #161b22;
    --line: #2a2f3a;
    --text: #e6edf3;
    --muted: #8b949e;
    --gold: #d4af37;
    --gold-soft: rgba(212, 175, 55, 0.15);
    --green: #4ade80;
  }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    background:
      radial-gradient(1200px 600px at 50% -100px, rgba(212,175,55,0.08), transparent 60%),
      var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 24px 16px 48px;
  }

  /* ---------- gate ---------- */
  .gate { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 20px; }
  .gate-card { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 32px 28px; max-width: 360px; width: 100%; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }
  .gate-logo { font-family: "Cormorant Garamond", "Times New Roman", serif; font-size: 36px; font-weight: 600; color: var(--gold); letter-spacing: 0.5px; margin-bottom: 6px; }
  .gate-sub { color: var(--muted); font-size: 13px; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 28px; }
  .pin-input { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; color: var(--text); font-size: 28px; text-align: center; letter-spacing: 12px; padding: 16px; font-weight: 600; outline: none; transition: border-color .15s, box-shadow .15s; }
  .pin-input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-soft); }
  .pin-input.error { border-color: #f87171; box-shadow: 0 0 0 3px rgba(248,113,113,.2); animation: shake .4s; }
  @keyframes shake { 0%,100% { transform: translateX(0);} 25% { transform: translateX(-6px);} 75% { transform: translateX(6px);} }
  .gate-btn { width: 100%; margin-top: 14px; padding: 14px; background: var(--gold); color: #1a1300; border: none; border-radius: 10px; font-size: 15px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; }
  .gate-btn:active { transform: scale(.98); }
  .gate-hint { color: var(--muted); font-size: 12px; margin-top: 18px; }

  /* ---------- header ---------- */
  header { max-width: 1080px; margin: 0 auto 22px; text-align: center; }
  .brand { font-family: "Cormorant Garamond", "Times New Roman", serif; font-size: 44px; font-weight: 600; color: var(--gold); letter-spacing: 1px; }
  .tagline { color: var(--muted); font-size: 12px; letter-spacing: 4px; text-transform: uppercase; margin-top: 6px; }
  main { max-width: 1080px; margin: 0 auto; }

  /* ---------- toolbar ---------- */
  .toolbar {
    position: sticky; top: 0; z-index: 30;
    background: linear-gradient(180deg, var(--bg) 70%, rgba(7,9,13,0.92) 88%, rgba(7,9,13,0));
    padding: 10px 0 16px;
    margin-bottom: 8px;
  }
  .search-wrap { position: relative; }
  .search-icon {
    position: absolute; left: 15px; top: 50%; transform: translateY(-50%);
    color: var(--muted); pointer-events: none; display: flex;
  }
  #search {
    width: 100%;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    color: var(--text);
    font-size: 15px;
    padding: 14px 84px 14px 44px;
    font-family: inherit;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
    -webkit-appearance: none;
  }
  #search::-webkit-search-cancel-button { display: none; }
  #search::placeholder { color: var(--muted); }
  #search:focus { border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-soft); }
  .search-kbd { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); display: flex; align-items: center; gap: 6px; }
  .kbd { border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; font-size: 11px; color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .clear-btn { background: none; border: none; color: var(--muted); font-size: 20px; cursor: pointer; padding: 0 4px; line-height: 1; display: none; }
  .clear-btn:hover { color: var(--gold); }

  .chips { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 12px; align-items: center; }
  .chip {
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--muted);
    padding: 7px 13px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .3px;
    cursor: pointer;
    transition: border-color .15s, color .15s, background .15s;
    white-space: nowrap;
    font-family: inherit;
  }
  .chip:hover { border-color: var(--gold); color: var(--text); }
  .chip.on { background: var(--gold-soft); border-color: var(--gold); color: var(--gold); }
  .chip .n { opacity: .55; font-weight: 500; margin-left: 5px; }
  .chips-sep { width: 1px; height: 20px; background: var(--line); margin: 0 4px; }

  .meta-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 13px; padding: 0 3px; }
  .count { color: var(--muted); font-size: 12px; letter-spacing: 1.2px; text-transform: uppercase; }
  .reset { background: none; border: none; color: var(--gold); font-size: 12px; cursor: pointer; letter-spacing: .5px; font-family: inherit; padding: 0; text-decoration: underline; text-underline-offset: 3px; visibility: hidden; }

  /* ---------- sections + cards ---------- */
  .section { margin-bottom: 30px; }
  .section-title { font-size: 12px; letter-spacing: 3px; text-transform: uppercase; color: var(--gold); margin-bottom: 12px; padding-left: 4px; display: flex; align-items: center; gap: 10px; }
  .section-title .sc { color: var(--muted); letter-spacing: 1px; font-size: 11px; font-weight: 400; }
  .section-title::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, var(--gold-soft), transparent); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; }

  .card {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 18px 18px 16px;
    text-decoration: none;
    color: var(--text);
    display: flex; flex-direction: column; gap: 6px;
    transition: transform .15s ease, border-color .15s ease, background .15s ease;
    position: relative; overflow: hidden;
  }
  .card::before { content: ""; position: absolute; top:0; left:0; right:0; height:2px; background: linear-gradient(90deg, transparent, var(--gold), transparent); opacity: 0; transition: opacity .2s; }
  .card:hover { border-color: var(--gold); transform: translateY(-2px); background: var(--panel-2); }
  .card:hover::before { opacity: 1; }
  .card-row { display: flex; align-items: center; gap: 10px; }
  .icon { font-size: 22px; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; background: var(--gold-soft); border-radius: 8px; flex-shrink: 0; }
  .card-title { font-size: 16px; font-weight: 600; line-height: 1.2; }
  .card-url { font-size: 11px; color: var(--gold); letter-spacing: .3px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-all; }
  .card-desc { font-size: 13px; color: var(--muted); line-height: 1.45; margin-top: 4px; flex: 1; }
  .card-tags { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 10px; }
  .tag { font-size: 10px; color: var(--muted); background: rgba(255,255,255,.04); border: 1px solid var(--line); border-radius: 5px; padding: 2px 6px; letter-spacing: .3px; }
  .badge { display: inline-block; background: var(--gold-soft); color: var(--gold); font-size: 10px; letter-spacing: 1px; text-transform: uppercase; padding: 3px 8px; border-radius: 20px; font-weight: 700; margin-left: auto; flex-shrink: 0; }
  .badge.new { background: rgba(74,222,128,.15); color: var(--green); }
  .badge.preview { background: rgba(96,165,250,.15); color: #93c5fd; }
  .badge.local { background: rgba(248,113,113,.15); color: #fca5a5; }
  .card.disabled { opacity: .55; cursor: default; pointer-events: none; }

  mark { background: rgba(212,175,55,.3); color: var(--text); border-radius: 3px; padding: 0 1px; }

  .empty { text-align: center; padding: 64px 20px; color: var(--muted); }
  .empty-icon { font-size: 40px; opacity: .45; margin-bottom: 14px; }
  .empty-title { font-size: 16px; color: var(--text); margin-bottom: 6px; }
  .empty-sub { font-size: 13px; }

  footer { max-width: 1080px; margin: 40px auto 0; text-align: center; color: var(--muted); font-size: 11px; letter-spacing: 1px; }
  footer a { color: var(--gold); text-decoration: none; cursor: pointer; }

  .logout-btn { position: fixed; top: 16px; right: 16px; background: var(--panel); border: 1px solid var(--line); color: var(--muted); padding: 8px 12px; border-radius: 8px; font-size: 11px; letter-spacing: 1px; text-transform: uppercase; cursor: pointer; z-index: 40; }
  .logout-btn:hover { color: var(--gold); border-color: var(--gold); }

  @media (max-width: 600px) {
    .brand { font-size: 34px; }
    body { padding: 18px 12px 32px; }
    .search-kbd .kbd { display: none; }
    #search { padding-right: 46px; }
    .grid { grid-template-columns: 1fr; }
    .logout-btn { top: 10px; right: 10px; padding: 6px 10px; }
    header { padding-top: 30px; }
    .chips-sep { display: none; }
  }
</style>
</head>

/* ============================================================
   RENDER + FILTER
   ============================================================ */
const STATUS_LABEL = { live: "Live", "new": "New", preview: "Preview", local: "Local" };
const STATUS_FILTERS = ["live", "new", "preview"];

const searchEl  = document.getElementById("search");
const clearBtn  = document.getElementById("clearBtn");
const chipRow   = document.getElementById("chipRow");
const resultsEl = document.getElementById("results");
const countEl   = document.getElementById("count");
const resetBtn  = document.getElementById("resetBtn");

let activeCat = "all";
let activeStatus = "all";
let query = "";

/* precompute a lowercase haystack per app */
APPS.forEach(function (a) {
  a._hay = [a.name, a.desc, a.label, a.cat, STATUS_LABEL[a.status] || "", a.tags.join(" ")]
    .join(" ").toLowerCase();
});

function esc(s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}

function highlight(text, terms) {
  var out = esc(text);
  if (!terms.length) return out;
  var pattern = terms
    .map(function (t) { return t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); })
    .filter(Boolean)
    .join("|");
  if (!pattern) return out;
  return out.replace(new RegExp("(" + pattern + ")", "gi"), "<mark>$1</mark>");
}

function terms() {
  return query.split(/\s+/).filter(Boolean);
}

function matches(a) {
  if (activeCat !== "all" && a.cat !== activeCat) return false;
  if (activeStatus !== "all" && a.status !== activeStatus) return false;
  var t = terms();
  for (var i = 0; i < t.length; i++) {
    if (a._hay.indexOf(t[i]) === -1) return false;
  }
  return true;
}

/* count what would match if only this one facet changed */
function countFor(kind, value) {
  return APPS.filter(function (a) {
    if (kind === "cat") {
      if (value !== "all" && a.cat !== value) return false;
      if (activeStatus !== "all" && a.status !== activeStatus) return false;
    } else {
      if (activeCat !== "all" && a.cat !== activeCat) return false;
      if (value !== "all" && a.status !== value) return false;
    }
    var t = terms();
    for (var i = 0; i < t.length; i++) {
      if (a._hay.indexOf(t[i]) === -1) return false;
    }
    return true;
  }).length;
}

function buildChips() {
  var html = "";
  html += chip("cat", "all", "All apps", countFor("cat", "all"));
  CATEGORIES.forEach(function (c) {
    html += chip("cat", c, c, countFor("cat", c));
  });
  html += '<span class="chips-sep"></span>';
  STATUS_FILTERS.forEach(function (s) {
    html += chip("status", s, STATUS_LABEL[s], countFor("status", s));
  });
  chipRow.innerHTML = html;
}

function chip(kind, value, label, n) {
  var on = (kind === "cat" ? activeCat : activeStatus) === value;
  var dim = n === 0 ? ' style="opacity:.4"' : "";
  return '<button class="chip' + (on ? " on" : "") + '" data-kind="' + kind + '" data-value="' +
    esc(value) + '"' + dim + '>' + esc(label) + '<span class="n">' + n + "</span></button>";
}

function cardHTML(a, t) {
  var tagHTML = a.tags.map(function (x) { return '<span class="tag">' + highlight(x, t) + "</span>"; }).join("");
  var badge = '<span class="badge ' + (a.status === "live" ? "" : a.status) + '">' +
    (STATUS_LABEL[a.status] || a.status) + "</span>";
  var inner =
    '<div class="card-row"><div class="icon">' + a.icon + "</div>" +
    '<div class="card-title">' + highlight(a.name, t) + "</div>" + badge + "</div>" +
    '<div class="card-url">' + highlight(a.label, t) + "</div>" +
    '<div class="card-desc">' + highlight(a.desc, t) + "</div>" +
    '<div class="card-tags">' + tagHTML + "</div>";
  if (a.status === "local") return '<div class="card disabled">' + inner + "</div>";
  return '<a class="card" href="' + esc(a.url) + '" target="_blank" rel="noopener">' + inner + "</a>";
}

function render() {
  var t = terms();
  var hits = APPS.filter(matches);

  countEl.textContent = hits.length === APPS.length
    ? APPS.length + " apps"
    : hits.length + " of " + APPS.length + " apps";

  var filtering = query !== "" || activeCat !== "all" || activeStatus !== "all";
  resetBtn.style.visibility = filtering ? "visible" : "hidden";
  clearBtn.style.display = query ? "block" : "none";

  if (!hits.length) {
    resultsEl.innerHTML =
      '<div class="empty"><div class="empty-icon">🔎</div>' +
      '<div class="empty-title">Nothing matches that</div>' +
      '<div class="empty-sub">Try a different keyword, or reset the filters.</div></div>';
    buildChips();
    return;
  }

  var html = "";
  CATEGORIES.forEach(function (c) {
    var group = hits.filter(function (a) { return a.cat === c; });
    if (!group.length) return;
    html += '<section class="section"><div class="section-title">' + esc(c) +
      '<span class="sc">' + group.length + "</span></div><div class=\"grid\">" +
      group.map(function (a) { return cardHTML(a, t); }).join("") +
      "</div></section>";
  });
  resultsEl.innerHTML = html;
  buildChips();
}

/* ---- events ---- */
searchEl.addEventListener("input", function () {
  query = searchEl.value.trim().toLowerCase();
  render();
});

searchEl.addEventListener("keydown", function (e) {
  if (e.key === "Escape") {
    searchEl.value = "";
    query = "";
    render();
    searchEl.blur();
  }
});

clearBtn.addEventListener("click", function () {
  searchEl.value = "";
  query = "";
  render();
  searchEl.focus();
});

chipRow.addEventListener("click", function (e) {
  var b = e.target.closest(".chip");
  if (!b) return;
  var kind = b.dataset.kind, value = b.dataset.value;
  if (kind === "cat") activeCat = (activeCat === value) ? "all" : value;
  else activeStatus = (activeStatus === value) ? "all" : value;
  render();
});

resetBtn.addEventListener("click", function () {
  searchEl.value = "";
  query = "";
  activeCat = "all";
  activeStatus = "all";
  render();
});

document.addEventListener("keydown", function (e) {
  if (e.key === "/" && document.activeElement !== searchEl && main.style.display !== "none") {
    var tag = (document.activeElement && document.activeElement.tagName) || "";
    if (tag === "INPUT" || tag === "TEXTAREA") return;
    e.preventDefault();
    searchEl.focus();
    searchEl.select();
  }
});

/* ============================================================
   PIN GATE
   ============================================================ */
const PIN = "4545";
const KEY = "j3t-hub-unlocked";

const gate = document.getElementById("gate");
const main = document.getElementById("main");
const pin = document.getElementById("pin");
const unlockBtn = document.getElementById("unlockBtn");
const logoutBtn = document.getElementById("logoutBtn");
const logoutLink = document.getElementById("logoutLink");
const footerText = document.getElementById("footerText");

function unlock() {
  gate.style.display = "none";
  main.style.display = "block";
  logoutBtn.style.display = "block";
  logoutLink.style.display = "inline";
  footerText.textContent = APPS.length + " apps · session unlocked";
  render();
}

function tryUnlock() {
  if (pin.value === PIN) {
    sessionStorage.setItem(KEY, "1");
    unlock();
  } else {
    pin.classList.add("error");
    pin.value = "";
    setTimeout(function () { pin.classList.remove("error"); }, 500);
    pin.focus();
  }
}

function lock() {
  sessionStorage.removeItem(KEY);
  gate.style.display = "flex";
  main.style.display = "none";
  logoutBtn.style.display = "none";
  logoutLink.style.display = "none";
  footerText.textContent = "Locked";
  pin.value = "";
  pin.focus();
}

unlockBtn.addEventListener("click", tryUnlock);
pin.addEventListener("keydown", function (e) { if (e.key === "Enter") tryUnlock(); });
pin.addEventListener("input", function () { if (pin.value.length === 4) tryUnlock(); });
logoutBtn.addEventListener("click", lock);
logoutLink.addEventListener("click", lock);

if (sessionStorage.getItem(KEY) === "1") {
  unlock();
} else {
  pin.focus();
}
</script>
