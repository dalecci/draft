<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>J3T Owner Portal</title>
<meta name="description" content="J3T Management — owner portal. Aircraft status, flights, maintenance, documents.">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0F0F0F">
<link rel="manifest" href='data:application/manifest+json;utf8,{"name":"J3T Owner Portal","short_name":"J3T Portal","start_url":"./","display":"standalone","background_color":"%231C1C1C","theme_color":"%230F0F0F","icons":[]}'>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Montserrat:wght@300;400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Montserrat:wght@300;400;500;600;700&display=swap"></noscript>
<style>
:root{
  --ink:#0F0F0F;--charcoal:#1C1C1C;--charcoal-2:#252525;--warm-white:#F7F5F0;--cream:#EDE9E0;--mist:#D8D4CB;--stone:#9A9488;--ash:#65625B;
  --gold:#A08450;--gold-light:#C8A96A;--gold-pale:#EAD9B8;--gold-dim:rgba(160,132,80,.15);
  --green:#7FA77B;--red:#C46B5C;--amber:#D9A553;
  --serif:'Cormorant Garamond',Georgia,serif;--sans:'Montserrat',sans-serif;
  --side-w:240px;--header-h:64px;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;}
html{font-size:16px;-webkit-text-size-adjust:100%;}
body{font-family:var(--sans);background:var(--warm-white);color:var(--ink);overflow-x:hidden;font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;}
a{color:inherit;text-decoration:none;}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,textarea,select{font:inherit;color:inherit;}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}

/* ============== LOGIN ============== */
.auth-shell{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--charcoal);padding:40px 20px;position:relative;overflow:hidden;}
.auth-shell::before{content:'';position:absolute;inset:0;background-image:radial-gradient(circle at 50% 50%,rgba(160,132,80,.06),transparent 60%);pointer-events:none;}
.auth-compass{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:min(72%,640px);opacity:.05;pointer-events:none;}
.auth-card{position:relative;z-index:2;width:100%;max-width:440px;padding:48px 44px;background:rgba(28,28,28,.7);backdrop-filter:blur(12px);border:1px solid rgba(160,132,80,.25);}
.auth-mark{text-align:center;font-family:var(--sans);font-size:18px;font-weight:600;letter-spacing:5px;color:var(--warm-white);margin-bottom:8px;}
.auth-mark span{color:var(--gold);}
.auth-sub{text-align:center;font-family:var(--sans);font-size:10px;letter-spacing:4px;color:var(--stone);text-transform:uppercase;margin-bottom:36px;}
.auth-card h1{font-family:var(--serif);font-size:32px;font-weight:300;color:var(--warm-white);line-height:1.1;margin-bottom:8px;text-align:center;}
.auth-card h1 em{font-style:italic;color:var(--gold);}
.auth-tag{text-align:center;font-family:var(--serif);font-size:14px;font-style:italic;color:var(--stone);margin-bottom:32px;}
.field{margin-bottom:18px;}
.field label{display:block;font-size:10px;font-weight:500;letter-spacing:3px;text-transform:uppercase;color:var(--stone);margin-bottom:8px;}
.field input,.field select,.field textarea{width:100%;padding:12px 14px;background:rgba(0,0,0,.3);border:1px solid rgba(160,132,80,.3);color:var(--warm-white);font-size:14px;outline:none;transition:border-color .2s;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold);}
.auth-btn{display:block;width:100%;padding:14px;background:var(--gold);color:var(--ink);font-size:11px;font-weight:600;letter-spacing:3px;text-transform:uppercase;border:1px solid var(--gold);margin-top:8px;transition:all .2s;}
.auth-btn:hover{background:var(--gold-light);border-color:var(--gold-light);}
.demo-list{margin-top:32px;padding-top:24px;border-top:1px solid rgba(160,132,80,.15);}
.demo-list-title{font-size:10px;font-weight:500;letter-spacing:3px;text-transform:uppercase;color:var(--stone);margin-bottom:12px;text-align:center;}
.demo-acc{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;margin-bottom:6px;background:rgba(0,0,0,.25);border:1px solid rgba(160,132,80,.12);cursor:pointer;transition:all .2s;}
.demo-acc:hover{border-color:var(--gold);background:rgba(160,132,80,.08);}
.demo-acc-name{font-family:var(--serif);font-size:14px;color:var(--warm-white);font-style:italic;}
.demo-acc-role{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);}
.auth-foot{text-align:center;margin-top:28px;font-size:10px;letter-spacing:2px;color:rgba(154,148,136,.5);}

/* ============== APP SHELL ============== */
.app-shell{display:grid;grid-template-columns:var(--side-w) 1fr;min-height:100vh;}
.sidebar{background:var(--charcoal);color:var(--warm-white);padding:24px 0;display:flex;flex-direction:column;border-right:1px solid rgba(160,132,80,.15);position:sticky;top:0;height:100vh;overflow-y:auto;}
.side-brand{padding:0 24px 20px;border-bottom:1px solid rgba(160,132,80,.12);margin-bottom:20px;}
.side-brand-mark{font-family:var(--sans);font-size:16px;font-weight:600;letter-spacing:4px;color:var(--warm-white);}
.side-brand-mark span{color:var(--gold);}
.side-brand-sub{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--stone);margin-top:4px;}
.side-nav{flex:1;padding:0 14px;}
.side-link{display:flex;align-items:center;gap:14px;padding:11px 14px;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:rgba(247,245,240,.65);font-weight:500;border-left:2px solid transparent;margin-bottom:2px;transition:all .2s;}
.side-link:hover{color:var(--warm-white);background:rgba(160,132,80,.06);}
.side-link.active{color:var(--gold);border-left-color:var(--gold);background:rgba(160,132,80,.08);}
.side-link svg{width:16px;height:16px;flex-shrink:0;}
.side-foot{padding:16px 24px 0;border-top:1px solid rgba(160,132,80,.12);margin-top:14px;}
.side-user{display:flex;align-items:center;gap:10px;padding:8px 0;}
.side-avatar{width:32px;height:32px;border-radius:50%;background:var(--gold);color:var(--ink);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:14px;font-weight:500;flex-shrink:0;}
.side-user-info{min-width:0;flex:1;}
.side-user-name{font-family:var(--serif);font-size:14px;color:var(--warm-white);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.side-user-role{font-size:8px;letter-spacing:2px;text-transform:uppercase;color:var(--stone);}
.side-logout{margin-top:8px;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:rgba(154,148,136,.6);transition:color .2s;}
.side-logout:hover{color:var(--gold);}
.side-impersonate{margin:0 14px 14px;padding:10px;background:rgba(217,165,83,.1);border:1px solid rgba(217,165,83,.3);font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--amber);text-align:center;}
.side-impersonate strong{display:block;font-family:var(--serif);font-size:12px;font-style:italic;color:var(--gold-light);text-transform:none;letter-spacing:0;margin:4px 0;font-weight:400;}
.side-impersonate a{display:block;margin-top:6px;color:var(--gold);font-size:9px;}

.main{min-width:0;background:var(--warm-white);}
.topbar{height:var(--header-h);padding:0 32px;display:flex;align-items:center;justify-content:space-between;background:var(--warm-white);border-bottom:1px solid var(--mist);position:sticky;top:0;z-index:10;}
.topbar-title{font-family:var(--serif);font-size:24px;font-weight:300;color:var(--charcoal);}
.topbar-title em{font-style:italic;color:var(--gold);}
.topbar-actions{display:flex;gap:12px;align-items:center;}
.btn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;border:1px solid var(--gold);color:var(--gold);background:transparent;transition:all .2s;cursor:pointer;text-decoration:none;}
.btn:hover{background:var(--gold);color:var(--warm-white);}
.btn.primary{background:var(--gold);color:var(--warm-white);}
.btn.primary:hover{background:var(--gold-light);border-color:var(--gold-light);}
.btn.ghost{border-color:var(--mist);color:var(--ash);}
.btn.ghost:hover{border-color:var(--charcoal);color:var(--charcoal);background:transparent;}
.btn.danger{border-color:var(--red);color:var(--red);}
.btn.danger:hover{background:var(--red);color:#fff;}
.btn svg{width:14px;height:14px;}
.btn.sm{padding:6px 12px;font-size:10px;letter-spacing:1.5px;}

.view{padding:32px 32px 64px;max-width:1280px;}

/* ============== STATUS PILL ============== */
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;font-size:10px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;border:1px solid;border-radius:2px;}
.pill::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;}
.pill.available,.pill.confirmed,.pill.paid,.pill.completed{color:var(--green);border-color:rgba(127,167,123,.4);background:rgba(127,167,123,.08);}
.pill.maintenance,.pill.requested,.pill.outstanding,.pill.pending{color:var(--amber);border-color:rgba(217,165,83,.4);background:rgba(217,165,83,.08);}
.pill.repositioning,.pill.cancelled{color:var(--ash);border-color:rgba(101,98,91,.4);background:rgba(101,98,91,.08);}
.pill.urgent{color:var(--red);border-color:rgba(196,107,92,.4);background:rgba(196,107,92,.08);}

/* ============== DASHBOARD CARDS ============== */
.dash-status{margin-bottom:24px;padding:18px 24px;background:var(--charcoal);color:var(--warm-white);border-left:3px solid var(--gold);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;}
.dash-status-label{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--stone);margin-bottom:6px;}
.dash-status-value{font-family:var(--serif);font-size:20px;font-style:italic;color:var(--gold-light);}

.cards-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin-bottom:32px;}
.card{background:#fff;border:1px solid var(--mist);padding:24px;transition:transform .2s,box-shadow .2s,border-color .2s;cursor:pointer;}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(15,15,15,.08);border-color:var(--gold-pale);}
.card-label{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;}
.card-value{font-family:var(--serif);font-size:32px;font-weight:300;color:var(--charcoal);line-height:1;margin-bottom:8px;}
.card-value em{font-style:italic;color:var(--gold);}
.card-value.lg{font-size:40px;}
.card-meta{font-size:12px;color:var(--ash);font-family:var(--serif);font-style:italic;}
.card-meta strong{color:var(--charcoal);font-weight:500;font-style:normal;font-family:var(--sans);font-size:11px;letter-spacing:1px;}

/* ============== SECTION ============== */
.section{margin-bottom:40px;}
.section-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:18px;padding-bottom:12px;border-bottom:1px solid var(--mist);}
.section-title{font-family:var(--serif);font-size:24px;font-weight:300;color:var(--charcoal);}
.section-title em{font-style:italic;color:var(--gold);}
.section-link{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);font-weight:600;}

/* ============== TABLE ============== */
.table-wrap{background:#fff;border:1px solid var(--mist);overflow:hidden;}
.table{width:100%;border-collapse:collapse;font-size:13px;}
.table thead th{background:var(--cream);font-size:9px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--ash);padding:12px 16px;text-align:left;border-bottom:1px solid var(--mist);}
.table tbody td{padding:14px 16px;border-bottom:1px solid var(--mist);font-family:var(--serif);font-size:14px;color:var(--charcoal);}
.table tbody tr:last-child td{border-bottom:none;}
.table tbody tr{transition:background .15s;cursor:pointer;}
.table tbody tr:hover{background:var(--cream);}
.table .num{text-align:right;font-feature-settings:'tnum';font-variant-numeric:tabular-nums;font-family:var(--sans);}
.table .muted{color:var(--ash);}

/* ============== CALENDAR ============== */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
.cal-month{font-family:var(--serif);font-size:28px;font-weight:300;color:var(--charcoal);}
.cal-month em{font-style:italic;color:var(--gold);}
.cal-nav{display:flex;gap:8px;}
.cal-nav button{width:36px;height:36px;border:1px solid var(--mist);display:flex;align-items:center;justify-content:center;color:var(--ash);transition:all .2s;}
.cal-nav button:hover{border-color:var(--gold);color:var(--gold);}
.cal-grid{background:var(--mist);display:grid;grid-template-columns:repeat(7,1fr);gap:1px;border:1px solid var(--mist);}
.cal-dow{background:var(--cream);padding:10px 12px;font-size:9px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--ash);}
.cal-cell{background:#fff;min-height:96px;padding:8px;position:relative;}
.cal-cell.muted{background:#f9f7f3;color:var(--mist);}
.cal-cell.today{background:rgba(160,132,80,.08);}
.cal-cell.today .cal-num{color:var(--gold);font-weight:600;}
.cal-num{font-size:11px;color:var(--ash);font-weight:500;}
.cal-flight{display:block;margin-top:4px;padding:4px 6px;font-size:10px;line-height:1.3;cursor:pointer;border-left:2px solid var(--gold);background:rgba(160,132,80,.08);color:var(--charcoal);transition:all .15s;}
.cal-flight.requested{border-left-color:var(--amber);background:rgba(217,165,83,.1);}
.cal-flight.completed{border-left-color:var(--green);background:rgba(127,167,123,.08);color:var(--ash);}
.cal-flight:hover{background:var(--gold);color:#fff;}
.cal-flight strong{display:block;font-weight:600;}

/* ============== FLIGHT DETAIL ============== */
.fd-head{background:var(--charcoal);color:var(--warm-white);padding:32px;margin:-32px -32px 32px;}
.fd-route{display:flex;align-items:center;gap:24px;flex-wrap:wrap;}
.fd-airport{font-family:var(--serif);font-size:56px;font-weight:300;line-height:1;}
.fd-arrow{font-family:var(--serif);font-size:32px;color:var(--gold);}
.fd-airport-name{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--stone);margin-top:4px;}
.fd-meta{display:flex;gap:32px;margin-top:24px;flex-wrap:wrap;}
.fd-meta-item{}
.fd-meta-label{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--stone);margin-bottom:6px;}
.fd-meta-value{font-family:var(--serif);font-size:18px;font-style:italic;color:var(--gold-light);}
.fd-sections{display:grid;grid-template-columns:2fr 1fr;gap:24px;}
@media(max-width:900px){.fd-sections{grid-template-columns:1fr;}}
.fd-panel{background:#fff;border:1px solid var(--mist);padding:24px;}
.fd-panel h3{font-family:var(--serif);font-size:18px;font-weight:400;color:var(--charcoal);margin-bottom:16px;padding-bottom:8px;border-bottom:1px solid var(--mist);}
.kv{display:grid;grid-template-columns:120px 1fr;gap:8px;margin-bottom:10px;font-size:13px;}
.kv dt{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--ash);padding-top:2px;}
.kv dd{font-family:var(--serif);font-size:15px;color:var(--charcoal);}

/* ============== DOCUMENTS ============== */
.docs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;}
.doc{background:#fff;border:1px solid var(--mist);padding:20px;display:flex;flex-direction:column;gap:8px;transition:all .2s;}
.doc:hover{border-color:var(--gold-pale);transform:translateY(-2px);}
.doc-icon{width:32px;height:40px;border:1px solid var(--gold);position:relative;margin-bottom:10px;}
.doc-icon::before{content:'';position:absolute;top:0;right:0;width:10px;height:10px;background:linear-gradient(135deg,transparent 50%,var(--gold) 50%);}
.doc-name{font-family:var(--serif);font-size:16px;color:var(--charcoal);line-height:1.3;}
.doc-type{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);}
.doc-meta{font-size:11px;color:var(--ash);margin-top:auto;display:flex;justify-content:space-between;}
.doc-expiring{color:var(--amber);}

/* ============== MAINTENANCE ============== */
.mx-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-bottom:24px;}
.mx-card{background:#fff;border:1px solid var(--mist);padding:20px;}
.mx-card-label{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);margin-bottom:12px;}
.mx-progress{height:6px;background:var(--mist);margin:14px 0 8px;overflow:hidden;}
.mx-progress-bar{height:100%;background:var(--gold);transition:width .3s;}
.mx-progress-bar.warn{background:var(--amber);}
.mx-progress-bar.critical{background:var(--red);}
.mx-meta{font-size:11px;color:var(--ash);display:flex;justify-content:space-between;}

/* ============== COSTS ============== */
.costs-chart{background:#fff;border:1px solid var(--mist);padding:32px;margin-bottom:24px;}
.bar-row{display:grid;grid-template-columns:140px 1fr 100px;gap:14px;align-items:center;padding:10px 0;font-size:13px;}
.bar-row+.bar-row{border-top:1px solid var(--mist);}
.bar-label{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ash);}
.bar-track{height:10px;background:var(--cream);position:relative;overflow:hidden;}
.bar-fill{height:100%;background:linear-gradient(to right,var(--gold) 0%,var(--gold-light) 100%);transition:width .3s;}
.bar-val{text-align:right;font-family:var(--serif);font-size:16px;color:var(--charcoal);font-feature-settings:'tnum';}

/* ============== ADMIN ============== */
.admin-clients{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px;margin-bottom:24px;}
.admin-client{background:#fff;border:1px solid var(--mist);padding:20px;transition:all .2s;}
.admin-client:hover{border-color:var(--gold-pale);transform:translateY(-2px);box-shadow:0 8px 28px rgba(15,15,15,.06);}
.admin-client-head{display:flex;align-items:center;gap:12px;margin-bottom:14px;}
.admin-avatar{width:48px;height:48px;border-radius:50%;background:var(--gold);color:var(--ink);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:20px;font-weight:500;flex-shrink:0;}
.admin-client-name{font-family:var(--serif);font-size:20px;font-weight:400;color:var(--charcoal);}
.admin-client-co{font-size:11px;color:var(--ash);}
.admin-client-aircraft{padding:12px 0;margin:8px 0;border-top:1px solid var(--mist);border-bottom:1px solid var(--mist);font-family:var(--serif);font-size:14px;color:var(--charcoal);}
.admin-client-aircraft strong{color:var(--gold);font-weight:500;}
.admin-actions{display:flex;gap:8px;margin-top:14px;}

/* ============== EMPTY STATE ============== */
.empty{padding:64px 24px;text-align:center;color:var(--ash);}
.empty h3{font-family:var(--serif);font-size:22px;font-weight:300;color:var(--charcoal);margin-bottom:8px;}

/* ============== MODAL ============== */
.modal-bg{position:fixed;inset:0;background:rgba(15,15,15,.6);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;}
.modal{background:var(--warm-white);max-width:560px;width:100%;max-height:90vh;overflow-y:auto;border:1px solid var(--mist);}
.modal-head{padding:24px 32px;border-bottom:1px solid var(--mist);display:flex;justify-content:space-between;align-items:center;}
.modal-head h2{font-family:var(--serif);font-size:24px;font-weight:300;color:var(--charcoal);}
.modal-head h2 em{font-style:italic;color:var(--gold);}
.modal-close{font-size:24px;color:var(--ash);line-height:1;}
.modal-body{padding:24px 32px;}
.modal-foot{padding:18px 32px;border-top:1px solid var(--mist);display:flex;gap:12px;justify-content:flex-end;background:var(--cream);}

/* Light versions of fields (for modal/admin) */
.light-field label{color:var(--ash);}
.light-field input,.light-field select,.light-field textarea{background:#fff;border:1px solid var(--mist);color:var(--charcoal);}
.light-field input:focus,.light-field select:focus,.light-field textarea:focus{border-color:var(--gold);}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

/* Toast */
.toast{position:fixed;bottom:24px;right:24px;background:var(--charcoal);color:var(--warm-white);padding:14px 20px;border-left:3px solid var(--gold);font-size:13px;z-index:200;animation:toastIn .3s ease;}
@keyframes toastIn{from{opacity:0;transform:translateY(20px);}}

/* ===== sidebar badge ===== */
.side-link{position:relative;}
.side-badge{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--gold);color:var(--ink);font-size:11px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;}

/* ===== gold savings card ===== */
.card.card-gold{border-color:var(--gold-pale);background:linear-gradient(180deg,rgba(160,132,80,.05),rgba(160,132,80,.01));}
.card.card-gold .card-value em{color:var(--gold);font-style:italic;}

/* ===== approvals dashboard banner ===== */
.approve-banner{display:flex;align-items:center;gap:16px;background:var(--charcoal);color:var(--warm-white);padding:18px 22px;margin-bottom:24px;border-left:3px solid var(--amber);cursor:pointer;transition:background .2s;}
.approve-banner:hover{background:#242424;}
.approve-banner-icon{width:26px;height:26px;color:var(--amber);flex-shrink:0;}
.approve-banner-title{font-family:var(--serif);font-size:19px;color:var(--warm-white);}
.approve-banner-sub{font-size:12px;color:var(--stone);margin-top:2px;}
.approve-banner-cta{font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--amber);flex-shrink:0;}

/* ===== savings page ===== */
.savings-hero{background:var(--charcoal);color:var(--warm-white);padding:44px 40px;margin-bottom:32px;border-left:3px solid var(--gold);}
.savings-hero-label{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--stone);margin-bottom:14px;}
.savings-hero-value{font-family:var(--serif);font-size:64px;font-weight:300;color:var(--gold-light);line-height:1;font-style:italic;}
.savings-hero-sub{font-family:var(--serif);font-size:18px;color:rgba(247,245,240,.72);margin-top:18px;max-width:620px;line-height:1.6;}
.savings-hero-sub strong{color:var(--warm-white);font-weight:500;}

/* ===== approval cards ===== */
.approval-card{background:#fff;border:1px solid var(--mist);padding:28px;margin-bottom:20px;}
.approval-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:14px;}
.approval-cat{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);margin-bottom:6px;}
.approval-title{font-family:var(--serif);font-size:26px;font-weight:400;color:var(--charcoal);line-height:1.15;}
.approval-date{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--ash);white-space:nowrap;flex-shrink:0;padding-top:4px;}
.approval-desc{font-family:var(--serif);font-size:17px;line-height:1.7;color:#4A4A48;margin-bottom:20px;}
.bid-list{display:flex;flex-direction:column;gap:1px;background:var(--mist);border:1px solid var(--mist);margin-bottom:20px;}
.bid{display:flex;justify-content:space-between;align-items:center;gap:16px;background:#fff;padding:16px 18px;}
.bid.rec{background:rgba(160,132,80,.06);}
.bid-vendor{font-family:var(--serif);font-size:18px;color:var(--charcoal);display:flex;align-items:center;gap:10px;}
.bid-rec-tag{font-family:var(--sans);font-size:8px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--gold);border:1px solid var(--gold-pale);padding:3px 7px;border-radius:2px;}
.bid-note{font-size:12px;color:var(--ash);margin-top:3px;}
.bid-amount{font-family:var(--serif);font-size:22px;font-weight:500;color:var(--charcoal);font-variant-numeric:tabular-nums;flex-shrink:0;}
.approval-rec{background:var(--cream);border-left:3px solid var(--gold);padding:14px 18px;margin-bottom:22px;}
.approval-rec-label{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);margin-bottom:6px;}
.approval-rec-text{font-family:var(--serif);font-size:16px;font-style:italic;color:var(--charcoal);line-height:1.5;}
.approval-actions{display:flex;gap:12px;flex-wrap:wrap;}

/* ===== trip card ===== */
.fd-tripcard-btn{display:inline-flex;align-items:center;gap:8px;margin-top:20px;font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--gold-light);text-decoration:none;padding:10px 18px;border:1px solid rgba(160,132,80,.5);cursor:pointer;}
.fd-tripcard-btn svg{width:14px;height:14px;}
.fd-tripcard-btn:hover{background:var(--gold);color:var(--ink);}
.trip-card{background:var(--charcoal);color:var(--warm-white);padding:36px 34px;position:relative;overflow:hidden;}
.trip-card::after{content:'';position:absolute;top:-40px;right:-40px;width:180px;height:180px;border:1px solid rgba(160,132,80,.15);border-radius:50%;}
.trip-brand{font-family:var(--sans);font-size:16px;font-weight:600;letter-spacing:5px;color:var(--warm-white);}
.trip-brand span{color:var(--gold);}
.trip-tail{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--stone);margin-top:6px;}
.trip-route{display:flex;align-items:center;gap:20px;margin:26px 0 8px;}
.trip-ap-code{font-family:var(--serif);font-size:44px;font-weight:300;color:var(--warm-white);line-height:1;}
.trip-ap-time{font-size:12px;letter-spacing:2px;color:var(--gold-light);margin-top:4px;}
.trip-arrow{font-family:var(--serif);font-size:26px;color:var(--gold);}
.trip-date{font-family:var(--serif);font-size:18px;font-style:italic;color:var(--stone);}
.trip-rule{height:1px;background:rgba(160,132,80,.25);margin:24px 0;}
.trip-sec{margin-bottom:20px;}
.trip-sec-label{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);margin-bottom:8px;}
.trip-row{display:flex;justify-content:space-between;align-items:center;gap:12px;font-family:var(--serif);font-size:16px;color:var(--warm-white);padding:3px 0;}
.trip-row.muted{color:var(--stone);font-style:italic;}
.trip-phone{font-family:var(--sans);font-size:13px;color:var(--gold-light);text-decoration:none;white-space:nowrap;}
.trip-fbo-name{font-family:var(--serif);font-size:18px;color:var(--warm-white);}
.trip-fbo-addr{font-size:13px;color:var(--stone);margin:4px 0 6px;line-height:1.4;}
.trip-foot{margin-top:12px;padding-top:16px;border-top:1px solid rgba(160,132,80,.25);font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--stone);}
/* ===== share sheet ===== */
.share-overlay{position:fixed;inset:0;background:rgba(15,15,15,.55);backdrop-filter:blur(3px);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px;animation:toastIn .2s ease;}
.share-sheet{background:var(--warm-white);width:100%;max-width:380px;border:1px solid var(--mist);overflow:hidden;}
.share-sheet-title{font-family:var(--serif);font-size:22px;font-weight:400;color:var(--charcoal);padding:22px 24px 6px;}
.share-sheet-sub{font-family:var(--sans);font-size:12px;color:var(--ash);line-height:1.5;padding:0 24px 16px;border-bottom:1px solid var(--mist);}
.share-opt.primary-opt{background:rgba(160,132,80,.07);}
.share-opt.primary-opt span{font-weight:600;}
.share-opt{display:flex;align-items:center;gap:14px;width:100%;padding:15px 24px;font-family:var(--sans);font-size:15px;color:var(--charcoal);text-decoration:none;background:#fff;border:none;border-bottom:1px solid var(--mist);cursor:pointer;text-align:left;transition:background .15s;}
.share-opt:hover{background:var(--cream);}
.share-opt svg{width:20px;height:20px;color:var(--gold);flex-shrink:0;}
.share-cancel{display:block;width:100%;padding:15px;font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--ash);background:var(--cream);border:none;cursor:pointer;}
.share-cancel:hover{color:var(--charcoal);}
/* ===== tab permission checkboxes ===== */
.tabperm{display:flex;align-items:center;gap:11px;padding:12px 14px;border:1px solid var(--mist);background:#fff;cursor:pointer;font-family:var(--sans);font-size:14px;color:var(--charcoal);transition:all .15s;}
.tabperm:hover{border-color:var(--gold-pale);}
.tabperm.on{border-color:var(--gold);background:rgba(160,132,80,.06);}
.tabperm input{width:17px;height:17px;accent-color:var(--gold);cursor:pointer;flex-shrink:0;}
.tabperm input:disabled{cursor:not-allowed;}

/* ============== ADMIN CALENDAR (master) ============== */
.cal-flight.master{border-left-width:3px;font-weight:500;}
.cal-flight .client-dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:4px;vertical-align:middle;}
.cal-flight-tip{position:absolute;display:none;background:var(--charcoal);color:var(--warm-white);padding:10px 14px;font-size:12px;line-height:1.5;border-left:3px solid var(--gold);z-index:50;width:280px;box-shadow:0 8px 24px rgba(0,0,0,.25);pointer-events:none;}
.cal-flight:hover .cal-flight-tip{display:block;top:100%;left:0;}
.cal-flight-tip strong{display:block;color:var(--gold-light);font-family:var(--serif);font-size:14px;font-style:italic;}
.client-legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:20px;justify-content:center;}
.client-legend-item{display:inline-flex;align-items:center;gap:8px;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ash);}
.client-legend-item .dot{width:12px;height:12px;border-radius:50%;}

/* ============== ADMIN FLIGHT EDIT (compact form sections) ============== */
.flight-tabs{display:flex;gap:0;margin-bottom:24px;border-bottom:1px solid var(--mist);}
.flight-tab{padding:12px 20px;font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--ash);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .2s;}
.flight-tab:hover{color:var(--charcoal);}
.flight-tab.active{color:var(--gold);border-bottom-color:var(--gold);}
.flight-tab .count{margin-left:6px;font-size:10px;padding:2px 6px;background:var(--cream);color:var(--ash);border-radius:8px;}
.flight-tab.active .count{background:var(--gold-pale);color:var(--gold);}
.tab-pane{display:none;}
.tab-pane.active{display:block;}

.exp-row{display:grid;grid-template-columns:120px 160px 1fr 100px 32px;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--mist);}
.exp-row:last-child{border-bottom:none;}
.exp-row select,.exp-row input{padding:6px 8px;border:1px solid var(--mist);background:#fff;font-size:12px;}
.exp-row .num input{text-align:right;font-variant-numeric:tabular-nums;}
.exp-row button.remove{color:var(--red);font-size:18px;line-height:1;}

/* Receipt OCR */
.receipt-zone{border:2px dashed var(--mist);padding:32px;text-align:center;cursor:pointer;transition:all .2s;background:var(--cream);}
.receipt-zone:hover,.receipt-zone.drag{border-color:var(--gold);background:var(--gold-pale);}
.receipt-zone p{font-family:var(--serif);font-size:16px;font-style:italic;color:var(--ash);}
.receipt-zone .hint{font-family:var(--sans);font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--ash);margin-top:8px;}
.receipt-preview{display:flex;gap:14px;align-items:flex-start;padding:14px;background:#fff;border:1px solid var(--mist);}
.receipt-preview img{width:120px;height:120px;object-fit:cover;border:1px solid var(--mist);}
.receipt-ai-status{flex:1;}
.receipt-ai-status .step{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:12px;color:var(--ash);}
.receipt-ai-status .step.done{color:var(--green);}
.receipt-ai-status .step.active{color:var(--gold);font-weight:500;}
.receipt-ai-status .spin{display:inline-block;width:10px;height:10px;border:2px solid var(--gold);border-top-color:transparent;border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* Squawk status colors */
.sq-row{position:relative;}
.sq-row::before{content:'';position:absolute;left:-12px;top:50%;transform:translateY(-50%);width:4px;height:60%;background:var(--ash);border-radius:2px;}
.sq-row.sq-status-todo::before{background:var(--ash);}
.sq-row.sq-status-in_progress::before{background:var(--amber);}
.sq-row.sq-status-done::before{background:var(--green);}
.sq-row.sq-status-done input[data-sqfield="item"]{text-decoration:line-through;color:var(--ash);}
.sq-row select[data-sqfield="status"]{font-weight:500;}
.sq-row.sq-status-todo select[data-sqfield="status"]{color:var(--ash);}
.sq-row.sq-status-in_progress select[data-sqfield="status"]{color:var(--amber);background:rgba(217,165,83,.08);}
.sq-row.sq-status-done select[data-sqfield="status"]{color:var(--green);background:rgba(127,167,123,.08);}

/* Toggle box */
.toggle-box{display:flex;align-items:center;gap:12px;padding:14px 16px;background:var(--cream);border:1px solid var(--mist);margin-bottom:18px;cursor:pointer;transition:all .2s;}
.toggle-box:hover{border-color:var(--gold-pale);}
.toggle-box input[type="checkbox"]{width:18px;height:18px;cursor:pointer;accent-color:var(--gold);}
.toggle-box .toggle-title{font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--charcoal);}
.toggle-box .toggle-desc{font-family:var(--serif);font-style:italic;color:var(--ash);font-size:13px;margin-left:auto;}
.toggle-box.off{opacity:.7;}
.toggle-box.off .toggle-title{color:var(--ash);}

/* Filter bar */
.filter-bar{display:flex;gap:10px;align-items:center;margin-bottom:18px;flex-wrap:wrap;}
.filter-bar select,.filter-bar input{padding:8px 12px;border:1px solid var(--mist);background:#fff;font-size:12px;color:var(--charcoal);}
.filter-bar label{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--ash);}

/* ============== RESPONSIVE ============== */
.menu-toggle{display:none;}
@media(max-width:900px){
  :root{--side-w:0px;}
  .app-shell{grid-template-columns:1fr;}
  .sidebar{position:fixed;left:-260px;top:0;width:260px;z-index:50;height:100vh;transition:left .25s;}
  .sidebar.open{left:0;}
  .menu-toggle{display:inline-flex;width:36px;height:36px;align-items:center;justify-content:center;border:1px solid var(--mist);color:var(--charcoal);margin-right:12px;}
  .topbar{padding:0 20px;}
  .view{padding:20px 20px 64px;}
  .fd-head{padding:24px 20px;margin:-20px -20px 24px;}
  .fd-airport{font-size:40px;}
  .row2{grid-template-columns:1fr;}
  .table thead{display:none;}
  .table tbody td{display:block;padding:8px 16px;border-bottom:none;}
  .table tbody tr{display:block;padding:14px 0;border-bottom:1px solid var(--mist);}
}
</style>

  ['dashboard','Dashboard'],

  ['maintenance','Maintenance'],
  ['documents','Documents'],
  ['savings','Savings'],

];

function tabLabel(k){ const m = TAB_META.find(t=>t[0]===k); return m ? m[1] : k; }

function migrateState(s){
  // Soft migrations — upgrade fields without wiping user data
  (s.clients||[]).forEach(c => {
    if (!c.maintenance) c.maintenance = {};
    const m = c.maintenance;
    // Old single-phase → phases[] array
    if (!m.phases){
      if (m.next_phase || m.hobbs_at_next_phase){
        m.phases = [{
          id: 'p-'+Math.random().toString(36).slice(2,8),
          name: m.next_phase || 'Phase inspection',
          hobbs_at: m.hobbs_at_next_phase || null,
          due_date: null
        }];
      } else {
        m.phases = [];
      }
      delete m.next_phase;
      delete m.hobbs_at_next_phase;
    }
    // Default visibility flags
    if (m.annual_visible === undefined) m.annual_visible = true;
    if (m.phases_visible === undefined) m.phases_visible = true;
    if (m.squawks_visible === undefined) m.squawks_visible = true;
    // Ensure squawks have status
    (m.squawks||[]).forEach(sq => { if (!sq.status) sq.status = 'todo'; });
  });
  // Top-level collections added in v3
  if (!s.savings) s.savings = [];
  if (!s.approvals) s.approvals = [];
  (s.flights||[]).forEach(f => {
    if (f.dep_fbo === undefined) f.dep_fbo = null;
    if (f.arr_fbo === undefined) f.arr_fbo = null;
  });
  // Users added in v4 — backfill one primary owner per client with all tabs
  if (!s.users) s.users = [];
  (s.clients||[]).forEach(c => {
    if (!s.users.some(u => u.client_id === c.id && u.primary)){
      s.users.push({ id:'u-'+Math.random().toString(36).slice(2,8), client_id:c.id, email:c.email, name:c.name, label:'Owner', primary:true, tabs:ALL_TAB_KEYS.slice() });
    }
  });
  return s;
}

function loadState(){
  try{
    const saved = localStorage.getItem(LS_KEY);
    if (saved){
      const s = JSON.parse(saved);
      if (!s._meta || s._meta.version !== SEED._meta.version){
        return JSON.parse(JSON.stringify(SEED));
      }
      return migrateState(s);
    }
  }catch(e){}
  return migrateState(JSON.parse(JSON.stringify(SEED)));
}
function saveState(){ localStorage.setItem(LS_KEY, JSON.stringify(state)); }
function resetState(){ localStorage.removeItem(LS_KEY); state = JSON.parse(JSON.stringify(SEED)); }

function nextColor(){
  const used = state.clients.map(c=>c.color);
  return PALETTE.find(c=>!used.includes(c)) || PALETTE[state.clients.length % PALETTE.length];
}

let state = loadState();

function getSession(){
  try{ return JSON.parse(sessionStorage.getItem(SESSION_KEY) || 'null'); }catch(e){ return null; }

  let out = str[0];
  for (let i=0;i<args.length;i++) out += String(args[i]).replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c])) + str[i+1];
  return out;
};

  let out = str[0];

function fmtDate(d, opts={month:'short',day:'numeric',year:'numeric'}){
  if (!d) return '—';
  return new Date(d+'T12:00:00').toLocaleDateString('en-US', opts);
}
function fmtDateShort(d){ return fmtDate(d,{month:'short',day:'numeric'}); }
function fmtMoney(n){ return '$' + (Math.round(n)).toLocaleString('en-US'); }
function fmtTime(t){ return t || '—'; }
function daysBetween(a,b){ return Math.round((new Date(b) - new Date(a))/86400000); }
function daysFromNow(d){ return daysBetween(new Date().toISOString().slice(0,10), d); }
function uid(prefix){ return prefix + '-' + Math.random().toString(36).slice(2,8); }
function escapeAttr(s){ return String(s||'').replace(/"/g,'&quot;'); }

/* ============== ROUTER ============== */
function parseRoute(){
  const hash = location.hash.replace(/^#\/?/, '') || '';
  const parts = hash.split('/').filter(Boolean);
  return { path: parts.join('/'), parts };
}

window.addEventListener('load', render);
window.addEventListener('click', e => {
  const a = e.target.closest('a[data-nav]');
  if (a) {
    e.preventDefault();
    location.hash = a.getAttribute('data-nav');
  }
});

function navigate(hash){ location.hash = hash; }

  document.getElementById('app').innerHTML = renderShell(session, path, route.parts);

  attachViewHandlers(session, path, route.parts);
}

/* ============== APP SHELL ============== */
function resolveUser(session){
  if (!session) return null;
  if (session.impersonating_uid) return state.users.find(u=>u.id===session.impersonating_uid) || null;
  if (session.impersonating) return state.users.find(u=>u.client_id===session.impersonating && u.primary) || state.users.find(u=>u.client_id===session.impersonating) || null;
  if (session.uid) return state.users.find(u=>u.id===session.uid) || null;
  if (session.role==='owner') return state.users.find(u=>u.client_id===session.userId && u.primary) || state.users.find(u=>u.client_id===session.userId) || null;
  return null;
}
let currentPerm = ALL_TAB_KEYS.slice();
function can(tab){ return currentPerm.includes(tab); }
function firstPermittedTab(){ return ALL_TAB_KEYS.find(t => currentPerm.includes(t)) || 'flights'; }

function renderShell(session, path, parts){
  const isAdmin = session.role === 'admin';
  const isImpersonating = isAdmin && !!session.impersonating;
  const viewingClient = isImpersonating ? state.clients.find(c=>c.id===session.impersonating) : null;
  const effectiveRole = isImpersonating ? 'owner' : session.role;
  const clientId = isImpersonating ? (viewingClient && viewingClient.id) : (effectiveRole==='owner' ? session.userId : null);

  // Resolve the acting user and their permitted tabs
  const currentUser = effectiveRole==='owner' ? resolveUser(session) : null;
  currentPerm = currentUser ? currentUser.tabs.slice() : ALL_TAB_KEYS.slice();

  // Sidebar links depend on role
  const adminLinks = [
    ['admin', 'Clients', I.users],
    ['admin/calendar', 'Master Calendar', I.cal],
    ['admin/flights', 'All Flights', I.plane],
    ['admin/crew', 'Crew', I.users],
    ['admin/settings', 'Settings', I.settings],
    ['admin/data', 'Demo Data', I.docs]
  ];
  const pendingApprovals = clientId ? state.approvals.filter(a=>a.client_id===clientId && a.status==='pending').length : 0;
  const ownerLinksAll = [
    ['dashboard', 'Dashboard', I.dash],
    ['calendar', 'Calendar', I.cal],
    ['flights', 'Flights', I.plane],
    ['approvals', 'Approvals', I.approve, pendingApprovals],
    ['maintenance', 'Maintenance', I.wrench],
    ['documents', 'Documents', I.docs],
    ['savings', 'Savings', I.saving],
    ['costs', 'Costs', I.chart]
  ];
  const ownerLinks = ownerLinksAll.filter(l => currentPerm.includes(l[0]));
  const links = effectiveRole === 'admin' ? adminLinks : ownerLinks;

  const userName = isAdmin && !isImpersonating ? 'J3T Administrator' : (currentUser ? currentUser.name : (viewingClient ? viewingClient.name : 'Unknown'));
  const userRole = isAdmin && !isImpersonating ? 'Administrator' : (currentUser ? (currentUser.label || 'User') : 'Aircraft Owner');

  const sideLinks = links.map(([p,label,icon,badge]) => raw`<a href="#${p}" data-nav="${p}" class="side-link ${path.startsWith(p)?'active':''}">${icon}<span>${label}</span>${badge>0?raw`<span class="side-badge">${badge}</span>`:''}</a>`).join('');

  const impersonateBanner = isImpersonating ? raw`
    <div class="side-impersonate">
      Viewing as
      <strong>${h`${currentUser ? currentUser.name : viewingClient.name}`}</strong>
      ${currentUser ? raw`<span style="display:block;font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--amber);opacity:.8;">${h`${currentUser.label}`} · ${h`${viewingClient.aircraft.tail}`}</span>` : ''}
      <a href="#admin" data-nav="admin">Return to admin</a>
    </div>
  ` : '';

  const view = renderView(effectiveRole, path, parts, clientId);

  return raw`
    <div class="app-shell">
      <aside class="sidebar" id="sidebar">
        <div class="side-brand">
          <div class="side-brand-mark">J3<span>T</span></div>
          <div class="side-brand-sub">Owner Portal</div>
        </div>
        ${impersonateBanner}
        <nav class="side-nav">${sideLinks}</nav>
        <div class="side-foot">
          <div class="side-user">
            <div class="side-avatar">${h`${initials(userName||'??')}`}</div>
            <div class="side-user-info">
              <div class="side-user-name">${h`${userName||'Unknown'}`}</div>
              <div class="side-user-role">${h`${userRole}`}</div>
            </div>
          </div>
          <button class="side-logout" id="logoutBtn">Sign out &rarr;</button>
        </div>
      </aside>
      <main class="main">
        ${view}
      </main>
    </div>`;
}

/* ============== VIEW DISPATCH ============== */
function renderView(role, path, parts, clientId){
  if (role === 'admin'){
    if (path === 'admin' || path === 'admin/') return adminDashboard();
    if (path === 'admin/clients/new') return adminClientForm(null);
    if (parts[0]==='admin' && parts[1]==='clients' && parts[2] && parts[3]==='maintenance') return adminMaintenance(parts[2]);
    if (parts[0]==='admin' && parts[1]==='clients' && parts[2] && parts[3]==='documents') return adminClientDocs(parts[2]);
    if (parts[0]==='admin' && parts[1]==='clients' && parts[2] && parts[3]==='savings') return adminClientSavings(parts[2]);
    if (parts[0]==='admin' && parts[1]==='clients' && parts[2] && parts[3]==='approvals') return adminClientApprovals(parts[2]);
    if (parts[0]==='admin' && parts[1]==='clients' && parts[2] && parts[3]==='users' && parts[4]==='new') return adminUserForm(parts[2], null);
    if (parts[0]==='admin' && parts[1]==='clients' && parts[2] && parts[3]==='users' && parts[4]) return adminUserForm(parts[2], parts[4]);
    if (parts[0]==='admin' && parts[1]==='clients' && parts[2] && parts[3]==='users') return adminClientUsers(parts[2]);
    if (parts[0]==='admin' && parts[1]==='clients' && parts[2]) return adminClientForm(parts[2]);
    if (path === 'admin/calendar') return adminMasterCalendar();
    if (path === 'admin/flights') return adminAllFlights();
    if (path === 'admin/flights/new') return adminFlightEdit(null);
    if (parts[0]==='admin' && parts[1]==='flights' && parts[2]) return adminFlightEdit(parts[2]);
    if (path === 'admin/crew') return adminCrewList();
    if (path === 'admin/crew/new') return adminCrewForm(null);
    if (parts[0]==='admin' && parts[1]==='crew' && parts[2]) return adminCrewForm(parts[2]);
    if (path === 'admin/settings') return adminSettings();
    if (path === 'admin/data') return adminData();
    return adminDashboard();
  }
  // Owner views (or admin impersonating)
  // Tab permission gate — a blocked tab (direct URL or stale link) falls back to the first permitted tab
  const need = (parts[0]==='trip') ? 'flights' : (ALL_TAB_KEYS.includes(parts[0]) ? parts[0] : 'dashboard');
  if (!currentPerm.includes(need)){
    const first = firstPermittedTab();
    if ((parts[0]||'dashboard') !== first){
      setTimeout(()=>{ const b=location.hash.replace(/^#\/?/,'').split('/')[0]||'dashboard'; if (!currentPerm.includes(b==='trip'?'flights':b)) location.hash = '#'+first; }, 0);
    }
    path = first; parts = [first];
  }
  if (path === 'dashboard') return ownerDashboard(clientId);
  if (path === 'calendar') return ownerCalendar(clientId);
  if (path === 'flights') return ownerFlights(clientId);
  if (parts[0]==='flights' && parts[1]==='new') return ownerFlightRequest(clientId);
  if (parts[0]==='flights' && parts[1]) return ownerFlightDetail(parts[1], clientId);
  if (parts[0]==='trip' && parts[1]) return ownerTripCard(parts[1], clientId);
  if (path === 'approvals') return ownerApprovals(clientId);
  if (path === 'savings') return ownerSavings(clientId);
  if (path === 'documents') return ownerDocuments(clientId);
  if (path === 'maintenance') return ownerMaintenance(clientId);
  if (path === 'costs') return ownerCosts(clientId);
  return ownerDashboard(clientId);
}

/* ============== OWNER CALENDAR ============== */
let calMonth = null;  // YYYY-MM
function ownerCalendar(clientId){
  const c = state.clients.find(x=>x.id===clientId);
  if (!calMonth) calMonth = new Date().toISOString().slice(0,7);
  const [yr, mo] = calMonth.split('-').map(Number);
  const firstDay = new Date(yr, mo-1, 1);
  const startDow = firstDay.getDay();
  const daysInMonth = new Date(yr, mo, 0).getDate();
  const monthName = firstDay.toLocaleString('en-US',{month:'long',year:'numeric'});

  const today = new Date().toISOString().slice(0,10);
  const flights = state.flights.filter(f=>f.client_id===clientId);

  // Build grid: 6 rows × 7 cols = 42 cells
  const cells = [];
  // Lead from prev month
  for (let i=0;i<startDow;i++){
    const d = new Date(yr, mo-1, -(startDow-1-i));
    cells.push({date:d.toISOString().slice(0,10), num:d.getDate(), muted:true});
  }
  for (let d=1;d<=daysInMonth;d++){
    const ds = `${yr}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    cells.push({date:ds, num:d, muted:false});
  }
  while (cells.length<42){
    const last = new Date(cells[cells.length-1].date);
    last.setDate(last.getDate()+1);
    cells.push({date:last.toISOString().slice(0,10), num:last.getDate(), muted:true});
  }

  const dows = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

  function prevMonth(){ const d = new Date(yr, mo-2, 1); return d.toISOString().slice(0,7); }
  function nextMonth(){ const d = new Date(yr, mo, 1); return d.toISOString().slice(0,7); }

  return raw`
    ${topbar('Calendar', 'Flight schedule')}
    <div class="view">
      <div class="cal-head">
        <div>
          <h2 class="cal-month">${monthName}</h2>
          <div style="font-size:11px;color:var(--ash);letter-spacing:1.5px;text-transform:uppercase;margin-top:4px;">${c.aircraft.tail} &middot; ${c.aircraft.model}</div>
        </div>
        <div style="display:flex;gap:12px;align-items:center;">
          <div class="cal-nav">
            <button onclick="calMonth='${prevMonth()}';render();">&lsaquo;</button>
            <button onclick="calMonth='${new Date().toISOString().slice(0,7)}';render();">Today</button>
            <button onclick="calMonth='${nextMonth()}';render();">&rsaquo;</button>
          </div>
          <a href="#flights/new" data-nav="flights/new" class="btn primary">${I.plus}Request flight</a>
        </div>
      </div>
      <div class="cal-grid">
        ${dows.map(d=>raw`<div class="cal-dow">${d}</div>`).join('')}
        ${cells.map(cell=>{
          const dayFlights = flights.filter(f=>f.departure.date===cell.date);
          return raw`
            <div class="cal-cell ${cell.muted?'muted':''} ${cell.date===today?'today':''}">
              <div class="cal-num">${cell.num}</div>
              ${dayFlights.map(f=>raw`
                <a class="cal-flight ${h`${f.status}`}" onclick="navigate('#flights/${f.id}')">
                  <strong>${h`${f.departure.time}`} &middot; ${h`${f.departure.airport}`}&rarr;${h`${f.arrival.airport}`}</strong>
                </a>
              `).join('')}
            </div>`;
        }).join('')}
      </div>
      <div style="display:flex;gap:24px;justify-content:center;margin-top:20px;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--ash);">
        <span><span style="display:inline-block;width:10px;height:10px;border-left:2px solid var(--gold);background:rgba(160,132,80,.1);margin-right:6px;"></span>Confirmed</span>
        <span><span style="display:inline-block;width:10px;height:10px;border-left:2px solid var(--amber);background:rgba(217,165,83,.1);margin-right:6px;"></span>Requested</span>
        <span><span style="display:inline-block;width:10px;height:10px;border-left:2px solid var(--green);background:rgba(127,167,123,.08);margin-right:6px;"></span>Completed</span>
      </div>
    </div>`;
}

function computeNextInspection(m){
  // Returns the soonest VISIBLE inspection (annual or phase), or null if all hidden/empty.
  const candidates = [];
  if (m.annual_visible !== false && m.next_annual){
    const d = daysFromNow(m.next_annual);
    candidates.push({ daysEquiv: d, value: d, unit: 'days', label: 'Annual · ' + fmtDate(m.next_annual) });
  }
  if (m.phases_visible !== false && Array.isArray(m.phases)){
    m.phases.forEach(p => {
      const hobbsRemaining = (p.hobbs_at != null) ? (p.hobbs_at - m.hobbs_current) : null;
      const daysRemaining = p.due_date ? daysFromNow(p.due_date) : null;
      if (hobbsRemaining != null){
        candidates.push({ daysEquiv: (hobbsRemaining/3)*7, value: hobbsRemaining.toFixed(1), unit: 'hrs', label: p.name });
      }
      if (daysRemaining != null){
        candidates.push({ daysEquiv: daysRemaining, value: daysRemaining, unit: 'days', label: p.name + ' · ' + fmtDate(p.due_date) });
      }
    });
  }
  if (candidates.length === 0) return null;
  candidates.sort((a,b)=>a.daysEquiv - b.daysEquiv);
  return candidates[0];
}

function renderPhaseCard(p, hobbsCurrent){
  // Compute "binding constraint" — whichever (hobbs or date) is sooner
  const hobbsRemaining = (p.hobbs_at != null) ? (p.hobbs_at - hobbsCurrent) : null;
  const daysRemaining = p.due_date ? daysFromNow(p.due_date) : null;

  // Choose which to lead with — the sooner one
  // Convert both to "days-ish" for comparison: assume ~3 hrs flown per week
  let lead = null, sub = null;
  if (hobbsRemaining != null && daysRemaining != null){
    const hobbsDaysEquiv = (hobbsRemaining / 3) * 7;  // rough heuristic
    if (hobbsDaysEquiv <= daysRemaining){
      lead = { kind:'hobbs', val: hobbsRemaining };
      sub  = { kind:'date',  val: p.due_date, days: daysRemaining };
    } else {
      lead = { kind:'date', val: p.due_date, days: daysRemaining };
      sub  = { kind:'hobbs', val: hobbsRemaining };
    }
  } else if (hobbsRemaining != null){
    lead = { kind:'hobbs', val: hobbsRemaining };
  } else if (daysRemaining != null){
    lead = { kind:'date', val: p.due_date, days: daysRemaining };
  } else {
    lead = { kind:'none' };
  }

  // Progress bar based on leading constraint
  let pct = 0, value = '', sublabel = '';
  if (lead.kind === 'hobbs'){
    value = raw`${lead.val.toFixed(1)} <em style="font-style:italic;color:var(--gold);">hrs</em>`;
    if (p.hobbs_at){
      pct = Math.max(0, Math.min(100, (hobbsCurrent / p.hobbs_at) * 100));
    }
    sublabel = `Current: ${hobbsCurrent.toFixed(1)} hrs · At: ${p.hobbs_at} hrs`;
  } else if (lead.kind === 'date'){
    value = raw`${lead.days} <em style="font-style:italic;color:var(--gold);">days</em>`;
    pct = Math.max(0, Math.min(100, ((365 - lead.days) / 365) * 100));
    sublabel = `Due ${fmtDate(p.due_date)}`;
  } else {
    value = raw`<em style="font-style:italic;color:var(--ash);">—</em>`;
    sublabel = 'No threshold set';
  }

  const sublineHTML = sub ? raw`<div style="font-family:var(--serif);font-size:12px;font-style:italic;color:var(--ash);margin-top:4px;">or ${sub.kind==='hobbs'?`${sub.val.toFixed(1)} hrs`:`by ${fmtDateShort(sub.val)}`}</div>` : '';

  return raw`
    <div class="mx-card">
      <div class="mx-card-label">${h`${p.name}`}</div>
      <div style="font-family:var(--serif);font-size:30px;font-weight:300;color:var(--charcoal);line-height:1;">${value}</div>
      ${sublineHTML}
      <div class="mx-progress" style="margin-top:14px;"><div class="mx-progress-bar ${pct>85?'warn':''} ${pct>95?'critical':''}" style="width:${pct}%"></div></div>
      <div class="mx-meta"><span>${h`${sublabel}`}</span></div>
    </div>`;
}

function ownerApprovals(clientId){
  const c = state.clients.find(x=>x.id===clientId);
  if (!c) return errorView('Client not found');
  const all = state.approvals.filter(a=>a.client_id===clientId).sort((a,b)=>b.date.localeCompare(a.date));
  const pending = all.filter(a=>a.status==='pending');
  const decided = all.filter(a=>a.status!=='pending');

  const renderOptions = (opts) => raw`
    <div class="bid-list">
      ${opts.map(o=>raw`
        <div class="bid ${o.recommended?'rec':''}">
          <div class="bid-main">
            <div class="bid-vendor">${h`${o.vendor}`}${o.recommended?raw`<span class="bid-rec-tag">Recommended</span>`:''}</div>
            ${o.note?raw`<div class="bid-note">${h`${o.note}`}</div>`:''}
          </div>
          <div class="bid-amount">${fmtMoney(o.amount)}</div>
        </div>
      `).join('')}
    </div>`;

  return raw`
    ${topbar('Approvals', pending.length ? pending.length + ' waiting on you' : 'Nothing pending')}
    <div class="view">
      ${pending.length ? pending.map(a=>raw`
        <div class="approval-card">
          <div class="approval-head">
            <div>
              <div class="approval-cat">${h`${a.category}`}</div>
              <h3 class="approval-title">${h`${a.title}`}</h3>
            </div>
            <div class="approval-date">Sent ${fmtDateShort(a.date)}</div>
          </div>
          <p class="approval-desc">${h`${a.description}`}</p>
          ${renderOptions(a.options)}
          ${a.recommendation?raw`
            <div class="approval-rec">
              <div class="approval-rec-label">J3T recommendation</div>
              <div class="approval-rec-text">${h`${a.recommendation}`}</div>
            </div>` : ''}
          <div class="approval-actions">
            <button class="btn primary" onclick="respondApproval('${a.id}','approved')">Approve recommendation</button>
            <button class="btn ghost" onclick="respondApproval('${a.id}','call')">Call me first</button>
            <button class="btn ghost" onclick="respondApproval('${a.id}','declined')">Decline</button>
          </div>
        </div>
      `).join('') : raw`<div class="empty"><h3>All clear</h3><p>Nothing needs your decision right now. We'll bring big-ticket items here with the quotes attached.</p></div>`}

      ${decided.length ? raw`
      <div class="section" style="margin-top:32px;">
        <div class="section-head"><h2 class="section-title">Decision <em>history</em></h2></div>
        <div class="table-wrap"><table class="table">
          <thead><tr><th>Date</th><th>Item</th><th>Decision</th></tr></thead>
          <tbody>
            ${decided.map(a=>raw`
              <tr>
                <td>${fmtDate(a.responded_at||a.date)}</td>
                <td><strong>${h`${a.title}`}</strong></td>
                <td><span class="pill ${a.status==='approved'?'paid':(a.status==='declined'?'cancelled':'pending')}">${a.status==='call'?'Call requested':a.status}</span>${a.response_note?raw` <span class="muted" style="margin-left:8px;">${h`${a.response_note}`}</span>`:''}</td>
              </tr>
            `).join('')}
          </tbody>
        </table></div>
      </div>` : ''}

      <div style="margin-top:24px;padding:18px;background:var(--cream);border-left:3px solid var(--gold);font-family:var(--serif);font-style:italic;color:var(--ash);">
        Nothing over your threshold moves without your tap. Your current company sends you an invoice. We send you the quotes and a recommendation, and you decide.
      </div>
    </div>`;
}

function respondApproval(id, decision){
  const a = state.approvals.find(x=>x.id===id);
  if (!a) return;
  a.status = decision;
  a.responded_at = new Date().toISOString().slice(0,10);
  a.response_note = decision==='approved' ? 'Approved recommendation.' : (decision==='call' ? 'Owner requested a call.' : 'Declined.');
  saveState();
  toast(decision==='approved' ? 'Approved — J3T notified' : (decision==='call' ? 'We will call you shortly' : 'Declined — J3T notified'));
  render();
}

function buildTripText(f, c){
  const picPhone = f.crew.pic ? crewContact(f.crew.pic) : null;
  const sicPhone = f.crew.sic ? crewContact(f.crew.sic) : null;
  const L = [];
  L.push('J3T · Trip Card');
  L.push(c.aircraft.tail + ' · ' + c.aircraft.model);
  L.push(fmtDate(f.departure.date,{weekday:'short',month:'short',day:'numeric'}) + ' · Wheels-up ' + f.departure.time);
  L.push(f.departure.airport + ' -> ' + f.arrival.airport);
  L.push('');
  L.push('Crew');
  if (f.crew.pic) L.push('  ' + f.crew.pic + (picPhone?' · '+picPhone:''));
  if (f.crew.sic) L.push('  ' + f.crew.sic + (sicPhone?' · '+sicPhone:''));
  if (f.arr_fbo){
    L.push('');
    L.push('Arrival FBO');
    L.push('  ' + f.arr_fbo.name);
    L.push('  ' + f.arr_fbo.address);
    if (f.arr_fbo.phone) L.push('  ' + f.arr_fbo.phone);
  }
  if (f.ground){ L.push(''); L.push('Ground: ' + f.ground); }
  if (f.catering){ L.push('Catering: ' + f.catering); }
  return L.join('\n');
}

function b64urlEncode(str){
  return btoa(unescape(encodeURIComponent(str))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function buildTripPayload(f, c){
  const picPhone = f.crew.pic ? crewContact(f.crew.pic) : null;
  const sicPhone = f.crew.sic ? crewContact(f.crew.sic) : null;
  const cr = [];
  if (f.crew.pic) cr.push([f.crew.pic, picPhone || '']);
  if (f.crew.sic) cr.push([f.crew.sic, sicPhone || '']);
  return {
    t:c.aircraft.tail, m:c.aircraft.model, d:f.departure.date,
    dc:f.departure.airport, dt:f.departure.time, dn:f.departure.name,
    ac:f.arrival.airport, at:f.arrival.time, an:f.arrival.name,
    cr:cr,
    fn:f.arr_fbo?f.arr_fbo.name:'', fa:f.arr_fbo?f.arr_fbo.address:'', fp:f.arr_fbo?f.arr_fbo.phone:'',
    g:f.ground||'', ca:f.catering||'', px:f.passengers.count, pn:f.passengers.primary
  };
}
function buildTripLink(f, c){
  const base = location.href.split('#')[0].replace(/[^/]*$/, '');  // .../portal/
  return base + 'trip.html#' + b64urlEncode(JSON.stringify(buildTripPayload(f, c)));
}

function deleteClient(id){
  if (!confirm('Delete this client? Their flights and data will also be removed.')) return;
  state.clients = state.clients.filter(c=>c.id!==id);
  state.flights = state.flights.filter(f=>f.client_id!==id);
  state.notifications = state.notifications.filter(n=>n.client_id!==id);
  saveState();
  toast('Client deleted');
  location.hash = '#admin';
}

/* ============== ADMIN: MASTER CALENDAR ============== */
let adminCalMonth = null;
function adminMasterCalendar(){
  if (!adminCalMonth) adminCalMonth = new Date().toISOString().slice(0,7);
  const [yr,mo] = adminCalMonth.split('-').map(Number);
  const firstDay = new Date(yr,mo-1,1);
  const startDow = firstDay.getDay();
  const daysInMonth = new Date(yr,mo,0).getDate();
  const monthName = firstDay.toLocaleString('en-US',{month:'long',year:'numeric'});
  const today = new Date().toISOString().slice(0,10);

  const cells=[];
  for (let i=0;i<startDow;i++){const d=new Date(yr,mo-1,-(startDow-1-i));cells.push({date:d.toISOString().slice(0,10),num:d.getDate(),muted:true});}
  for (let d=1;d<=daysInMonth;d++){const ds=`${yr}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`;cells.push({date:ds,num:d,muted:false});}
  while (cells.length<42){const last=new Date(cells[cells.length-1].date);last.setDate(last.getDate()+1);cells.push({date:last.toISOString().slice(0,10),num:last.getDate(),muted:true});}

  const dows=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

  function prev(){const d=new Date(yr,mo-2,1);return d.toISOString().slice(0,7);}
  function next(){const d=new Date(yr,mo,1);return d.toISOString().slice(0,7);}

  return raw`
    ${topbar('Master Calendar', 'All clients · all flights')}
    <div class="view">
      <div class="cal-head">
        <h2 class="cal-month">${monthName}</h2>
        <div style="display:flex;gap:12px;align-items:center;">
          <div class="cal-nav">
            <button onclick="adminCalMonth='${prev()}';render();">&lsaquo;</button>
            <button onclick="adminCalMonth='${new Date().toISOString().slice(0,7)}';render();">Today</button>
            <button onclick="adminCalMonth='${next()}';render();">&rsaquo;</button>
          </div>
          <a href="#admin/flights/new" data-nav="admin/flights/new" class="btn primary">${I.plus}New flight</a>
        </div>
      </div>
      <div class="cal-grid">
        ${dows.map(d=>raw`<div class="cal-dow">${d}</div>`).join('')}
        ${cells.map(cell=>{
          const dayFlights = state.flights.filter(f=>f.departure.date===cell.date);
          return raw`
            <div class="cal-cell ${cell.muted?'muted':''} ${cell.date===today?'today':''}">
              <div class="cal-num">${cell.num}</div>
              ${dayFlights.map(f=>{
                const c = state.clients.find(x=>x.id===f.client_id);
                if (!c) return '';
                return raw`
                  <a class="cal-flight master ${h`${f.status}`}" style="border-left-color:${c.color};background:${c.color}18;color:${c.color};" onclick="navigate('#admin/flights/${f.id}')">
                    <strong><span class="client-dot" style="background:${c.color};"></span>${h`${f.departure.time}`} · ${h`${f.departure.airport}`}→${h`${f.arrival.airport}`}</strong>
                    <div class="cal-flight-tip">
                      <strong>${h`${c.name}`}</strong>
                      ${h`${c.aircraft.tail}`} · ${h`${c.aircraft.model}`}<br>
                      ${h`${f.departure.airport}`}→${h`${f.arrival.airport}`} · ${h`${f.departure.time}`}<br>
                      PIC: ${h`${f.crew.pic||'unassigned'}`} · SIC: ${h`${f.crew.sic||'unassigned'}`}<br>
                      Status: ${h`${f.status}`}
                      ${f.notes?raw`<br><em style="color:var(--stone);">${h`${f.notes}`}</em>`:''}
                    </div>
                  </a>
                `;
              }).join('')}
            </div>`;
        }).join('')}
      </div>
      <div class="client-legend">
        ${state.clients.map(c=>raw`<span class="client-legend-item"><span class="dot" style="background:${c.color};"></span>${h`${c.name.split(' ')[0]} · ${c.aircraft.tail}`}</span>`).join('')}
      </div>
    </div>`;
}

/* ============== ADMIN: ALL FLIGHTS ============== */
function adminAllFlights(){
  const q = window.adminFlightFilter || {client:'all',status:'all'};
  let flights = [...state.flights];
  if (q.client !== 'all') flights = flights.filter(f=>f.client_id===q.client);
  if (q.status !== 'all') flights = flights.filter(f=>f.status===q.status);
  flights.sort((a,b)=>b.departure.date.localeCompare(a.departure.date));

  return raw`
    ${topbar('All Flights', flights.length + ' shown')}
    <div class="view">
      <div class="filter-bar">
        <label>Client:</label>
        <select onchange="window.adminFlightFilter={...(window.adminFlightFilter||{client:'all',status:'all'}),client:this.value};render();">
          <option value="all">All clients</option>
          ${state.clients.map(c=>raw`<option value="${c.id}" ${q.client===c.id?'selected':''}>${h`${c.name}`} (${h`${c.aircraft.tail}`})</option>`).join('')}
        </select>
        <label>Status:</label>
        <select onchange="window.adminFlightFilter={...(window.adminFlightFilter||{client:'all',status:'all'}),status:this.value};render();">
          <option value="all">All</option>
          <option value="requested" ${q.status==='requested'?'selected':''}>Requested</option>
          <option value="confirmed" ${q.status==='confirmed'?'selected':''}>Confirmed</option>
          <option value="completed" ${q.status==='completed'?'selected':''}>Completed</option>
          <option value="cancelled" ${q.status==='cancelled'?'selected':''}>Cancelled</option>
        </select>
        <a href="#admin/flights/new" data-nav="admin/flights/new" class="btn primary" style="margin-left:auto;">${I.plus}New flight</a>
      </div>
      ${flights.length===0 ? raw`<div class="empty"><h3>No flights match</h3></div>` : raw`
      <div class="table-wrap"><table class="table">
        <thead><tr><th>Date</th><th>Client</th><th>Route</th><th>PIC</th><th>Status</th><th class="num">Invoice</th></tr></thead>
        <tbody>
          ${flights.map(f=>{const c=state.clients.find(x=>x.id===f.client_id)||{};return raw`
            <tr onclick="navigate('#admin/flights/${f.id}')">
              <td>${fmtDate(f.departure.date)} ${h`${f.departure.time||''}`}</td>
              <td><span class="client-dot" style="background:${c.color||'#999'};display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;"></span><strong>${h`${c.name||'?'}`}</strong><br><span class="muted" style="font-size:11px;">${h`${c.aircraft?c.aircraft.tail:'?'}`}</span></td>
              <td><strong>${h`${f.departure.airport}`} → ${h`${f.arrival.airport}`}</strong></td>
              <td class="muted">${h`${f.crew.pic||'unassigned'}`}</td>
              <td><span class="pill ${h`${f.status}`}">${h`${f.status}`}</span></td>
              <td class="num">${f.invoice?raw`${fmtMoney(f.invoice.amount)} <span class="pill ${h`${f.invoice.status}`}" style="margin-left:6px;">${h`${f.invoice.status}`}</span>`:'—'}</td>
            </tr>
          `;}).join('')}
        </tbody>
      </table></div>`}
    </div>`;
}

/* Receipt upload + AI OCR simulation */
function handleReceiptUpload(input){
  const file = input.files && input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    const url = e.target.result;
    const preview = document.getElementById('receiptPreview');
    preview.innerHTML = raw`
      <div class="receipt-preview">
        <img src="${url}" alt="Receipt">
        <div class="receipt-ai-status" id="ocrStatus">
          <div class="step active" data-s="1"><span class="spin"></span> Uploading image…</div>
          <div class="step" data-s="2">Detecting text regions…</div>
          <div class="step" data-s="3">Extracting vendor / amount / date…</div>
          <div class="step" data-s="4">Categorizing…</div>
        </div>
      </div>`;
    runOCRSim(url);
  };
  reader.readAsDataURL(file);
}

function runOCRSim(imageUrl){
  // Simulate AI extraction with reasonable random defaults
  const vendors = {
    fuel: ['Avfuel KAPF', 'Signature Aviation', 'Atlantic Aviation KSEA', 'Million Air KDAL', 'World Fuel'],
    fbo: ['Naples Jet Center', 'Atlantic KAPF', 'Signature KTEB', 'Million Air'],
    catering: ['Skyline Catering', 'Air Catering Naples', 'DFW Inflight'],
    ground: ['Sentient Cars', 'Town Car NYC'],
    maintenance: ['West Star Aviation', 'Duncan Aviation', 'CessnaSC']
  };
  const cats = Object.keys(vendors);
  const cat = cats[Math.floor(Math.random()*cats.length)];
  const vendor = vendors[cat][Math.floor(Math.random()*vendors[cat].length)];
  const amount = (Math.random()*3000 + 200).toFixed(2);
  const desc = cat==='fuel' ? `${Math.floor(Math.random()*300+200)} gal` : '';

  const steps = document.querySelectorAll('#ocrStatus .step');
  const advance = (i, after) => {
    if (i > 0) {
      steps[i-1].classList.remove('active');
      steps[i-1].classList.add('done');
      steps[i-1].querySelector('.spin')?.remove();
    }
    if (i < steps.length) {
      steps[i].classList.add('active');
      steps[i].insertAdjacentHTML('afterbegin','<span class="spin"></span> ');
      setTimeout(() => advance(i+1, after), 500 + Math.random()*400);
    } else {
      after();
    }
  };

  advance(1, () => {
    // After "completion" show the editable form below
    document.getElementById('receiptPreview').insertAdjacentHTML('beforeend', raw`
      <div style="margin-top:14px;padding:14px;background:#fff;border:1px solid var(--gold-pale);">
        <div style="font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--gold);margin-bottom:10px;">AI extracted &middot; review &amp; adjust</div>
        <div class="row2">
          <div class="field light-field"><label>Category</label>
            <select id="ocr_cat">
              ${['fuel','fbo','catering','crew','maintenance','ground','landing','other'].map(c=>raw`<option value="${c}" ${c===cat?'selected':''}>${c}</option>`).join('')}
            </select>
          </div>
          <div class="field light-field"><label>Amount</label><input id="ocr_amt" type="number" step="0.01" value="${amount}"></div>
        </div>
        <div class="field light-field"><label>Vendor</label><input id="ocr_vendor" value="${h`${vendor}`}"></div>
        <div class="field light-field"><label>Description</label><input id="ocr_desc" value="${h`${desc}`}"></div>
        <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px;">
          <button type="button" class="btn ghost sm" onclick="document.getElementById('receiptPreview').innerHTML='';document.getElementById('receiptFile').value='';">Discard</button>
          <button type="button" class="btn primary sm" onclick="saveOcrExpense()">Add to expenses</button>
        </div>
      </div>
    `);
  });
}

function saveOcrExpense(){
  const cat = document.getElementById('ocr_cat').value;
  const amt = parseFloat(document.getElementById('ocr_amt').value)||0;
  const vendor = document.getElementById('ocr_vendor').value.trim();
  const desc = document.getElementById('ocr_desc').value.trim();
  // Switch to expenses tab and add the row
  document.querySelectorAll('.flight-tab').forEach(t => t.classList.toggle('active', t.dataset.tab==='expenses'));
  document.querySelectorAll('.tab-pane').forEach(p => p.classList.toggle('active', p.dataset.pane==='expenses'));
  const list = document.getElementById('expList');
  const div = document.createElement('div');
  div.innerHTML = renderExpenseRow({category:cat,vendor,description:desc,amount:amt}, list.children.length);
  list.appendChild(div.firstElementChild);
  document.getElementById('receiptPreview').innerHTML = '';
  document.getElementById('receiptFile').value = '';
  toast('Expense added from receipt');
}

function addApprovalPrompt(clientId){
  const title = prompt('Title (e.g. "Phase 1-2 inspection — vendor selection")');
  if (!title) return;
  const category = prompt('Category — maintenance / avionics / insurance / other', 'maintenance') || 'other';
  const description = prompt('Description for the owner', '') || '';
  const options = [];
  while (options.length < 5){
    const vendor = prompt('Bid ' + (options.length+1) + ' — vendor name (leave blank to finish)', '');
    if (!vendor) break;
    const amount = parseFloat(prompt('Bid ' + (options.length+1) + ' — amount ($)', '0')) || 0;
    const note = prompt('Bid ' + (options.length+1) + ' — note (optional)', '') || '';
    options.push({ vendor, amount, note, recommended:false });
  }
  if (options.length === 0){ toast('Need at least one bid'); return; }
  const recIdx = parseInt(prompt('Which bid # do you recommend? (1-' + options.length + ')', '1'), 10);
  if (recIdx>=1 && recIdx<=options.length) options[recIdx-1].recommended = true;
  const recommendation = prompt('Your recommendation note to the owner', '') || '';
  state.approvals.push({
    id:uid('ap'), client_id:clientId, date:new Date().toISOString().slice(0,10),
    status:'pending', title, category, description, options, recommendation,
    responded_at:null, response_note:null
  });
  saveState(); toast('Approval request sent to owner'); render();
}

      e.preventDefault();
      const id = $('#u_id').value;
      const cid = $('#u_cid').value;
      const isPrimary = $('#u_primary').value === '1';
      const existing = state.users.find(x=>x.id===id);
      let tabs = $$('#userForm [data-tab]').filter(cb=>cb.checked).map(cb=>cb.dataset.tab);
      if (isPrimary) tabs = ALL_TAB_KEYS.slice();
      if (tabs.length === 0){ toast('Give the user at least one tab'); return; }
      const email = $('#u_email').value.trim().toLowerCase();
      // prevent duplicate email across users
      const clash = state.users.find(u=>u.email.toLowerCase()===email && u.id!==id);
      if (clash){ toast('That email is already used by another login'); return; }
      const data = {
        id, client_id:cid, email,
        name:$('#u_name').value.trim(), label:$('#u_label').value,
        primary: isPrimary, tabs
      };
      if (existing){ Object.assign(existing, data); toast('User updated'); }
      else { state.users.push(data); toast('User login created'); }
      saveState();
      location.hash = '#admin/clients/' + cid + '/users';
    });
  }
}

</script>
</body>
</html>
