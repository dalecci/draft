<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>J3T Trip Card</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1C1C1C">
<!-- Static branded unfurl (data is client-side in the fragment; crawlers see this generic card) -->
<meta property="og:title" content="J3T Trip Card">
<meta property="og:description" content="Your flight details — crew, FBO, and schedule. Shared by J3T Management.">
<meta property="og:type" content="website">
<meta property="og:image" content="https://j3taviation.com/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Montserrat:wght@300;400;500;600&display=swap">
<style>
:root{--ink:#0F0F0F;--charcoal:#1C1C1C;--warm-white:#F7F5F0;--cream:#EDE9E0;--mist:#D8D4CB;--stone:#9A9488;--gold:#A08450;--gold-light:#C8A96A;--serif:'Cormorant Garamond',Georgia,serif;--sans:'Montserrat',sans-serif;}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html,body{min-height:100%;}
body{font-family:var(--sans);background:var(--charcoal);color:var(--warm-white);display:flex;align-items:flex-start;justify-content:center;padding:24px 16px 40px;min-height:100vh;-webkit-font-smoothing:antialiased;}
.wrap{width:100%;max-width:480px;}
.card{background:linear-gradient(180deg,#1f1f1f,#181818);border:1px solid rgba(160,132,80,.25);padding:38px 32px;position:relative;overflow:hidden;}
.card::after{content:'';position:absolute;top:-50px;right:-50px;width:200px;height:200px;border:1px solid rgba(160,132,80,.12);border-radius:50%;}
.brand{font-family:var(--sans);font-size:17px;font-weight:600;letter-spacing:5px;color:var(--warm-white);}
.brand span{color:var(--gold);}
.tail{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--stone);margin-top:6px;}
.route{display:flex;align-items:center;gap:20px;margin:28px 0 6px;position:relative;z-index:2;}
.ap-code{font-family:var(--serif);font-size:clamp(40px,13vw,52px);font-weight:300;color:var(--warm-white);line-height:1;}
.ap-time{font-size:12px;letter-spacing:2px;color:var(--gold-light);margin-top:5px;}
.ap-name{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--stone);margin-top:3px;}
.arrow{font-family:var(--serif);font-size:28px;color:var(--gold);flex-shrink:0;}
.date{font-family:var(--serif);font-size:19px;font-style:italic;color:var(--stone);margin-top:6px;}
.rule{height:1px;background:rgba(160,132,80,.22);margin:26px 0;}
.sec{margin-bottom:22px;}
.sec-label{font-size:9px;letter-spacing:3px;text-transform:uppercase;color:var(--gold);margin-bottom:9px;}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:4px 0;font-family:var(--serif);font-size:16px;color:var(--warm-white);}
.row.muted{color:var(--stone);font-style:italic;}
.phone{font-family:var(--sans);font-size:13px;color:var(--gold-light);text-decoration:none;white-space:nowrap;border-bottom:1px solid rgba(200,169,106,.3);padding-bottom:1px;}
.fbo-name{font-family:var(--serif);font-size:18px;color:var(--warm-white);}
.addr{display:block;font-size:13px;color:var(--stone);margin:5px 0 7px;line-height:1.45;text-decoration:none;border-bottom:1px solid rgba(154,148,136,.25);padding-bottom:2px;}
.addr:hover{color:var(--gold-light);}
.foot{margin-top:14px;padding-top:16px;border-top:1px solid rgba(160,132,80,.22);display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--stone);}
.pax{}
.shared-by{position:relative;z-index:2;}
.shared-by a{color:var(--gold);text-decoration:none;}
.err{text-align:center;padding:60px 20px;}
.err h1{font-family:var(--serif);font-size:30px;font-weight:300;color:var(--warm-white);margin-bottom:12px;}
.err p{font-family:var(--serif);font-size:17px;font-style:italic;color:var(--stone);}
.tag{text-align:center;margin-top:22px;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:rgba(154,148,136,.6);}
.tag span{color:var(--gold);}
</style>
</head>
<body>
<div class="wrap" id="root"></div>
<script>
function decodePayload(s){
  s = s.replace(/-/g,'+').replace(/_/g,'/');
  while (s.length % 4) s += '=';
  return JSON.parse(decodeURIComponent(escape(atob(s))));
}
function esc(x){ return String(x==null?'':x).replace(/[<>&"]/g, c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c])); }
function telHref(p){ return 'tel:' + String(p).replace(/[^0-9+]/g,''); }
function fmtDate(d){
  try{ return new Date(d+'T12:00:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'}); }
  catch(e){ return d; }
}
function render(){
  const root = document.getElementById('root');
  const hash = location.hash.replace(/^#/,'');
  if (!hash){
    root.innerHTML = '<div class="card err"><h1>No trip loaded</h1><p>This link is missing its trip details.</p></div>';
    return;
  }
  let t;
  try { t = decodePayload(hash); }
  catch(e){
    root.innerHTML = '<div class="card err"><h1>Link not valid</h1><p>This trip link could not be read. Ask J3T to resend it.</p></div>';
    return;
  }
  const crew = (t.cr||[]).map(c => {
    const name = esc(c[0]); const phone = c[1];
    return '<div class="row"><span>'+name+'</span>'+(phone?'<a class="phone" href="'+telHref(phone)+'">'+esc(phone)+'</a>':'')+'</div>';
  }).join('') || '<div class="row muted">Crew assignment pending</div>';

  let fboHTML = '';
  if (t.fn){
    const mapsHref = 'https://maps.google.com/?q='+encodeURIComponent((t.fn||'')+' '+(t.fa||''));
    fboHTML =
      '<div class="sec"><div class="sec-label">Arrival FBO</div>'+
      '<div class="fbo-name">'+esc(t.fn)+'</div>'+
      (t.fa?'<a class="addr" href="'+mapsHref+'" target="_blank" rel="noopener">'+esc(t.fa)+'</a>':'')+
      (t.fp?'<a class="phone" href="'+telHref(t.fp)+'">'+esc(t.fp)+'</a>':'')+
      '</div>';
  }
  const ground = t.g ? '<div class="sec"><div class="sec-label">Ground</div><div class="row">'+esc(t.g)+'</div></div>' : '';
  const cater = t.ca ? '<div class="sec"><div class="sec-label">Catering</div><div class="row">'+esc(t.ca)+'</div></div>' : '';
  const pax = t.px ? '<div class="pax">'+esc(t.px)+' passenger'+(t.px==1?'':'s')+(t.pn?' · '+esc(t.pn):'')+'</div>' : '<div class="pax"></div>';

  root.innerHTML =
    '<div class="card">'+
      '<div class="brand shared-by">J3<span>T</span></div>'+
      '<div class="tail">'+esc(t.t||'')+(t.m?' · '+esc(t.m):'')+'</div>'+
      '<div class="route">'+
        '<div><div class="ap-code">'+esc(t.dc||'')+'</div><div class="ap-time">'+esc(t.dt||'')+'</div>'+(t.dn?'<div class="ap-name">'+esc(t.dn)+'</div>':'')+'</div>'+
        '<div class="arrow">&rarr;</div>'+
        '<div><div class="ap-code">'+esc(t.ac||'')+'</div><div class="ap-time">'+esc(t.at||'')+'</div>'+(t.an?'<div class="ap-name">'+esc(t.an)+'</div>':'')+'</div>'+
      '</div>'+
      '<div class="date">'+esc(fmtDate(t.d))+'</div>'+
      '<div class="rule"></div>'+
      '<div class="sec"><div class="sec-label">Crew</div>'+crew+'</div>'+
      fboHTML + ground + cater +
      '<div class="foot">'+pax+'<span class="shared-by">Shared by <a href="https://j3taviation.com" target="_blank" rel="noopener">J3T</a></span></div>'+
    '</div>'+
    '<div class="tag">Part 91 · Private Aviation · <span>J3TAviation.com</span></div>';
}
window.addEventListener('hashchange', render);
render();
</script>
</body>
</html>
